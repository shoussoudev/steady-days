name: Deploy server functions
on:
  push:
    branches: [main]
    paths: ["functions/**", "firebase.json", "firestore.rules", "storage.rules", ".github/workflows/deploy-functions.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT: steady-days-6a2e7
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
      HAS_MB: ${{ secrets.MANGABAKA_TOKEN != '' }}
      HAS_WK: ${{ secrets.WANIKANI_TOKEN != '' }}
      HAS_BP: ${{ secrets.BUNPRO_TOKEN != '' }}
    steps:
      - name: Waiting for setup
        if: env.HAS_SA != 'true'
        run: echo "Add the FIREBASE_SERVICE_ACCOUNT secret to deploy. Nothing to do yet."
      - uses: actions/checkout@v4
        if: env.HAS_SA == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_SA == 'true'
        with: { node-version: 22 }
      - name: Install function packages
        if: env.HAS_SA == 'true'
        run: npm install --omit=dev --no-audit --no-fund
        working-directory: functions
      - name: Settings for the functions
        if: env.HAS_SA == 'true'
        run: |
          printf 'ALLOWED_EMAILS=%s\nCLAUDE_MODEL=%s\nCLAUDE_MODEL_QUICK=%s\n' "${{ secrets.ALLOWED_EMAILS }}" "${{ vars.CLAUDE_MODEL || 'claude-sonnet-5-5' }}" "${{ vars.CLAUDE_MODEL_QUICK || 'claude-haiku-5-5' }}" > functions/.env
      - name: Sign in to Google Cloud
        if: env.HAS_SA == 'true'
        uses: google-github-actions/auth@v2
        with: { credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" }
      - uses: google-github-actions/setup-gcloud@v2
        if: env.HAS_SA == 'true'
      - name: Switch on the Google services the server uses
        if: env.HAS_SA == 'true'
        run: gcloud services enable secretmanager.googleapis.com cloudscheduler.googleapis.com run.googleapis.com eventarc.googleapis.com pubsub.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com fcm.googleapis.com --project "$PROJECT"
      - name: Placeholder Claude key until a real one is added
        if: env.HAS_SA == 'true' && env.HAS_KEY != 'true'
        run: |
          if ! gcloud secrets describe ANTHROPIC_API_KEY --project "$PROJECT" >/dev/null 2>&1; then
            printf 'not-set' | npx -y firebase-tools@15 functions:secrets:set ANTHROPIC_API_KEY --data-file=- --project "$PROJECT" --non-interactive --force
          fi
      - name: Store the Claude key as a secret
        if: env.HAS_SA == 'true' && env.HAS_KEY == 'true'
        env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: printf '%s' "$ANTHROPIC_API_KEY" | npx -y firebase-tools@15 functions:secrets:set ANTHROPIC_API_KEY --data-file=- --project "$PROJECT" --non-interactive --force
      - name: Placeholder MangaBaka token until a real one is added
        if: env.HAS_SA == 'true' && env.HAS_MB != 'true'
        run: |
          if ! gcloud secrets describe MANGABAKA_TOKEN --project "$PROJECT" >/dev/null 2>&1; then
            printf 'not-set' | npx -y firebase-tools@15 functions:secrets:set MANGABAKA_TOKEN --data-file=- --project "$PROJECT" --non-interactive --force
          fi
      - name: Store the MangaBaka token as a secret
        if: env.HAS_SA == 'true' && env.HAS_MB == 'true'
        env: { MANGABAKA_TOKEN: "${{ secrets.MANGABAKA_TOKEN }}" }
        run: printf '%s' "$MANGABAKA_TOKEN" | npx -y firebase-tools@15 functions:secrets:set MANGABAKA_TOKEN --data-file=- --project "$PROJECT" --non-interactive --force
      - name: Placeholder WaniKani token until a real one is added
        if: env.HAS_SA == 'true' && env.HAS_WK != 'true'
        run: |
          if ! gcloud secrets describe WANIKANI_TOKEN --project "$PROJECT" >/dev/null 2>&1; then
            printf 'not-set' | npx -y firebase-tools@15 functions:secrets:set WANIKANI_TOKEN --data-file=- --project "$PROJECT" --non-interactive --force
          fi
      - name: Store the WaniKani token as a secret
        if: env.HAS_SA == 'true' && env.HAS_WK == 'true'
        env: { WANIKANI_TOKEN: "${{ secrets.WANIKANI_TOKEN }}" }
        run: printf '%s' "$WANIKANI_TOKEN" | npx -y firebase-tools@15 functions:secrets:set WANIKANI_TOKEN --data-file=- --project "$PROJECT" --non-interactive --force
      - name: Placeholder Bunpro token until a real one is added
        if: env.HAS_SA == 'true' && env.HAS_BP != 'true'
        run: |
          if ! gcloud secrets describe BUNPRO_TOKEN --project "$PROJECT" >/dev/null 2>&1; then
            printf 'not-set' | npx -y firebase-tools@15 functions:secrets:set BUNPRO_TOKEN --data-file=- --project "$PROJECT" --non-interactive --force
          fi
      - name: Store the Bunpro token as a secret
        if: env.HAS_SA == 'true' && env.HAS_BP == 'true'
        env: { BUNPRO_TOKEN: "${{ secrets.BUNPRO_TOKEN }}" }
        run: printf '%s' "$BUNPRO_TOKEN" | npx -y firebase-tools@15 functions:secrets:set BUNPRO_TOKEN --data-file=- --project "$PROJECT" --non-interactive --force
      - name: Deploy
        if: env.HAS_SA == 'true'
        run: |
          ONLY="functions,firestore:rules"
          set -o pipefail
          if ! npx -y firebase-tools@15 deploy --only "$ONLY" --project "$PROJECT" --non-interactive --force 2>&1 | tee deploy.log; then
            msg=$(grep -v '^\s*$' deploy.log | grep -iv 'serving at port' | tail -n 14 | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Deploy failed::$msg"
            exit 1
          fi
      - name: Photo storage rules
        if: env.HAS_SA == 'true'
        continue-on-error: true
        run: |
          if npx -y firebase-tools@15 deploy --only storage --project "$PROJECT" --non-interactive --force > storage.log 2>&1; then
            echo "::notice title=Photo rules::Photo storage rules are live."
          else
            msg=$(grep -v '^\s*$' storage.log | tail -n 6 | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::warning title=Photo rules not deployed::$msg"
          fi
      - name: Keep only recent copies of the server code (saves storage)
        if: env.HAS_SA == 'true'
        continue-on-error: true
        run: npx -y firebase-tools@15 functions:artifacts:setpolicy --location europe-west2 --days 3 --project "$PROJECT" --non-interactive --force
