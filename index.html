const JP_DEEP={"desu":{"f":"Noun or な-adjective + です. With い-adjectives, です just adds politeness: 高いです.","n":"です is the polite way to say something is something. It does not change for person (I am, you are, it is are all です). In casual speech it becomes だ or is simply dropped.","ex":[["父は医者です。","ちちはいしゃです。","My father is a doctor."],["この部屋はきれいです。","このへやはきれいです。","This room is clean."],["今日は暑いです。","きょうはあついです。","It's hot today."]],"m":["Don't put です after a verb: say 行きます, not 行くです.","い-adjectives don't need だ in casual speech: 高い, not 高いだ."],"r":["だ: the plain form of です.","でした: the past of です."]},"dewaarimasen":{"f":"Noun or な-adjective + ではありません (formal) or じゃないです / じゃありません (softer).","n":"This is the polite negative of です. ではありません sounds more formal and written; じゃないです is very common in everyday polite speech.","ex":[["これは私の傘じゃないです。","これはわたしのかさじゃないです。","This isn't my umbrella."],["あの店は有名ではありません。","あのみせはゆうめいではありません。","That shop isn't famous."],["明日は休みじゃありません。","あしたはやすみじゃありません。","Tomorrow isn't a day off."]],"m":["い-adjectives don't use じゃない: say 高くないです, not 高いじゃないです.","Keep は in では: it is pronounced wa."],"r":["〜くない: the negative for い-adjectives.","じゃなかったです: was not."]},"deshita":{"f":"Noun or な-adjective + でした. Negative past: じゃなかったです or ではありませんでした.","n":"でした puts です into the past. It is used for nouns and な-adjectives; い-adjectives change their own ending instead.","ex":[["子どものころ、静かでした。","こどものころ、しずかでした。","I was quiet as a child."],["昨日は休みでした。","きのうはやすみでした。","Yesterday was a day off."],["テストは簡単じゃなかったです。","テストはかんたんじゃなかったです。","The test wasn't easy."]],"m":["Don't say 楽しいでした. Use 楽しかったです for い-adjectives."],"r":["〜かった: past for い-adjectives.","だった: the casual form of でした."]},"da":{"f":"Noun or な-adjective + だ. Past: だった. Negative: じゃない.","n":"だ is the plain, casual version of です, used with friends, in diaries and in many grammar patterns. In casual speech it is often dropped, especially in questions.","ex":[["あれは僕の自転車だ。","あれはぼくのじてんしゃだ。","That's my bike."],["昨日は雨だった。","きのうはあめだった。","It was rainy yesterday."],["彼は元気だ。","かれはげんきだ。","He is well."]],"m":["Never use だ after an い-adjective: 寒いだ is wrong.","だ can sound blunt; in polite conversation stay with です."],"r":["です: polite form.","だろう: the casual form of でしょう."]},"wa":{"f":"Noun + は (written は, pronounced wa).","n":"は marks the topic: what the sentence is about. It often contrasts with other things (As for me…). Information after は is the new or important part.","ex":[["私はコーヒーが好きです。","わたしはコーヒーがすきです。","I like coffee."],["日曜日は休みです。","にちようびはやすみです。","Sundays are days off."],["肉は食べますが、魚は食べません。","にくはたべますが、さかなはたべません。","I eat meat, but I don't eat fish."]],"m":["Don't use は after question words like だれ or なに: say だれが来ましたか.","Pronounce it wa, not ha, when it is the particle."],"r":["が: marks the subject and new information.","も: also, replaces は."]},"ga":{"f":"Noun + が.","n":"が marks the subject, especially when it is new information or the answer to a question. It is also used with ある/いる, 好き, 上手, わかる and similar words.","ex":[["だれが来ましたか。","だれがきましたか。","Who came?"],["田中さんが来ました。","たなかさんがきました。","Tanaka came."],["空が青いです。","そらがあおいです。","The sky is blue."]],"m":["Question words take が, not は: なにがいいですか.","With 好き, the thing you like takes が, not を."],"r":["は: topic, often old information.","を: marks the object."]},"wo":{"f":"Noun + を + verb (written を, pronounced o).","n":"を marks the direct object: the thing the action is done to. It also marks the space you move through, like walking along a road or crossing a bridge.","ex":[["本を読みます。","ほんをよみます。","I read a book."],["毎日、日本語を勉強します。","まいにち、にほんごをべんきょうします。","I study Japanese every day."],["公園を散歩します。","こうえんをさんぽします。","I take a walk in the park."]],"m":["好き, わかる and ほしい use が, not を.","Don't use を with ある or いる."],"r":["が: subject marker.","に: target or destination."]},"ni-time":{"f":"Specific time + に: 三時に, 月曜日に, 五月に.","n":"に marks a specific point in time. Relative words like 今日, 明日, 毎日 and 今 don't take に.","ex":[["六時半に起きます。","ろくじはんにおきます。","I get up at half past six."],["土曜日に友だちに会います。","どようびにともだちにあいます。","I'm meeting a friend on Saturday."],["明日、テストがあります。","あした、テストがあります。","There's a test tomorrow."]],"m":["Don't say 明日に or 毎朝に.","With days of the week, に is optional in speech but correct to use."],"r":["ごろ: around (a time).","から / まで: from / until."]},"ni-dest":{"f":"Place + に + movement verb (行く, 来る, 帰る).","n":"に marks where you arrive. It focuses on the goal, while へ focuses on the direction. In everyday speech they are often interchangeable.","ex":[["来週、大阪に行きます。","らいしゅう、おおさかにいきます。","I'm going to Osaka next week."],["七時に家に帰ります。","しちじにいえにかえります。","I go home at seven."],["バスに乗ります。","バスにのります。","I get on the bus."]],"m":["Use で for where an action happens, not に: 家で食べます.","乗る takes に: バスに乗る, not バスを乗る."],"r":["へ: direction.","まで: as far as."]},"he":{"f":"Place + へ (written へ, pronounced e) + movement verb.","n":"へ shows the direction of movement. It feels a bit more about heading somewhere than arriving. It is also used in letters and messages: 母へ (to Mum).","ex":[["駅へ行きます。","えきへいきます。","I'm heading to the station."],["鳥が南へ飛んでいきます。","とりがみなみへとんでいきます。","The birds fly south."],["先生へ","せんせいへ","To my teacher (on a card)"]],"m":["Pronounce it e when it is the particle.","へ is only for movement, not for times: say 三時に, not 三時へ."],"r":["に: destination or arrival point."]},"de-place":{"f":"Place + で + action verb.","n":"で marks where an action happens. Compare に, which marks where something exists or where you go.","ex":[["駅で友だちを待ちます。","えきでともだちをまちます。","I wait for a friend at the station."],["レストランで晩ご飯を食べました。","レストランでばんごはんをたべました。","I ate dinner at a restaurant."],["家で映画を見ます。","いえでえいがをみます。","I watch films at home."]],"m":["Existence uses に: 部屋に猫がいます, not 部屋で猫がいます."],"r":["に: location of existence or destination.","で (means): by / with."]},"de-means":{"f":"Tool, transport or language + で.","n":"で marks the means or method: by bus, with chopsticks, in Japanese. It answers how you do something.","ex":[["はしで食べます。","はしでたべます。","I eat with chopsticks."],["日本語で話しましょう。","にほんごではなしましょう。","Let's talk in Japanese."],["電車で会社に行きます。","でんしゃでかいしゃにいきます。","I go to work by train."]],"m":["On foot is 歩いて, not 足で.","Don't add に after で: バスで行きます."],"r":["で (place): where an action happens.","と: with a person."]},"no":{"f":"Noun + の + noun.","n":"の links two nouns. The first describes the second: ownership (my book), origin (Japanese car), material or category. It can link several nouns in a row.","ex":[["これは姉のかばんです。","これはあねのかばんです。","This is my older sister's bag."],["日本の車はいいです。","にほんのくるまはいいです。","Japanese cars are good."],["友だちの家の近くです。","ともだちのいえのちかくです。","It's near my friend's house."]],"m":["Don't use の between an い-adjective and a noun: 高い車, not 高いの車.","な-adjectives use な, not の: 静かな部屋."],"r":["な: links な-adjectives to nouns."]},"mo":{"f":"Noun + も. It replaces は, が and を; other particles stay: にも, でも.","n":"も means also or too. With a negative it means not … either. After a number it can stress that something is a lot.","ex":[["弟も来ます。","おとうともきます。","My younger brother is coming too."],["私も肉を食べません。","わたしもにくをたべません。","I don't eat meat either."],["日曜日にも働きます。","にちようびにもはたらきます。","I work on Sundays too."]],"m":["Don't say はも or をも: も replaces them.","For 'and' between nouns use と, not も."],"r":["は: topic marker.","と / や: and."]},"to-and":{"f":"Noun + と + noun.","n":"と joins nouns into a complete list: A and B and nothing else. It only joins nouns, not verbs or sentences.","ex":[["コーヒーとケーキをください。","コーヒーとケーキをください。","Coffee and cake, please."],["犬と猫がいます。","いぬとねこがいます。","There's a dog and a cat."],["月曜日と木曜日にジムに行きます。","げつようびともくようびにジムにいきます。","I go to the gym on Mondays and Thursdays."]],"m":["Don't join sentences with と; use て-form or そして."],"r":["や: an incomplete list.","と (with): together with someone."]},"to-with":{"f":"Person + と + verb.","n":"と marks the person you do something with. 一緒に (together) is often added. Some verbs naturally need と, like 結婚する (marry) and 話す (talk with).","ex":[["母と買い物に行きます。","ははとかいものにいきます。","I go shopping with my mother."],["友だちと一緒に昼ご飯を食べました。","ともだちといっしょにひるごはんをたべました。","I had lunch together with a friend."],["先生と話しました。","せんせいとはなしました。","I talked with my teacher."]],"m":["Don't use で for people: 友だちと, not 友だちで."],"r":["と (and): joins nouns.","に: towards a person (話す to someone, one-way)."]},"ya":{"f":"Noun + や + noun (+ など).","n":"や lists some examples among others: A, B and so on. Adding など at the end makes the 'and others' clearer.","ex":[["机の上にペンやノートがあります。","つくえのうえにペンやノートがあります。","There are pens, notebooks and so on on the desk."],["週末はテニスや水泳をします。","しゅうまつはテニスやすいえいをします。","At weekends I play tennis, swim and so on."],["りんごやみかんなどを買いました。","りんごやみかんなどをかいました。","I bought apples, mandarins and such."]],"m":["Only for nouns; for actions use 〜たり〜たり."],"r":["と: a complete list.","〜たり〜たりする: listing actions."]},"kara-from":{"f":"Time or place + から.","n":"から marks a starting point in time or space, and also the source of something (from a person). It pairs naturally with まで.","ex":[["授業は九時からです。","じゅぎょうはくじからです。","Class starts at nine."],["東京から来ました。","とうきょうからきました。","I came from Tokyo."],["母から手紙をもらいました。","ははからてがみをもらいました。","I received a letter from my mother."]],"m":["Don't confuse with から meaning 'because', which comes after a sentence."],"r":["まで: until / as far as.","から (because)."]},"made":{"f":"Time or place + まで.","n":"まで marks an end point: until a time or as far as a place. It often pairs with から.","ex":[["駅まで歩きます。","えきまであるきます。","I walk to the station."],["月曜日から金曜日まで働きます。","げつようびからきんようびまではたらきます。","I work from Monday to Friday."],["夜遅くまで勉強しました。","よるおそくまでべんきょうしました。","I studied until late at night."]],"m":["まで is until (a continuing action); a deadline (by) is までに, which you'll meet later."],"r":["から: from.","に: destination."]},"ka":{"f":"Sentence + か at the end. In writing, Japanese uses 。 rather than ?.","n":"か turns a polite sentence into a question. In casual speech, rising intonation alone is usual, because plain か can sound rough.","ex":[["これはいくらですか。","これはいくらですか。","How much is this?"],["明日、来ますか。","あした、きますか。","Are you coming tomorrow?"],["日本語がわかりますか。","にほんごがわかりますか。","Do you understand Japanese?"]],"m":["Don't add か to a casual sentence with だ: 学生だか sounds wrong; say 学生?"],"r":["ね: seeking agreement.","〜ませんか: invitation."]},"ne":{"f":"Sentence + ね.","n":"ね asks the listener to agree or confirms something you both know: isn't it?, right? It makes speech warmer and is used constantly in conversation.","ex":[["今日は寒いですね。","きょうはさむいですね。","It's cold today, isn't it?"],["この料理、おいしいですね。","このりょうり、おいしいですね。","This food is delicious, isn't it?"],["じゃあ、三時ですね。","じゃあ、さんじですね。","So, three o'clock, right?"]],"m":["Use よ, not ね, when the listener doesn't already know the information."],"r":["よ: telling someone something new.","よね: I think so, don't you?"]},"yo":{"f":"Sentence + よ.","n":"よ marks information the listener probably doesn't know, or a gentle push: I'm telling you. Overusing it can sound pushy.","ex":[["この映画、おもしろいですよ。","このえいが、おもしろいですよ。","This film is interesting, you know."],["もう八時ですよ。","もうはちじですよ。","It's already eight, you know."],["大丈夫ですよ。","だいじょうぶですよ。","It's fine, don't worry."]],"m":["Don't use よ with a superior to correct them; it can sound like a lecture."],"r":["ね: shared information.","よね: checking your belief."]},"masu":{"f":"Verb stem + ます: 食べる → 食べます, 飲む → 飲みます, する → します, 来る → 来ます.","n":"ます is the polite verb ending used with strangers, at work and in class. The same form covers habits and the future, so 行きます can mean I go or I will go.","ex":[["毎日、六時に起きます。","まいにち、ろくじにおきます。","I get up at six every day."],["明日、友だちに会います。","あした、ともだちにあいます。","I'll see a friend tomorrow."],["よく音楽を聞きます。","よくおんがくをききます。","I often listen to music."]],"m":["Don't use ます forms inside casual chats with close friends; it sounds distant.","う-verbs change the last sound to the い row: 書く → 書きます."],"r":["〜ません: negative.","〜ました: past."]},"masen":{"f":"Verb stem + ません: 行きません, 食べません, しません.","n":"ません is the polite negative for the present and future: I don't, I won't.","ex":[["お酒は飲みません。","おさけはのみません。","I don't drink alcohol."],["明日は来ません。","あしたはきません。","I won't come tomorrow."],["よくわかりません。","よくわかりません。","I don't really understand."]],"m":["Past negative needs でした: 行きませんでした, not 行きませんだった."],"r":["〜ない: the casual negative.","〜ませんでした: did not."]},"mashita":{"f":"Verb stem + ました: 見ました, 行きました, しました.","n":"ました is the polite past: something happened or was done.","ex":[["週末、京都に行きました。","しゅうまつ、きょうとにいきました。","I went to Kyoto at the weekend."],["朝ご飯を食べました。","あさごはんをたべました。","I ate breakfast."],["宿題をしました。","しゅくだいをしました。","I did my homework."]],"m":["Don't mix tenses: 昨日行きます is wrong; say 昨日行きました."],"r":["〜た: the casual past.","〜ませんでした: did not."]},"masendeshita":{"f":"Verb stem + ませんでした.","n":"ませんでした is the polite past negative: didn't do something.","ex":[["昨日は雨で、出かけませんでした。","きのうはあめで、でかけませんでした。","It rained yesterday, so I didn't go out."],["電話に気がつきませんでした。","でんわにきがつきませんでした。","I didn't notice the phone call."],["何も買いませんでした。","なにもかいませんでした。","I didn't buy anything."]],"m":["Not ませんだった; always ませんでした in polite speech."],"r":["〜なかった: casual past negative."]},"mashou":{"f":"Verb stem + ましょう.","n":"ましょう means let's: a suggestion that includes you. It sounds positive and decided.","ex":[["少し休みましょう。","すこしやすみましょう。","Let's rest a little."],["駅で会いましょう。","えきであいましょう。","Let's meet at the station."],["さあ、始めましょう。","さあ、はじめましょう。","Right, let's begin."]],"m":["For a softer invitation, ask with 〜ませんか instead."],"r":["〜ませんか: won't you…?","〜ましょうか: shall I / shall we?"]},"masenka":{"f":"Verb stem + ませんか.","n":"Literally won't you…?, this is the polite way to invite someone. It leaves room for them to say no, so it is softer than ましょう.","ex":[["一緒に昼ご飯を食べませんか。","いっしょにひるごはんをたべませんか。","Would you like to have lunch together?"],["今度、映画を見に行きませんか。","こんど、えいがをみにいきませんか。","Shall we go and see a film sometime?"],["お茶でも飲みませんか。","おちゃでものみませんか。","How about some tea?"]],"m":["The answer isn't いいえ for yes; reply ええ、いいですね or ちょっと…."],"r":["〜ましょう: let's.","〜ましょうか: shall we?"]},"tai":{"f":"Verb stem + たい: 食べたい, 行きたい. It conjugates like an い-adjective: たくない, たかった.","n":"たい expresses your own wish to do something. For other people, Japanese prefers 〜たがっている or 〜たいと言っていました.","ex":[["日本に住みたいです。","にほんにすみたいです。","I want to live in Japan."],["今日は何もしたくないです。","きょうはなにもしたくないです。","I don't want to do anything today."],["子どものころ、先生になりたかったです。","こどものころ、せんせいになりたかったです。","As a child I wanted to become a teacher."]],"m":["Asking a superior 〜たいですか can sound too direct; offer instead.","For things (not actions) use ほしい."],"r":["ほしい: want a thing.","つもり: intend to."]},"hoshii":{"f":"Noun + が + ほしい. Conjugates as an い-adjective.","n":"ほしい means wanting a thing. Like たい, it is for your own wishes.","ex":[["新しい靴がほしいです。","あたらしいくつがほしいです。","I want new shoes."],["時間がほしいです。","じかんがほしいです。","I want more time."],["子どものとき、犬がほしかったです。","こどものとき、いぬがほしかったです。","When I was a child, I wanted a dog."]],"m":["Use が, not を, before ほしい.","For actions use たい: 食べたい, not 食べるがほしい."],"r":["たい: want to do."]},"te-kudasai":{"f":"Verb て-form + ください.","n":"てください is a polite request: please do. It is still a request, not a favour, so with superiors 〜てくださいませんか is softer.","ex":[["ここに名前を書いてください。","ここになまえをかいてください。","Please write your name here."],["ちょっと待ってください。","ちょっとまってください。","Please wait a moment."],["もう一度言ってください。","もういちどいってください。","Please say it once more."]],"m":["て-form must be right: 待つ → 待って, 書く → 書いて, 行く → 行って."],"r":["〜ないでください: please don't.","〜をください: please give me."]},"te-iru":{"f":"Verb て-form + いる (polite: います).","n":"ている describes an action in progress (is eating) or a resulting state (is married, lives in, knows). Many verbs like 住む, 知る and 結婚する are almost always in ている.","ex":[["弟は今、寝ています。","おとうとはいま、ねています。","My younger brother is sleeping now."],["大阪に住んでいます。","おおさかにすんでいます。","I live in Osaka."],["姉は結婚しています。","あねはけっこんしています。","My older sister is married."]],"m":["'I know' is 知っています, but 'I don't know' is 知りません.","In casual speech い often drops: 何してる?"],"r":["〜ています for habits: 毎朝走っています."]},"te-mo-ii":{"f":"Verb て-form + もいい (+ です / ですか).","n":"てもいい gives or asks for permission: it's OK to, may I. As a question it is a polite way to ask.","ex":[["窓を開けてもいいですか。","まどをあけてもいいですか。","May I open the window?"],["ここに座ってもいいですよ。","ここにすわってもいいですよ。","You can sit here."],["先に帰ってもいいです。","さきにかえってもいいです。","You may go home first."]],"m":["To refuse, say すみません、ちょっと… rather than a blunt いいえ."],"r":["〜てはいけない: must not.","〜なくてもいい: don't have to."]},"te-wa-ikenai":{"f":"Verb て-form + はいけない (polite: はいけません).","n":"てはいけない states a rule or prohibition: must not. It is strong; it is common on signs and from parents or teachers.","ex":[["授業中、電話を使ってはいけません。","じゅぎょうちゅう、でんわをつかってはいけません。","You must not use your phone during class."],["この川で泳いではいけません。","このかわでおよいではいけません。","You must not swim in this river."],["夜遅く大きい音を出してはいけません。","よるおそくおおきいおとをだしてはいけません。","You mustn't make loud noise late at night."]],"m":["Pronounce は as wa: tewa ikemasen.","To a superior, avoid this; use 〜ないでください or explain the rule."],"r":["〜てもいい: may.","〜ないでください: please don't."]},"te-kara":{"f":"Verb て-form + から.","n":"てから means after doing A, then B, stressing the order. It often marks a necessary first step.","ex":[["宿題をしてから、遊びます。","しゅくだいをしてから、あそびます。","I'll play after doing my homework."],["日本に来てから、料理を始めました。","にほんにきてから、りょうりをはじめました。","I started cooking after coming to Japan."],["よく考えてから、決めます。","よくかんがえてから、きめます。","I'll decide after thinking carefully."]],"m":["Don't confuse with から (because) after a plain sentence: 来るから means because I'm coming."],"r":["〜たあとで: after.","〜まえに: before."]},"te-sequence":{"f":"Verb て-form + next clause. Tense comes from the last verb.","n":"The て-form links actions in order: did A, (then) did B. It also joins adjectives: 安くて、おいしい.","ex":[["コンビニに行って、パンを買いました。","コンビニにいって、パンをかいました。","I went to the convenience store and bought bread."],["家に帰って、晩ご飯を作ります。","いえにかえって、ばんごはんをつくります。","I'll go home and make dinner."],["この店は安くて、おいしいです。","このみせはやすくて、おいしいです。","This shop is cheap and good."]],"m":["Only the last verb shows past or present.","For nouns and な-adjectives use で: 静かで、きれいです."],"r":["〜てから: stressing after.","〜たり〜たり: listing actions without order."]},"naide-kudasai":{"f":"Verb ない-form + でください: 行かないでください, 食べないでください.","n":"ないでください is a polite request not to do something: please don't.","ex":[["写真を撮らないでください。","しゃしんをとらないでください。","Please don't take photos."],["心配しないでください。","しんぱいしないでください。","Please don't worry."],["忘れないでください。","わすれないでください。","Please don't forget."]],"m":["The ない-form of する is しない, of 来る is こない."],"r":["〜てください: please do.","〜てはいけない: must not."]},"nakereba":{"f":"Verb ない-form minus い + ければなりません: 行かなければなりません. Casual: 行かなきゃ.","n":"なければならない means must, have to, from rules or necessity. In speech people shorten it to なきゃ or なくちゃ.","ex":[["毎日、薬を飲まなければなりません。","まいにち、くすりをのまなければなりません。","I have to take medicine every day."],["もう帰らなければなりません。","もうかえらなければなりません。","I have to go home now."],["明日までにレポートを出さなきゃ。","あしたまでにレポートをださなきゃ。","I've got to hand in the report by tomorrow."]],"m":["It is a double negative: if I don't, it won't do. Keep both parts."],"r":["〜なくてもいい: don't have to."]},"nakutemo-ii":{"f":"Verb ない-form minus い + くてもいい: 来なくてもいいです.","n":"なくてもいい means you don't have to: it's fine not to do it.","ex":[["靴を脱がなくてもいいですよ。","くつをぬがなくてもいいですよ。","You don't need to take your shoes off."],["急がなくてもいいです。","いそがなくてもいいです。","There's no need to hurry."],["全部食べなくてもいいですか。","ぜんぶたべなくてもいいですか。","Is it OK if I don't eat it all?"]],"m":["Don't confuse with てはいけない (must not): different meaning entirely."],"r":["〜なければならない: must.","〜てもいい: may."]},"ta-koto-ga-aru":{"f":"Verb た-form + ことがある (polite: ことがあります).","n":"This talks about experience: have you ever, I have done before. It is not for things done today or very recently.","ex":[["富士山に登ったことがあります。","ふじさんにのぼったことがあります。","I have climbed Mount Fuji."],["すしを食べたことがありますか。","すしをたべたことがありますか。","Have you ever eaten sushi?"],["一度も海外に行ったことがありません。","いちどもかいがいにいったことがありません。","I have never been abroad."]],"m":["Don't use it for this morning: 今朝パンを食べたことがあります is odd."],"r":["〜ました: simple past."]},"tari":{"f":"Verb た-form + り, verb た-form + り + する.","n":"たり〜たりする lists a few actions as examples, without strict order: do things like A and B.","ex":[["休みの日は掃除したり洗濯したりします。","やすみのひはそうじしたりせんたくしたりします。","On days off I do things like cleaning and laundry."],["昨日は友だちと話したり、ゲームをしたりしました。","きのうはともだちとはなしたり、ゲームをしたりしました。","Yesterday I chatted with friends, played games and so on."],["雨が降ったりやんだりしています。","あめがふったりやんだりしています。","It keeps raining on and off."]],"m":["Finish with する: 読んだり書いたりします, not just 読んだり書いたり."],"r":["や: listing nouns.","〜て、〜: actions in order."]},"mae-ni":{"f":"Verb dictionary form + まえに; noun + の + まえに.","n":"まえに means before. The verb before まえに is always in dictionary form, even when the sentence is in the past.","ex":[["食べるまえに、手を洗います。","たべるまえに、てをあらいます。","I wash my hands before eating."],["日本に来るまえに、少し勉強しました。","にほんにくるまえに、すこしべんきょうしました。","I studied a little before coming to Japan."],["授業のまえに、コーヒーを飲みます。","じゅぎょうのまえに、コーヒーをのみます。","I drink coffee before class."]],"m":["Not 来たまえに: always 来るまえに."],"r":["〜たあとで: after.","〜てから: after (order)."]},"ta-ato-de":{"f":"Verb た-form + あとで; noun + の + あとで.","n":"あとで means after. The verb before it is always in た-form, even about the future.","ex":[["映画を見たあとで、食事をしました。","えいがをみたあとで、しょくじをしました。","After seeing the film, we had a meal."],["仕事のあとで、飲みに行きませんか。","しごとのあとで、のみにいきませんか。","Shall we go for a drink after work?"],["ご飯を食べたあとで、薬を飲んでください。","ごはんをたべたあとで、くすりをのんでください。","Please take the medicine after eating."]],"m":["Use た-form even for future: 食べたあとで, not 食べるあとで."],"r":["〜まえに: before.","〜てから: after (order)."]},"nagara":{"f":"Verb stem + ながら: 食べながら, 歩きながら.","n":"ながら means doing two things at the same time by the same person. The main action is the second verb.","ex":[["テレビを見ながら、ご飯を食べます。","テレビをみながら、ごはんをたべます。","I eat while watching TV."],["歌いながら料理します。","うたいながらりょうりします。","I cook while singing."],["歩きながら電話しないでください。","あるきながらでんわしないでください。","Please don't phone while walking."]],"m":["Both actions must be by the same person."],"r":["〜とき: when."]},"ni-iku":{"f":"Verb stem + に + 行く / 来る / 帰る: 買いに行く. With する-nouns: 勉強に行く.","n":"This shows the purpose of going or coming somewhere: go to do something.","ex":[["本を借りに図書館へ行きます。","ほんをかりにとしょかんへいきます。","I'm going to the library to borrow books."],["友だちが遊びに来ました。","ともだちがあそびにきました。","A friend came over to hang out."],["昼ご飯を食べに帰ります。","ひるごはんをたべにかえります。","I'm going home to eat lunch."]],"m":["Use the stem, not the dictionary form: 買いに, not 買うに."],"r":["〜たい: want to."]},"tsumori":{"f":"Verb dictionary form + つもりです; negative: verb ない-form + つもりです.","n":"つもり expresses a plan or intention you have already decided on. It is firmer than 〜たい.","ex":[["夏休みに北海道へ行くつもりです。","なつやすみにほっかいどうへいくつもりです。","I plan to go to Hokkaido in the summer holidays."],["今年はたばこを吸わないつもりです。","ことしはたばこをすわないつもりです。","I intend not to smoke this year."],["週末は何をするつもりですか。","しゅうまつはなにをするつもりですか。","What are you planning to do this weekend?"]],"m":["Asking a superior つもりですか can sound blunt; use ご予定は."],"r":["〜たい: want to.","〜よう (volitional), later."]},"deshou":{"f":"Plain form + でしょう; noun / な-adjective without だ.","n":"でしょう means probably or I suppose. With rising tone it asks for agreement: right?. Casual form: だろう.","ex":[["午後は雨が降るでしょう。","ごごはあめがふるでしょう。","It will probably rain in the afternoon."],["彼はもう着いたでしょう。","かれはもうついたでしょう。","He has probably arrived by now."],["疲れたでしょう?","つかれたでしょう?","You must be tired, right?"]],"m":["Don't say 学生だでしょう; drop だ: 学生でしょう."],"r":["だろう: casual version.","と思います: I think."]},"kara-because":{"f":"Reason + から, result. Works with plain or polite forms.","n":"から gives a reason, often a personal or subjective one. The result can be left unsaid to sound softer.","ex":[["時間がないから、タクシーで行きます。","じかんがないから、タクシーでいきます。","I don't have time, so I'll take a taxi."],["明日は早いですから、もう寝ます。","あしたははやいですから、もうねます。","I'm up early tomorrow, so I'll go to bed now."],["どうして来なかったの? 雨だったから。","どうしてこなかったの? あめだったから。","Why didn't you come? Because it was raining."]],"m":["The reason comes first, then から: 寒いから, not から寒い.","With nouns add だ: 雨だから."],"r":["ので: softer because (N4).","だから: so (starting a sentence)."]},"ga-but":{"f":"Sentence + が, sentence.","n":"が joins two sentences with but. It also softens an opening: すみませんが… (excuse me, but…).","ex":[["この店は小さいですが、人気があります。","このみせはちいさいですが、にんきがあります。","This shop is small, but popular."],["行きたいですが、忙しいです。","いきたいですが、いそがしいです。","I want to go, but I'm busy."],["すみませんが、駅はどこですか。","すみませんが、えきはどこですか。","Excuse me, but where is the station?"]],"m":["Don't confuse with the subject marker が; here it comes after a full sentence."],"r":["けど: casual but.","でも: but (starting a sentence)."]},"keredo":{"f":"Sentence + けど / けれど / けれども.","n":"けど is the casual, softer but. けれども is more formal. Ending a sentence with けど leaves it hanging politely: I'd like to, but….","ex":[["高いけど、買います。","たかいけど、かいます。","It's expensive, but I'll buy it."],["日本語は難しいけれども、楽しいです。","にほんごはむずかしいけれども、たのしいです。","Japanese is difficult, but fun."],["ちょっと聞きたいことがあるんですけど…","ちょっとききたいことがあるんですけど…","There's something I'd like to ask…"]],"m":["With nouns add だ: 学生だけど."],"r":["が: but (a little more formal)."]},"dakara":{"f":"だから (casual) / ですから (polite) at the start of a sentence.","n":"だから means so or that's why, linking a new sentence to the reason before it. Said sharply, it can sound like I told you!","ex":[["明日は試験です。だから、今日は勉強します。","あしたはしけんです。だから、きょうはべんきょうします。","I have an exam tomorrow. So today I'll study."],["熱があります。ですから、休みます。","ねつがあります。ですから、やすみます。","I have a fever. So I'll take the day off."],["だから、言ったでしょう。","だから、いったでしょう。","See, I told you."]],"m":["Use ですから in polite speech; だから can sound blunt."],"r":["から: because (inside one sentence)."]},"soshite":{"f":"Sentence。そして、sentence.","n":"そして means and or and then, adding a point or the next step. It is a little formal; speech often uses それから or the て-form instead.","ex":[["彼は優しいです。そして、おもしろいです。","かれはやさしいです。そして、おもしろいです。","He's kind. And he's funny."],["朝ご飯を食べました。そして、会社に行きました。","あさごはんをたべました。そして、かいしゃにいきました。","I ate breakfast. And then I went to work."],["日本語を勉強しています。そして、来年日本に行きます。","にほんごをべんきょうしています。そして、らいねんにほんにいきます。","I'm studying Japanese. And next year I'm going to Japan."]],"m":["Don't use そして to join nouns; use と."],"r":["それから: after that.","〜て、〜: linking actions."]},"demo":{"f":"Sentence。でも、sentence.","n":"でも means but or however at the start of a sentence. It is casual to neutral and very common in speech.","ex":[["雨でした。でも、楽しかったです。","あめでした。でも、たのしかったです。","It rained. But it was fun."],["行きたいです。でも、お金がありません。","いきたいです。でも、おかねがありません。","I want to go. But I don't have money."],["でも、それは本当ですか。","でも、それはほんとうですか。","But is that true?"]],"m":["Don't put でも in the middle of one sentence; use が or けど there."],"r":["が / けど: but, inside one sentence."]},"i-adj":{"f":"い-adjective + noun (新しい車) or + です (新しいです).","n":"い-adjectives end in い and conjugate themselves (くない, かった). They come straight before a noun without the.","ex":[["大きい家に住みたいです。","おおきいいえにすみたいです。","I want to live in a big house."],["このケーキは甘いです。","このケーキはあまいです。","This cake is sweet."],["暑い日には海に行きます。","あついひにはうみにいきます。","On hot days I go to the sea."]],"m":["きれい and 有名 end in い but are な-adjectives.","いい is irregular: よくない, よかった."],"r":["な-adjectives.","〜くない / 〜かった."]},"i-adj-neg":{"f":"Drop い, add くない: 高い → 高くない. いい → よくない.","n":"くない makes an い-adjective negative. Add です for politeness, or use くありません for a more formal tone.","ex":[["この本はおもしろくないです。","このほんはおもしろくないです。","This book isn't interesting."],["駅はあまり遠くないです。","えきはあまりとおくないです。","The station isn't very far."],["今日は気分がよくないです。","きょうはきぶんがよくないです。","I don't feel well today."]],"m":["Not いくない: it's よくない.","Not 高いじゃない: it's 高くない."],"r":["あまり + negative: not very."]},"i-adj-past":{"f":"Drop い, add かった: 楽しい → 楽しかった. Negative past: くなかった.","n":"かった puts an い-adjective in the past. Add です for politeness: 楽しかったです.","ex":[["昨日はとても寒かったです。","きのうはとてもさむかったです。","Yesterday was very cold."],["テストは難しくなかったです。","テストはむずかしくなかったです。","The test wasn't hard."],["パーティーはよかったですね。","パーティーはよかったですね。","The party was good, wasn't it?"]],"m":["Not 楽しいでした.","いい becomes よかった, not いかった."],"r":["でした: past for nouns and な-adjectives."]},"na-adj":{"f":"な-adjective + な + noun (元気な子); + です at the end (元気です).","n":"な-adjectives behave like nouns: they take な before a noun and だ / です at the end. Their negative and past use じゃない and でした.","ex":[["にぎやかな町が好きです。","にぎやかなまちがすきです。","I like lively towns."],["この道は安全です。","このみちはあんぜんです。","This road is safe."],["昔はこの公園は静かでした。","むかしはこのこうえんはしずかでした。","This park used to be quiet."]],"m":["Don't drop な before a noun: 静かな部屋, not 静か部屋.","好き and 嫌い are な-adjectives."],"r":["い-adjectives.","の: linking nouns."]},"ku-naru":{"f":"い-adjective: drop い + くなる. な-adjective or noun + になる.","n":"なる means become; it describes change. Past なりました is very common: it has become.","ex":[["最近、日が短くなりました。","さいきん、ひがみじかくなりました。","The days have become shorter recently."],["部屋がきれいになりました。","へやがきれいになりました。","The room has become clean."],["来月、二十歳になります。","らいげつ、はたちになります。","I'll turn twenty next month."]],"m":["Not 高いになる: 高くなる."],"r":["〜にする: decide on / make into."]},"sugiru":{"f":"Verb stem + すぎる; い-adjective minus い + すぎる; な-adjective + すぎる.","n":"すぎる means too much or overdo. It is usually negative: more than is good.","ex":[["昨日、食べすぎました。","きのう、たべすぎました。","I ate too much yesterday."],["この靴は大きすぎます。","このくつはおおきすぎます。","These shoes are too big."],["この部屋は静かすぎます。","このへやはしずかすぎます。","This room is too quiet."]],"m":["いい becomes よすぎる."],"r":["とても: very (neutral)."]},"no-ga-suki":{"f":"Verb dictionary form + のが好きです.","n":"の turns a verb into a noun (the act of doing), so it can be liked, disliked or be good at: 〜のが好き, 〜のが上手.","ex":[["写真を撮るのが好きです。","しゃしんをとるのがすきです。","I like taking photos."],["朝早く起きるのが苦手です。","あさはやくおきるのがにがてです。","I'm bad at getting up early."],["歌うのが上手ですね。","うたうのがじょうずですね。","You're good at singing."]],"m":["Don't put が directly after a verb: 泳ぐが好き is wrong; say 泳ぐのが好き."],"r":["〜が好き: like (a noun).","こと: another nominaliser (N4)."]},"ga-suki":{"f":"Noun + が + 好き / 嫌い.","n":"好き (like) and 嫌い (dislike) are な-adjectives, so the thing you like is marked with が. 大好き means really like or love.","ex":[["私は猫が大好きです。","わたしはねこがだいすきです。","I really love cats."],["野菜が嫌いです。","やさいがきらいです。","I dislike vegetables."],["どんな食べ物が好きですか。","どんなたべものがすきですか。","What kind of food do you like?"]],"m":["Not を好きです in N5 speech; use が.","Saying 嫌い directly about people is strong; 好きじゃない is softer."],"r":["〜のが好き: like doing."]},"ga-jouzu":{"f":"Noun + が + 上手 / 下手.","n":"上手 (good at) and 下手 (bad at) describe skill. Avoid calling yourself 上手; use 得意 (my strong point) instead. 苦手 means weak at.","ex":[["彼女は料理が上手です。","かのじょはりょうりがじょうずです。","She's good at cooking."],["私は絵が下手です。","わたしはえがへたです。","I'm bad at drawing."],["数学が得意です。","すうがくがとくいです。","Maths is my strong point."]],"m":["Don't praise yourself with 上手; use 得意."],"r":["〜のが上手: good at doing."]},"ga-wakaru":{"f":"Noun + が + わかる.","n":"わかる means understand or know (a fact, a language). The thing understood takes が. 'I see' or 'Got it' is わかりました.","ex":[["英語がわかりますか。","えいごがわかりますか。","Do you understand English?"],["この問題がわかりません。","このもんだいがわかりません。","I don't understand this problem."],["わかりました。すぐ行きます。","わかりました。すぐいきます。","Understood. I'll come right away."]],"m":["Not を分かります; use が."],"r":["知っている: know (people, facts)."]},"ga-aru":{"f":"Place + に + thing + が + ある (polite: あります).","n":"ある means there is for things and plants. It is also used for events (a test, a party) and for having something.","ex":[["冷蔵庫に牛乳があります。","れいぞうこにぎゅうにゅうがあります。","There's milk in the fridge."],["明日、会議があります。","あした、かいぎがあります。","There's a meeting tomorrow."],["時間がありますか。","じかんがありますか。","Do you have time?"]],"m":["Use いる for people and animals.","Negative is ない / ありません, not あらない."],"r":["いる: for living things."]},"ga-iru":{"f":"Place + に + person/animal + が + いる (polite: います).","n":"いる means there is for people and animals. It also expresses having family or pets.","ex":[["教室に学生が十人います。","きょうしつにがくせいがじゅうにんいます。","There are ten students in the classroom."],["私には兄が二人います。","わたしにはあにがふたりいます。","I have two older brothers."],["庭に鳥がいますよ。","にわにとりがいますよ。","There's a bird in the garden."]],"m":["Don't use ある for people or animals."],"r":["ある: for things.","〜ている: ongoing action."]},"no-naka-de":{"f":"Group + の中で + X + が一番 + adjective.","n":"This picks the top item in a group: among…, X is the most…. For a question use どれ / なに / だれ / どこ + が一番.","ex":[["スポーツの中でサッカーが一番好きです。","スポーツのなかでサッカーがいちばんすきです。","Of all sports, I like football the most."],["家族の中でだれが一番背が高いですか。","かぞくのなかでだれがいちばんせがたかいですか。","Who is the tallest in your family?"],["一年の中で十月が一番好きです。","いちねんのなかでじゅうがつがいちばんすきです。","October is my favourite month of the year."]],"m":["Use が after the winner, not は: X が一番."],"r":["より: comparing two.","〜と〜とどちらが: which of two."]},"yori":{"f":"A は B より + adjective: A is more … than B.","n":"より marks what you compare against (than B). Japanese adjectives don't change for more; より does the work.","ex":[["今日は昨日より暖かいです。","きょうはきのうよりあたたかいです。","Today is warmer than yesterday."],["弟は私より背が高いです。","おとうとはわたしよりせがたかいです。","My younger brother is taller than me."],["バスより電車のほうが便利です。","バスよりでんしゃのほうがべんりです。","The train is more convenient than the bus."]],"m":["Don't add もっと unnecessarily; より alone already means more than."],"r":["〜のほうが: the one that is more.","の中で一番: the most."]},"to-dochira":{"f":"A と B と どちらが + adjective + ですか.","n":"This asks which of two is more…. The answer usually uses ほうが: A のほうが….","ex":[["肉と魚とどちらが好きですか。","にくとさかなとどちらがすきですか。","Which do you prefer, meat or fish?"],["電車とバスとどちらが速いですか。","でんしゃとバスとどちらがはやいですか。","Which is faster, the train or the bus?"],["どちらも好きです。","どちらもすきです。","I like both."]],"m":["For three or more options, use の中で…一番 instead."],"r":["〜のほうが: answering.","どっち: casual どちら."]},"hou-ga":{"f":"Noun + の + ほうが; adjective / verb + ほうが.","n":"ほうが points to the side that is more…, often answering a which-question or giving a preference.","ex":[["夏のほうが好きです。","なつのほうがすきです。","I prefer summer."],["こっちのほうが安いですよ。","こっちのほうがやすいですよ。","This one is cheaper, you know."],["早く寝るほうがいいです。","はやくねるほうがいいです。","It's better to go to bed early."]],"m":["Nouns need の: 夏のほうが, not 夏ほうが."],"r":["より: than.","〜たほうがいい: you'd better (N4)."]},"mada":{"f":"まだ + verb て-form + いません.","n":"まだ〜ていない means not yet, expecting it will happen. Answering 'not yet' alone: まだです. Note まだ with a positive means still.","ex":[["まだ昼ご飯を食べていません。","まだひるごはんをたべていません。","I haven't eaten lunch yet."],["もう決めましたか。いいえ、まだです。","もうきめましたか。いいえ、まだです。","Have you decided? No, not yet."],["彼はまだ寝ています。","かれはまだねています。","He's still sleeping."]],"m":["'Not yet' needs ていません, not ませんでした: まだ食べていません."],"r":["もう: already."]},"mou":{"f":"もう + past verb (already); もう + negative (no longer / not any more).","n":"もう means already with a past action, and not any more with a negative. もう一つ means one more.","ex":[["もう宿題が終わりました。","もうしゅくだいがおわりました。","I've already finished my homework."],["もうお腹がいっぱいです。","もうおなかがいっぱいです。","I'm already full."],["彼はもうここに住んでいません。","かれはもうここにすんでいません。","He doesn't live here any more."]],"m":["Don't mix up もう (already) and まだ (yet / still)."],"r":["まだ: not yet / still."]},"kosoado":{"f":"この / その / あの / どの + noun.","n":"こ = near me, そ = near you, あ = away from both of us, ど = which. この, その, あの and どの always need a noun after them.","ex":[["このかばんはいくらですか。","このかばんはいくらですか。","How much is this bag?"],["その本、おもしろいですか。","そのほん、おもしろいですか。","Is that book (near you) interesting?"],["どの電車に乗りますか。","どのでんしゃにのりますか。","Which train will you take?"]],"m":["Not これ本: これ stands alone; with a noun use この本."],"r":["これ / それ / あれ / どれ: stand-alone this/that.","ここ / そこ / あそこ: places."]},"koko":{"f":"ここ / そこ / あそこ / どこ, used like nouns.","n":"These point to places, using the same こそあど pattern. Polite versions are こちら / そちら / あちら / どちら, which also mean this way, this person.","ex":[["ここで待っていてください。","ここでまっていてください。","Please wait here."],["あそこにコンビニがあります。","あそこにコンビニがあります。","There's a convenience store over there."],["出口はどちらですか。","でぐちはどちらですか。","Which way is the exit?"]],"m":["Don't add の between ここ and a verb: ここで食べます."],"r":["この / その / あの: + noun."]},"dare":{"f":"Question words sit where the answer would go; they take が, not は.","n":"だれ (who), なに / なん (what), いつ (when). なん is used before d, t, n sounds and counters: 何時, 何人. どなた is a polite who.","ex":[["あの人はだれですか。","あのひとはだれですか。","Who is that person?"],["何を飲みますか。","なにをのみますか。","What will you drink?"],["誕生日はいつですか。","たんじょうびはいつですか。","When is your birthday?"]],"m":["いつ usually doesn't take に: いつ来ますか.","Question words + が, not は: だれが行きますか."],"r":["どこ: where.","どうして: why."]},"ikura":{"f":"いくら for prices or amounts; いくつ for counting things or age.","n":"いくら asks how much (money). いくつ asks how many small things, and also age, politely おいくつ.","ex":[["このりんごはいくらですか。","このりんごはいくらですか。","How much are these apples?"],["卵はいくつありますか。","たまごはいくつありますか。","How many eggs are there?"],["お子さんはおいくつですか。","おこさんはおいくつですか。","How old is your child?"]],"m":["Don't use いくつ for money."],"r":["何人 / 何枚: counters with なん."]},"donna":{"f":"どんな + noun.","n":"どんな asks what kind of. Answers often use an adjective + noun.","ex":[["どんな映画が好きですか。","どんなえいががすきですか。","What kind of films do you like?"],["新しい先生はどんな人ですか。","あたらしいせんせいはどんなひとですか。","What's the new teacher like?"],["どんな料理を作りましたか。","どんなりょうりをつくりましたか。","What kind of dish did you make?"]],"m":["どんな always needs a noun after it."],"r":["どの: which (from a set).","どう: how."]},"dou":{"f":"どう + です / ですか; polite: いかが.","n":"どう asks how something is or was, or makes a suggestion: how about…?. いかがですか is the polite version, used in shops and when offering.","ex":[["新しい仕事はどうですか。","あたらしいしごとはどうですか。","How's the new job?"],["コーヒーはいかがですか。","コーヒーはいかがですか。","Would you like some coffee?"],["明日はどうですか。","あしたはどうですか。","How about tomorrow?"]],"m":["Don't put a noun right after どう; use どんな + noun."],"r":["どんな: what kind of.","どうして: why."]},"doushite":{"f":"どうして / なぜ + question; the answer often ends in から or んです.","n":"どうして is the everyday why. なぜ is more formal or written. Casual speech also uses なんで.","ex":[["どうして日本語を勉強しているんですか。","どうしてにほんごをべんきょうしているんですか。","Why are you studying Japanese?"],["なぜ遅れましたか。","なぜおくれましたか。","Why were you late?"],["電車が止まったからです。","でんしゃがとまったからです。","Because the train stopped."]],"m":["A bare どうして? can sound accusing; adding んですか softens it."],"r":["から: because.","〜んです: explaining."]},"counter":{"f":"Number + counter, usually after the noun: 本を三冊.","n":"Japanese counts with counters. つ for general things up to 10, 人 for people (ひとり, ふたり, then さんにん), 枚 for flat things, 本 for long things, 冊 for books.","ex":[["りんごを二つください。","りんごをふたつください。","Two apples, please."],["子どもが三人います。","こどもがさんにんいます。","I have three children."],["鉛筆を五本買いました。","えんぴつをごほんかいました。","I bought five pencils."]],"m":["One person and two people are irregular: ひとり, ふたり.","Usual order: noun + particle + number: 紙を三枚."],"r":["いくつ / 何人: asking how many."]},"gurai":{"f":"Amount + ぐらい / くらい; time point + ごろ.","n":"ぐらい means about an amount (two hours, 1,000 yen). ごろ means around a point in time (around three o'clock).","ex":[["駅まで十分ぐらいかかります。","えきまでじゅっぷんぐらいかかります。","It takes about ten minutes to the station."],["十二時ごろ寝ます。","じゅうにじごろねます。","I go to bed around midnight."],["千円ぐらいの本です。","せんえんぐらいのほんです。","It's a book that costs about 1,000 yen."]],"m":["Don't use ごろ for durations: 二時間ごろ is wrong; say 二時間ぐらい."],"r":["に: exact time."]},"dake":{"f":"Noun / number + だけ.","n":"だけ means only or just, neutrally: nothing more is needed. It works with positive verbs.","ex":[["水だけ飲みました。","みずだけのみました。","I only drank water."],["五分だけ休みましょう。","ごふんだけやすみましょう。","Let's rest for just five minutes."],["あなただけに話します。","あなただけにはなします。","I'm telling only you."]],"m":["Compare しか, which needs a negative verb and stresses 'too little'."],"r":["しか〜ない: only (not enough)."]},"shika":{"f":"Noun / number + しか + negative verb.","n":"しか〜ない means only, with a feeling of not enough. The verb is always negative, even though the meaning is positive.","ex":[["財布に千円しかありません。","さいふにせんえんしかありません。","I only have 1,000 yen in my wallet."],["日本語は少ししか話せません。","にほんごはすこししかはなせません。","I can only speak a little Japanese."],["今朝はコーヒーしか飲みませんでした。","けさはコーヒーしかのみませんでした。","I only had coffee this morning."]],"m":["Never use しか with a positive verb: 千円しかあります is wrong."],"r":["だけ: only (neutral)."]},"n-desu":{"f":"Plain form + んです; noun / な-adjective + なんです.","n":"んです explains a situation or asks for an explanation. It adds context: the thing is…. It sounds natural in conversation, but overusing it can feel heavy.","ex":[["どうしたんですか。","どうしたんですか。","What's the matter?"],["お腹が痛いんです。","おなかがいたいんです。","(It's that) my stomach hurts."],["明日、休みなんです。","あした、やすみなんです。","(You see,) tomorrow is my day off."]],"m":["Nouns need な: 学生なんです, not 学生んです."],"r":["から: because.","〜んですが: polite lead-in to a request."]},"toki":{"f":"Verb plain form / い-adjective / な-adjective + な / noun + の + とき.","n":"とき means when or at the time of. The verb tense before とき matters: 行くとき = when going (before arriving); 行ったとき = when I went (after arriving).","ex":[["子どものとき、東京に住んでいました。","こどものとき、とうきょうにすんでいました。","When I was a child, I lived in Tokyo."],["寂しいとき、母に電話します。","さびしいとき、ははにでんわします。","When I'm lonely, I phone my mother."],["日本に行ったとき、お土産を買いました。","にほんにいったとき、おみやげをかいました。","When I went to Japan, I bought souvenirs."]],"m":["Nouns need の: 休みのとき.","な-adjectives need な: 暇なとき."],"r":["〜まえに / 〜たあとで: before / after."]},"mashou-ka":{"f":"Verb stem + ましょうか.","n":"ましょうか offers help (shall I…?) or makes a soft suggestion (shall we…?).","ex":[["窓を閉めましょうか。","まどをしめましょうか。","Shall I close the window?"],["駅まで送りましょうか。","えきまでおくりましょうか。","Shall I take you to the station?"],["そろそろ帰りましょうか。","そろそろかえりましょうか。","Shall we head home soon?"]],"m":["To accept: お願いします. To decline: 大丈夫です、ありがとうございます."],"r":["〜ましょう: let's.","〜ませんか: invitation."]},"ni-naru":{"f":"Noun + に + なる.","n":"になる means become (a person, a time, a state). Also for ages and seasons: 春になりました.","ex":[["将来、先生になりたいです。","しょうらい、せんせいになりたいです。","In the future I want to become a teacher."],["もう春になりました。","もうはるになりました。","It's already spring."],["来年、三十歳になります。","らいねん、さんじゅっさいになります。","I'll turn thirty next year."]],"m":["Use に, not が: 医者になる."],"r":["〜くなる: become (い-adjective).","〜にする: decide on."]},"ni-suru":{"f":"Noun + に + する.","n":"にする means decide on or choose, very common when ordering or picking a date. Past にしました: I went with.","ex":[["私はカレーにします。","わたしはカレーにします。","I'll have the curry."],["会議は金曜日にしましょう。","かいぎはきんようびにしましょう。","Let's make the meeting Friday."],["プレゼントは花にしました。","プレゼントははなにしました。","I chose flowers as the present."]],"m":["Don't confuse with になる (become): にする is your choice."],"r":["〜になる: become."]},"sore-kara":{"f":"Sentence。それから、sentence.","n":"それから means after that or and also. It is the most natural spoken way to give the next step.","ex":[["シャワーを浴びました。それから、寝ました。","シャワーをあびました。それから、ねました。","I took a shower. After that, I went to bed."],["卵と牛乳、それからパンを買ってください。","たまごとぎゅうにゅう、それからパンをかってください。","Please buy eggs and milk, and also bread."],["それから、どうしましたか。","それから、どうしましたか。","And then what did you do?"]],"m":["Not for contrasts; use でも for but."],"r":["そして: and (a bit more formal).","〜てから: after doing."]},"kudasai":{"f":"Noun + を + ください; with a number: noun + を + number + ください.","n":"をください asks for something: please give me. In shops and restaurants it's normal; お願いします is a softer alternative.","ex":[["お水をください。","おみずをください。","Water, please."],["この赤いのを二つください。","このあかいのをふたつください。","Two of these red ones, please."],["領収書をお願いします。","りょうしゅうしょをおねがいします。","A receipt, please."]],"m":["Don't use ください for asking someone to do something with a noun; that's 〜てください with a verb."],"r":["〜てください: please do.","〜がほしい: want."]}};
const jpDeepOf=id=>{const mine=(S.jpdeep.items||[]).find(x=>x.id===id);if(mine)return mine;const b=JP_DEEP[id];
  return b?{id,builtin:true,d:{formation:b.f,nuance:b.n,examples:b.ex.map(([jp,kana,en])=>({jp,kana,en})),mistakes:b.m,related:b.r}}:null};
function jpDeepPrompt(g){return `You are a patient Japanese teacher. Write a short, accurate lesson on this JLPT N5 grammar point for an English-speaking adult learner.
Grammar point: ${g[1]} (${g[2]}). Example already shown: ${g[3]} (${g[4]}).
Return ONLY a JSON object with these keys:
"formation": how to build it (which word forms it attaches to), one or two sentences;
"nuance": when and why to use it, register (polite/casual), and anything that surprises learners, two to four sentences;
"examples": an array of 4 objects {"jp": a natural sentence using only N5-level vocabulary, "kana": the same sentence in hiragana/katakana only, "en": a natural English translation};
"mistakes": an array of 1 to 3 short strings with common learner mistakes and the fix;
"related": an array of 1 to 3 strings naming related grammar points and how they differ, in one short sentence each.
Plain text inside the strings, no markdown.`}
function jpDeepPanel(g){const D=jpDeepOf(g[0]),st=(S.jpDeepState||{})[g[0]];if(S.jpDeepOpen!==g[0])return "";
  if(st&&st.loading)return `<div class="jpdeep"><p class="muted small" style="margin:0">Asking Claude for a closer look…</p></div>`;
  if(st&&st.err)return `<div class="jpdeep"><p class="small" style="margin:0">${esc(st.err)}</p><div><button type="button" class="linkbtn" data-act="jpdeep" data-id="${g[0]}" data-retry="1">Try again</button></div></div>`;
  if(!D)return "";const d=D.d||{};const L=a=>Array.isArray(a)?a:[];
  return `<div class="jpdeep">
    ${d.formation?`<div><span class="eyebrow">How it's built</span><p>${esc(d.formation)}</p></div>`:""}
    ${d.nuance?`<div><span class="eyebrow">When to use it</span><p>${esc(d.nuance)}</p></div>`:""}
    ${L(d.examples).length?`<div><span class="eyebrow">More examples</span>${L(d.examples).map(x=>`<div class="jpex"><span lang="ja">${esc(x.jp||"")}</span>${x.kana&&x.kana!==x.jp?`<span class="muted small" lang="ja">${esc(x.kana)}</span>`:""}<span class="muted small">${esc(x.en||"")}</span></div>`).join("")}</div>`:""}
    ${L(d.mistakes).length?`<div><span class="eyebrow">Watch out for</span><ul>${L(d.mistakes).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
    ${L(d.related).length?`<div><span class="eyebrow">Related</span><ul>${L(d.related).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
    <div class="jpfoot"><span class="muted small">${D.builtin?"Steady Days notes":"Written by Claude · double-check anything that feels off"}</span>${SAMPLE?`<button type="button" class="linkbtn subtle" data-act="jpdeep" data-id="${g[0]}" data-retry="1">${D.builtin?"Ask Claude for another take":"Rewrite"}</button>`:""}${!D.builtin?`<button type="button" class="linkbtn subtle" data-act="jpdeepreset" data-id="${g[0]}">Back to the built-in notes</button>`:""}</div></div>`}
function jpDeepBtn(g){if(!SAMPLE&&!jpDeepOf(g[0]))return "";const open=S.jpDeepOpen===g[0];return `<button type="button" class="linkbtn subtle" data-act="jpdeep" data-id="${g[0]}" aria-expanded="${open}">${open?"Close":"Go deeper"}</button>`}
async function jpDeepAsk(id,force){const g=JP_N5.find(x=>x[0]===id);if(!g)return;S.jpDeepOpen=id;
  if(jpDeepOf(id)&&!force){render(true);return}
  if(!SAMPLE){render(true);return}
  S.jpDeepState={...(S.jpDeepState||{}),[id]:{loading:true}};render(true);
  try{const out=await SAMPLE.json(jpDeepPrompt(g),{modelTier:"default"});
    if(!out||typeof out!=="object"||Array.isArray(out))throw {code:"bad"};
    editDoc("jpdeep",d=>{d.items=(d.items||[]).filter(x=>x.id!==id);d.items.push({id,d:out,at:today()})});S.jpDeepState={...S.jpDeepState,[id]:null}}
  catch(e){S.jpDeepState={...S.jpDeepState,[id]:{err:PRETTY_ERR[e&&e.code]||"Claude couldn't write that just now. Try again in a moment."}}}
  render(true)}
/* daily reading: short N5 passages [id, title, text, kana, English, words [[word, kana, meaning]]] */
const JP_READ=[["r01","私の朝","私は毎朝六時に起きます。顔を洗って、コーヒーを飲みます。それから、パンを食べます。七時半に家を出ます。","わたしはまいあさろくじにおきます。かおをあらって、コーヒーをのみます。それから、パンをたべます。しちじはんにいえをでます。","I get up at six every morning. I wash my face and drink coffee. Then I eat bread. I leave the house at half past seven.",[["顔","かお","face"],["洗う","あらう","to wash"],["出る","でる","to leave"]]],["r02","私の家族","私の家族は四人です。父と母と妹と私です。父は会社員です。妹は高校生で、テニスが好きです。","わたしのかぞくはよにんです。ちちとははといもうととわたしです。ちちはかいしゃいんです。いもうとはこうこうせいで、テニスがすきです。","There are four people in my family: my father, my mother, my younger sister and me. My father is an office worker. My younger sister is a high school student and likes tennis.",[["家族","かぞく","family"],["会社員","かいしゃいん","office worker"],["高校生","こうこうせい","high school student"]]],["r03","週末","土曜日に友だちと公園へ行きました。天気がよかったです。公園でお弁当を食べました。とても楽しかったです。","どようびにともだちとこうえんへいきました。てんきがよかったです。こうえんでおべんとうをたべました。とてもたのしかったです。","On Saturday I went to the park with a friend. The weather was good. We ate packed lunches in the park. It was a lot of fun.",[["天気","てんき","weather"],["お弁当","おべんとう","packed lunch"],["楽しい","たのしい","fun"]]],["r04","私の部屋","私の部屋はあまり広くないです。でも、明るくて、静かです。窓の近くに机があります。机の上にパソコンと本があります。","わたしのへやはあまりひろくないです。でも、あかるくて、しずかです。まどのちかくにつくえがあります。つくえのうえにパソコンとほんがあります。","My room isn't very big. But it's bright and quiet. There's a desk near the window. On the desk there's a computer and some books.",[["広い","ひろい","spacious"],["明るい","あかるい","bright"],["近く","ちかく","near"]]],["r05","レストランで","昨日、駅の近くのレストランに行きました。私はカレーにしました。友だちはラーメンを食べました。カレーは少し辛かったですが、おいしかったです。","きのう、えきのちかくのレストランにいきました。わたしはカレーにしました。ともだちはラーメンをたべました。カレーはすこしからかったですが、おいしかったです。","Yesterday I went to a restaurant near the station. I chose the curry. My friend ate ramen. The curry was a little spicy, but delicious.",[["昨日","きのう","yesterday"],["辛い","からい","spicy"],["少し","すこし","a little"]]],["r06","日本語の勉強","私は毎日日本語を勉強しています。ひらがなとカタカナはもう読めます。漢字はまだ難しいです。でも、毎日少しずつ覚えています。","わたしはまいにちにほんごをべんきょうしています。ひらがなとカタカナはもうよめます。かんじはまだむずかしいです。でも、まいにちすこしずつおぼえています。","I study Japanese every day. I can already read hiragana and katakana. Kanji is still difficult. But I'm learning a little every day.",[["漢字","かんじ","kanji"],["少しずつ","すこしずつ","little by little"],["覚える","おぼえる","to memorise"]]],["r07","雨の日","今日は朝から雨が降っています。だから、家にいます。本を読んだり、音楽を聞いたりしています。雨の日も好きです。","きょうはあさからあめがふっています。だから、いえにいます。ほんをよんだり、おんがくをきいたりしています。あめのひもすきです。","It's been raining since this morning. So I'm staying home. I'm reading books, listening to music and so on. I like rainy days too.",[["雨","あめ","rain"],["降る","ふる","to fall (rain)"],["音楽","おんがく","music"]]],["r08","買い物","スーパーで野菜と卵と牛乳を買いました。全部で八百円でした。帰りに、パン屋でパンも買いました。","スーパーでやさいとたまごとぎゅうにゅうをかいました。ぜんぶではっぴゃくえんでした。かえりに、パンやでパンもかいました。","At the supermarket I bought vegetables, eggs and milk. It came to 800 yen altogether. On the way home I also bought bread at the bakery.",[["全部で","ぜんぶで","altogether"],["帰りに","かえりに","on the way back"],["パン屋","パンや","bakery"]]],["r09","私の町","私の町は小さいですが、とてもきれいです。駅の前に古いお寺があります。夏には、川で花火があります。","わたしのまちはちいさいですが、とてもきれいです。えきのまえにふるいおてらがあります。なつには、かわではなびがあります。","My town is small, but very pretty. There's an old temple in front of the station. In summer there are fireworks by the river.",[["町","まち","town"],["お寺","おてら","temple"],["花火","はなび","fireworks"]]],["r10","友だちの誕生日","来週の金曜日は友だちの誕生日です。私はプレゼントに本をあげるつもりです。みんなで晩ご飯を食べに行きます。","らいしゅうのきんようびはともだちのたんじょうびです。わたしはプレゼントにほんをあげるつもりです。みんなでばんごはんをたべにいきます。","Next Friday is my friend's birthday. I plan to give a book as a present. We're all going out to eat dinner.",[["誕生日","たんじょうび","birthday"],["あげる","あげる","to give"],["みんなで","みんなで","all together"]]],["r11","電車","私は毎日電車で会社に行きます。朝の電車はとても込んでいます。だから、本は読みません。いつも音楽を聞きます。","わたしはまいにちでんしゃでかいしゃにいきます。あさのでんしゃはとてもこんでいます。だから、ほんはよみません。いつもおんがくをききます。","I go to work by train every day. The morning train is very crowded. So I don't read books. I always listen to music.",[["電車","でんしゃ","train"],["込む","こむ","to be crowded"],["いつも","いつも","always / usually"]]],["r12","猫","私の家には猫が一匹います。名前はモモです。モモは白くて、小さいです。毎日、窓の近くで寝ています。","わたしのいえにはねこがいっぴきいます。なまえはモモです。モモはしろくて、ちいさいです。まいにち、まどのちかくでねています。","There's one cat at my house. Her name is Momo. Momo is white and small. Every day she sleeps near the window.",[["一匹","いっぴき","one (small animal)"],["名前","なまえ","name"],["白い","しろい","white"]]],["r13","病院","昨日から頭が痛いです。熱も少しあります。今日は会社を休んで、病院へ行きました。薬をもらいました。","きのうからあたまがいたいです。ねつもすこしあります。きょうはかいしゃをやすんで、びょういんへいきました。くすりをもらいました。","I've had a headache since yesterday. I have a slight fever too. Today I took the day off work and went to the hospital. I got some medicine.",[["頭","あたま","head"],["熱","ねつ","fever"],["病院","びょういん","hospital / clinic"]]],["r14","夏休み","去年の夏休みに、家族と沖縄へ行きました。海はとてもきれいでした。毎日泳ぎました。また行きたいです。","きょねんのなつやすみに、かぞくとおきなわへいきました。うみはとてもきれいでした。まいにちおよぎました。またいきたいです。","Last summer holidays I went to Okinawa with my family. The sea was very beautiful. I swam every day. I want to go again.",[["去年","きょねん","last year"],["海","うみ","sea"],["泳ぐ","およぐ","to swim"]]],["r15","料理","私は料理が好きです。週末はよく友だちに晩ご飯を作ります。昨日は魚と野菜のスープを作りました。","わたしはりょうりがすきです。しゅうまつはよくともだちにばんごはんをつくります。きのうはさかなとやさいのスープをつくりました。","I like cooking. At weekends I often make dinner for friends. Yesterday I made fish and a vegetable soup.",[["料理","りょうり","cooking"],["作る","つくる","to make"],["よく","よく","often"]]],["r16","駅で","すみません、図書館はどこですか。この道をまっすぐ行ってください。二つ目の角を右に曲がってください。図書館は銀行の隣です。","すみません、としょかんはどこですか。このみちをまっすぐいってください。ふたつめのかどをみぎにまがってください。としょかんはぎんこうのとなりです。","Excuse me, where is the library? Go straight along this road. Turn right at the second corner. The library is next to the bank.",[["まっすぐ","まっすぐ","straight"],["角","かど","corner"],["曲がる","まがる","to turn"]]],["r17","私の一日","私は九時から五時まで働きます。昼休みは一時間です。仕事のあとで、ジムに行きます。夜は十一時ごろ寝ます。","わたしはくじからごじまではたらきます。ひるやすみはいちじかんです。しごとのあとで、ジムにいきます。よるはじゅういちじごろねます。","I work from nine to five. My lunch break is one hour. After work I go to the gym. At night I go to bed around eleven.",[["働く","はたらく","to work"],["昼休み","ひるやすみ","lunch break"],["ごろ","ごろ","around (time)"]]],["r18","冬","私は冬があまり好きじゃないです。寒いですから。でも、冬の温かいお茶は大好きです。雪の日は、外に出ません。","わたしはふゆがあまりすきじゃないです。さむいですから。でも、ふゆのあたたかいおちゃはだいすきです。ゆきのひは、そとにでません。","I don't like winter very much, because it's cold. But I love hot tea in winter. On snowy days I don't go outside.",[["冬","ふゆ","winter"],["温かい","あたたかい","warm"],["雪","ゆき","snow"]]],["r19","手紙","お母さん、お元気ですか。私は元気です。東京の生活はとても楽しいです。来月、家に帰ります。","おかあさん、おげんきですか。わたしはげんきです。とうきょうのせいかつはとてもたのしいです。らいげつ、いえにかえります。","Mum, how are you? I'm well. Life in Tokyo is a lot of fun. I'm coming home next month.",[["元気","げんき","well / healthy"],["生活","せいかつ","life (daily)"],["来月","らいげつ","next month"]]],["r20","カフェ","駅の前に新しいカフェができました。ケーキがとてもおいしいです。昨日、友だちとそこで二時間ぐらい話しました。","えきのまえにあたらしいカフェができました。ケーキがとてもおいしいです。きのう、ともだちとそこでにじかんぐらいはなしました。","A new café has opened in front of the station. The cakes are really good. Yesterday I talked with a friend there for about two hours.",[["できる","できる","to open / be made"],["新しい","あたらしい","new"],["ぐらい","ぐらい","about"]]],["r21","散歩","私は毎晩、犬と散歩します。家の近くに川があります。川のそばを三十分ぐらい歩きます。夜の川は静かです。","わたしはまいばん、いぬとさんぽします。いえのちかくにかわがあります。かわのそばをさんじゅっぷんぐらいあるきます。よるのかわはしずかです。","Every evening I go for a walk with my dog. There's a river near my house. We walk along the river for about thirty minutes. The river at night is quiet.",[["毎晩","まいばん","every evening"],["散歩","さんぽ","walk"],["そば","そば","beside"]]],["r22","日本の友だち","私には日本人の友だちがいます。名前はけんさんです。けんさんは英語が上手です。私たちは時々、日本語と英語で話します。","わたしにはにほんじんのともだちがいます。なまえはけんさんです。けんさんはえいごがじょうずです。わたしたちはときどき、にほんごとえいごではなします。","I have a Japanese friend. His name is Ken. Ken is good at English. We sometimes talk in Japanese and English.",[["上手","じょうず","good at"],["時々","ときどき","sometimes"],["私たち","わたしたち","we"]]],["r23","テスト","明日、日本語のテストがあります。だから、今晩は早く寝るつもりです。テストは難しくないでしょう。でも、少し心配です。","あした、にほんごのテストがあります。だから、こんばんははやくねるつもりです。テストはむずかしくないでしょう。でも、すこししんぱいです。","I have a Japanese test tomorrow. So I plan to go to bed early tonight. The test probably won't be hard. But I'm a little worried.",[["今晩","こんばん","this evening"],["早く","はやく","early"],["心配","しんぱい","worried"]]],["r24","花見","春になりました。今週の日曜日に、公園で花見をします。桜はとてもきれいです。友だちが十人ぐらい来ます。","はるになりました。こんしゅうのにちようびに、こうえんではなみをします。さくらはとてもきれいです。ともだちがじゅうにんぐらいきます。","Spring has come. This Sunday we're having a cherry-blossom picnic in the park. The cherry blossoms are very beautiful. About ten friends are coming.",[["春","はる","spring"],["花見","はなみ","flower viewing"],["桜","さくら","cherry blossom"]]],["r25","ホテル","すみません、今晩、部屋はありますか。はい、あります。一泊八千円です。朝ご飯は七時からです。","すみません、こんばん、へやはありますか。はい、あります。いっぱくはっせんえんです。あさごはんはしちじからです。","Excuse me, do you have a room tonight? Yes, we do. It's 8,000 yen a night. Breakfast is from seven.",[["一泊","いっぱく","one night (stay)"],["八千円","はっせんえん","8,000 yen"],["今晩","こんばん","tonight"]]],["r26","私の趣味","私の趣味は写真です。週末はカメラを持って、いろいろな所へ行きます。山や海の写真をよく撮ります。","わたしのしゅみはしゃしんです。しゅうまつはカメラをもって、いろいろなところへいきます。やまやうみのしゃしんをよくとります。","My hobby is photography. At weekends I take my camera and go to all sorts of places. I often take photos of mountains and the sea.",[["趣味","しゅみ","hobby"],["持つ","もつ","to hold / take"],["いろいろな","いろいろな","various"]]],["r27","引っ越し","先月、新しいアパートに引っ越しました。前のアパートより駅に近いです。でも、部屋は少し狭いです。","せんげつ、あたらしいアパートにひっこしました。まえのアパートよりえきにちかいです。でも、へやはすこしせまいです。","Last month I moved to a new flat. It's closer to the station than my old flat. But the rooms are a bit small.",[["引っ越す","ひっこす","to move house"],["先月","せんげつ","last month"],["狭い","せまい","small / cramped"]]],["r28","電話","もしもし、田中です。今、駅に着きました。少し遅れてすみません。五分ぐらいでそちらに行きます。","もしもし、たなかです。いま、えきにつきました。すこしおくれてすみません。ごふんぐらいでそちらにいきます。","Hello, it's Tanaka. I've just arrived at the station. Sorry I'm a little late. I'll be there in about five minutes.",[["着く","つく","to arrive"],["遅れる","おくれる","to be late"],["そちら","そちら","your place / there"]]],["r29","お正月","日本では一月一日はお正月です。家族が集まって、特別な料理を食べます。お寺や神社に行く人も多いです。","にほんではいちがつついたちはおしょうがつです。かぞくがあつまって、とくべつなりょうりをたべます。おてらやじんじゃにいくひともおおいです。","In Japan, January 1st is New Year. Families get together and eat special food. Many people also go to temples and shrines.",[["お正月","おしょうがつ","New Year"],["集まる","あつまる","to gather"],["特別","とくべつ","special"]]],["r30","試験","今年、日本語の試験を受けます。毎日三十分勉強しています。試験は十二月です。来年は日本へ旅行に行きたいです。","ことし、にほんごのしけんをうけます。まいにちさんじゅっぷんべんきょうしています。しけんはじゅう const showedUp=d=>!!d&&!!(d.mood||String(d.note||"").trim()||(d.gratitude||[]).some(x=>String(x||"").trim())||Object.values(d.habits||{}).some(Boolean)

function treeSeed(){const s=String(S.uid||"")+"|"+(S.settings.startDay||START_DAY);let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}

}
const PAL={spring:["#9ccf7a","#b5db8c","#86c06a","#a8d483"],summer:["#4f8f4a","#5fa055","#3f7d3c","#6aa85e"],autumn:["#d98b3a","#c9622f","#e0b04a","#b5532a"],winter:[]};
function treeSVG(st,big){
  const r=rng(treeSeed()),W=200,G=196,H=58+92*st.grow,tw=5+9*st.grow,cx=100;

  /* trunk */
  const top=[cx+(r()-.5)*10,G-H];
  seg.push(`<path d="M${P(cx-tw/2,G)} C${P(cx-tw/2,G-H*.4)} ${P(top[0]-tw*.25,G-H*.7)} ${P(top[0]-1,top[1])} L${P(top[0]+1,top[1])} C${P(top[0]+tw*.25,G-H*.7)} ${P(cx+tw/2,G-H*.4)} ${P(cx+tw/2,G)}Z" fill="#7a5a3c"/>`);

    seg.push(`<path d="M${P(bx,by)} Q${P((bx+ex)/2,(by+ey)/2-4)} ${P(ex,ey)}" stroke="#7a5a3c" stroke-width="${(tw*.42*(1-t*.5)).toFixed(1)}" stroke-linecap="round" fill="none"/>`);

    seg.push(`<path d="M${P(mx,my)} L${P(sx,sy)}" stroke="#7a5a3c" stroke-width="${(tw*.22).toFixed(1)}" stroke-linecap="round"/>`);pts.push([sx,sy])}
  /* roots: steadier habits, deeper roots */
  const roots=[];const nr=2+Math.round(st.root*4);for(let i=0;i<nr;i++){const side=i%2?1:-1,len=10+st.root*26+r()*8;
    roots.push(`<path d="M${P(cx+side*tw*.3,G)} Q${P(cx+side*(len*.5),G+4+r()*3)} ${P(cx+side*len,G+6+r()*6)}" stroke="#7a5a3c" stroke-opacity=".55" stroke-width="${(1.2+st.root*1.6).toFixed(1)}" fill="none" stroke-linecap="round"/>`)}
  /* leaves: the days you showed up recently (a little crown always stays) */
  const pal=PAL[st.season],leaves=[],extras=[];
  if(st.season!=="winter"){const n=Math.round(8+st.leaf*40);for(let i=0;i<n;i++){const p=pts[i%pts.length],rad=6+r()*7*(.6+st.grow*.6);
      leaves.push(`<circle cx="${(p[0]+(r()-.5)*22).toFixed(1)}" cy="${(p[1]+(r()-.5)*18).toFixed(1)}" r="${rad.toFixed(1)}" fill="${pal[i%pal.length]}" fill-opacity=".9"/>`)}
    /* blossoms (spring, summer) or fruit (autumn): dreams and vision tiles lived this year */
    for(let i=0;i<Math.min(14,st.blooms);i++){const p=pts[(i*3+1)%pts.length];
      extras.push(`<circle cx="${(p[0]+(r()-.5)*20).toFixed(1)}" cy="${(p[1]+(r()-.5)*14).toFixed(1)}" r="${st.season==="autumn"?2.8:2.4}" fill="${st.season==="autumn"?"#c4453a":"#f2a7c3"}"/>`)}
    if(st.season==="autumn")for(let i=0;i<6+st.leaf*8;i++)extras.push(`<ellipse cx="${(cx+(r()-.5)*90).toFixed(1)}" cy="${(G-1+r()*3).toFixed(1)}" rx="2.4" ry="1.2" fill="${pal[i%pal.length]}"/>`)}
  else{/* winter: bare branches resting, buds for the days you showed up, a little snow */
    pts.forEach(p=>extras.push(`<ellipse cx="${p[0].toFixed(1)}" cy="${(p[1]-1).toFixed(1)}" rx="4" ry="2" fill="#fff" fill-opacity=".9"/>`));
    for(let i=0;i<Math.round(4+st.leaf*16);i++){const p=pts[i%pts.length];extras.push(`<circle cx="${(p[0]+(r()-.5)*10).toFixed(1)}" cy="${(p[1]+(r()-.5)*8).toFixed(1)}" r="1.6" fill="#a7c48f"/>`)}}
  const ground=`<ellipse cx="${cx}" cy="${G+1}" rx="${(46+30*st.grow).toFixed(0)}" ry="5" fill="${st.season==="winter"?"#eef2f3":"var(--accent)"}" fill-opacity="${st.season==="winter"?".9":".14"}"/>`;
  /* in the header the tree stands on the forest's own ground line, so no ground of its own */
  return big?`<svg class="tree-big" viewBox="0 20 ${W} 220" role="img" aria-label="Your tree, ${st.season}">${roots.join("")}${ground}${seg.join("")}${leaves.join("")}${extras.join("")}</svg>`
    :`<svg class="tree-sm" viewBox="0 40 ${W} ${G-40}" preserveAspectRatio="xMidYMax meet" role="img" aria-label="Your tree, ${st.season}">${seg.join("")}${leaves.join("")}${extras.filter(e=>!/<ellipse cx="[\d.]+" cy="19[5-9]/.test(e)).join("")}</svg>`;
}

/* ---------- Weekly recap ---------- */
const weekStart=k=>{const [y,m,d]=k.split("-").map(Number);const dow=new Date(y,m-1,d).getDay();return addDays(k,-((dow+6)%7))};
const dowOf=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d).getDay()};
function weekMoments(days){
  const out=[];
  days.forEach(k=>{const d=getDay(k);
    (d.gratitude||[]).forEach((g,i)=>{if(g&&g.trim())out.push({k,kind:"Grateful",text:g.trim()})});
    if(d.proud&&d.proud.trim())out.push({k,kind:"Proud",text:d.proud.trim()});
    if(d.note&&d.note.trim())out.push({k,kind:"Note",text:d.note.trim()});
  });
  return out;
}

/* ---------- settings: the morning reminder lives in Claude as a scheduled task; Steady Days pauses/resumes it ---------- */
const NUDGE_TASK="trig_01WNVxsADqavGjR9DpeSyvho";const CCR="Claude Code Remote";
S.nudge={state:"idle",enabled:null,err:null};
async function loadNudge(){
  if(!MCP){S.nudge={state:"error",enabled:null,err:{code:"capability_disabled"}};render(true);return}
  S.nudge={...S.nudge,state:"loading"};render(true);
  try{
    let cursor=null,found=null;
    for(let i=0;i<5&&!found;i++){
      const r=(await MCP.callTool(CCR,"list_triggers",cursor?{recurring:true,limit:100,cursor}:{recurring:true,limit:100},{cache:false})).payload||{};
      found=(r.data||[]).find(t=>t.id===NUDGE_TASK)||null;cursor=r.next_cursor;if(!cursor)break;
    }
    S.nudge=found?{state:"ok",enabled:!!found.enabled,next:found.next_run_at||null,err:null}:{state:"missing",enabled:null,err:null};
  }catch(e){S.nudge={state:"error",enabled:null,err:e}}
  render(true);
}

  const prev=S.nudge.enabled;S.nudge={...S.nudge,enabled:on,state:"saving"};render(true);

/* ---------- demo mode ---------- */
function demoMcp(st){
  const open=t=>t.status===0,dk=t=>t.dueDate?key(new Date(t.dueDate)):null,find=id=>st.tasks.find(x=>x.id===id);
  const tools={
    list_projects:()=>({result:[{id:"inbox",name:"Inbox",kind:"TASK"},...st.projects]}),
    get_project_with_undone_tasks:({project_id})=>({project:st.projects.find(p=>p.id===project_id)||{id:"inbox",name:"Inbox"},tasks:st.tasks.filter(t=>open(t)&&t.projectId===project_id),columns:st.columns[project_id]||[]}),
    list_undone_tasks_by_date:({search})=>{const a=key(new Date(search.startDate)),b=key(new Date(search.endDate||search.startDate));return {result:st.tasks.filter(t=>open(t)&&dk(t)&&dk(t)>=a&&dk(t)<=b)}},
    list_undone_tasks_by_time_query:({query_command})=>{const k=query_command==="tomorrow"?addDays(today(),1):today();return {result:st.tasks.filter(t=>open(t)&&dk(t)===k)}},
    create_task:({task})=>{const t={priority:0,kind:"TEXT",content:"",...task,id:"dm"+uid(),projectId:task.projectId||"inbox",status:0,createdTime:new Date().toISOString()};st.tasks.push(t);return t},
    complete_task:({task_id})=>{const t=find(task_id);if(t)t.status=2;return t||{}},
    update_task:({task_id,task})=>{const t=find(task_id||task.id);if(t)Object.assign(t,task);return t||{}},
    batch_update_tasks:({tasks})=>{(tasks||[]).forEach(p=>{const t=find(p.id);if(t)Object.assign(t,p)});return {ok:true}},
    add_comment:()=>({ok:true}),
    create_project:({name})=>{const p={id:"dm"+uid(),name,kind:"TASK",viewMode:"list"};st.projects.push(p);return p},
    list_habits:()=>({result:[]}),get_habit_checkins:()=>({result:[]}),upsert_habit_checkins:()=>({ok:true})
  };
  return {callTool:async(server,name,input)=>{const f=tools[name];if(!f){const e=new Error("Not available in demo mode");e.code="tool_error";throw e}return {payload:JSON.parse(JSON.stringify(f(input||{})))}}};
}

async function connectDb(){
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    const id=user?await user.id():null;
    if(!db||!id){offlineDb();return}
    S.db=db;S.uid=id;S.live=true;setStatus();
    const col=db.collection("data/users/"+id);
    col.doc("settings").onSnapshot(snap=>{
      if(!S.settingsLoaded&&snap.fromCache&&!snap.exists)return;
      if(!pending.settings&&!inflight.settings){const d=snap.exists?snap.data():null;
        S.settings={...(d||{}),habits:d?.habits||[],reminders:d?.reminders||[],todos:d?.todos||[],projects:d?.projects||[],ttMap:d?.ttMap||null,favs:d?.favs||[],pnotes:d?.pnotes||{},lastBackup:d?.lastBackup||null,claudeCredit:d?.claudeCredit??null,nudgeOn:d?.nudgeOn,nudgeTime:d?.nudgeTime||"07:22",timeZone:d?.timeZone||TZ,todayOrder:d?.todayOrder||[],todayHidden:d?.todayHidden||[],exKinds:d?.exKinds||[],weighOff:!!d?.weighOff,skills:d?.skills||{},highlights:d?.highlights||{}};
        if(ttOn())ttLoadListsMissing();}
      if(!S.settingsLoaded){S.settingsLoaded=true;if(S.setQ.length){const b=JSON.parse(JSON.stringify(S.settings));S.setQ.forEach(f=>{try{f(b)}catch(_){}});S.setQ=[];S.settings=b;queueWrite("settings",b)}}
      S.settingsReady=true;render();
    },()=>{S.settingsReady=true;render()});
    col.doc("study").onSnapshot(snap=>{S.study=snap.exists?snap.data():{};render()},()=>{});
    ["wish","backlog","vision","visionimg","bucket","dreams","longterm","groceries","trips","notes","jpdeep","media"].forEach(id=>col.doc(id).onSnapshot(snap=>{
      /* an empty answer from the local cache isn't trusted: it may just not have synced yet */
      if(!S.docReady[id]&&snap.fromCache&&!snap.exists)return;
      if(!pending[id]&&!inflight[id]&&!debounced[id]){const d=snap.exists?snap.data():null;S[id]={...(S.docReady[id]?S[id]:{}),...(d||{}),items:(d&&d.items)||[]};
        if(!S.docReady[id]){S.docReady[id]=true;const q=S.docQ[id];delete S.docQ[id];if(q&&q.length){const b=JSON.parse(JSON.stringify(S[id]));q.forEach(f=>{try{f(b)}catch(_){}});S[id]=b;queueWrite(id,{...b,kind:id})}}}
      render();
    },()=>{}));
    col.where("kind","==","day").orderBy("date","desc").limit(180).onSnapshot(snap=>{
      snap.docs.forEach(doc=>{const d=doc.data();const k="d-"+d.date;if(!snap.fromCache)S.dayLoaded[d.date]=true;if(pending[k]||inflight[k]||debounced[k]||S.dayQ[d.date])return;S.days[d.date]={...blankDay(d.date),...d,gratitude:[0,1,2].map(i=>(d.gratitude||[])[i]||"")}});
      /* from the server, this list is complete back to its oldest day: anything newer that's missing truly doesn't exist yet */
      if(!snap.fromCache)setTimeout(carryPicks,0);
      if(!snap.fromCache)S.dayFrom=snap.docs.length<180?"0000-00-00":snap.docs.reduce((a,x)=>{const k=x.data().date;return k<a?k:a},"9999");
      render();
    },()=>toast("Lost connection to your saved entries. Reload to reconnect."));
  }catch(e){offlineDb()}
}

  S.live=false;S.settingsReady=true;setStatus();

}

}
