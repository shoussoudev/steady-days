<style>
/* Layout: one calm column under a faint tree line (a forest edge), sticky tab strip; Today is the home view */
:root{
  --bg:#EEF1EA; --surface:#F9FBF7; --ink:#1B2A21; --muted:#5B6A5F; --line:#D5DDD3;
  --accent:#2F5A44; --accent-ink:#F3F8F3; --accent-soft:#DCE8DE; --warm:#93652B; --warm-soft:#F1E7D4; --plum:#7B5EA7; --plum-soft:#ECE5F5;
  --danger:#A2453A;
  --m1:#8A6A5A; --m2:#6F8199; --m3:#9AA08E; --m4:#4E8A62; --m5:#C99A3A;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1712; --surface:#16211A; --ink:#E1E9E1; --muted:#93A396; --line:#25332A;
  --accent:#8CC4A0; --accent-ink:#0D1610; --accent-soft:#1F3427; --warm:#D9A65E; --warm-soft:#33291B; --plum:#B9A0E3; --plum-soft:#2C2438;
  --danger:#E08A7E;
  --m1:#B99482; --m2:#9DAFC7; --m3:#AEB4A2; --m4:#8CC4A0; --m5:#E2B866; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1712; --surface:#16211A; --ink:#E1E9E1; --muted:#93A396; --line:#25332A;
  --accent:#8CC4A0; --accent-ink:#0D1610; --accent-soft:#1F3427; --warm:#D9A65E; --warm-soft:#33291B; --plum:#B9A0E3; --plum-soft:#2C2438;
  --danger:#E08A7E;
  --m1:#B99482; --m2:#9DAFC7; --m3:#AEB4A2; --m4:#8CC4A0; --m5:#E2B866; color-scheme:dark}

*{box-sizing:border-box}

html,body{margin:0}

.addrow > input[type=text]{flex:1 1 180px}

.addrow > select,.addrow > input[type=date]{flex:0 1 140px}

/* mood */
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mood{display:grid;justify-items:center;gap:6px;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:.8rem;color:var(--muted)}
.mood .dot{width:18px;height:18px;border-radius:50%;background:var(--c);opacity:.55}

/* gratitude */
.grat{display:grid;gap:8px}

/* lists */
ul.list{list-style:none;margin:0;padding:0;display:grid}

function seeded(n){let x=(n*2654435761)>>>0;return ()=>{x^=x<<13;x>>>=0;x^=x>>17;x^=x<<5;x>>>=0;return x/4294967296}}
function workoutFor(k,shift=0){
  const n=dayNum(k);const f=FOCI[(((n+shift)%4)+4)%4];const rnd=seeded(n*7+shift);
  const pool=f.pool.slice();for(let i=pool.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  const ex=[];
  if(f.skill){const sk=SKILLS[f.skill];const lv=Math.min(sk.levels.length,Math.max(1,(S.settings.skills||{})[f.skill]||1));const L=sk.levels[lv-1];ex.push({name:L[0],how:L[1],dose:L[2],skill:f.skill,level:lv,goal:L[3]})}
  f.fixed.forEach(x=>ex.push({name:x[0],how:x[1],dose:x[2]}));
  (f.picks||[]).forEach(g=>{const x=g[Math.floor(rnd()*g.length)];if(!ex.some(e=>e.name===x[0]))ex.push({name:x[0],how:x[1],dose:x[2]})});
  const used=new Set(ex.map(e=>e.name));for(let i=pool.length-1;i>=0;i--)if(used.has(pool[i][0]))pool.splice(i,1);
  while(ex.length<4&&pool.length){const x=pool.shift();ex.push({name:x[0],how:x[1],dose:x[2]})}
  return {focus:f,ex};
}

/* ---------- local db writes: one at a time per document ---------- */
const pending={},inflight={},debounced={};
function queueWrite(id,body){if(!S.live)return;pending[id]=JSON.parse(JSON.stringify(body));if(!inflight[id])flush(id)}
async function flush(id){
  inflight[id]=true;
  while(pending[id]){
    const body=pending[id];delete pending[id];
    try{await S.db.collection("data/users/"+S.uid).doc(id).set(body)}
    catch(e){
      if(e&&e.code==="unavailable"){await sleep(800+Math.random()*800);if(!pending[id])pending[id]=body;continue}
      toast(e&&e.code==="quota_exceeded"?"Storage is full. Delete some old entries to keep saving.":"Couldn't save that change. Check your connection and try again.");
    }
  }
  inflight[id]=false;
}
function saveLater(id,fn,ms=600){clearTimeout(debounced[id]);debounced[id]=setTimeout(()=>{delete debounced[id];fn()},ms)}
/* Saving replaces a day's whole record, so never save a day we haven't read from the server yet:
   the change shows at once, waits, and is replayed on top of the real day before saving. */
S.dayLoaded={};S.dayFrom=null;S.dayQ={};
const dayReady=k=>!S.live||!!S.dayLoaded[k]||(S.dayFrom!==null&&k>=S.dayFrom);
async function fetchDayThenSave(date){
  let base=null;
  for(let i=0;i<6&&!base;i++){try{const r=S.db.collection("data/users/"+S.uid).doc("d-"+date);const sn=await (r.getServer?r.getServer():r.get());
      base=sn.exists?{...blankDay(date),...sn.data()}:blankDay(date)}catch(e){await sleep(1200*(i+1))}}
  const q=S.dayQ[date];if(!q)return;
  if(!base){q.fetching=false;toast("Waiting for a connection to save today safely…");setTimeout(()=>{if(S.dayQ[date]&&!S.dayQ[date].fetching){S.dayQ[date].fetching=true;fetchDayThenSave(date)}},8000);return}
  base.gratitude=[0,1,2].map(i=>(base.gratitude||[])[i]||"");q.forEach(f=>{try{f(base)}catch(_){}});
  delete S.dayQ[date];S.dayLoaded[date]=true;S.days[date]=base;queueWrite("d-"+date,base);render();
}
function editDay(date,fn,{silent=false}={}){
  if(!dayReady(date)||S.dayQ[date]){const d=JSON.parse(JSON.stringify(getDay(date)));fn(d);S.days[date]=d;
    const q=S.dayQ[date]=S.dayQ[date]||[];q.push(fn);if(!q.fetching){q.fetching=true;fetchDayThenSave(date)}
    if(!silent)render(true);return}
  const d=JSON.parse(JSON.stringify(getDay(date)));fn(d);S.days[date]=d;
  if(silent)saveLater("d-"+date,()=>queueWrite("d-"+date,S.days[date]));
  else{queueWrite("d-"+date,d);render(true)}
}

const UNDO_MS=5*60*1000;
S.undo=S.demo?[]:(()=>{try{return JSON.parse(localStorage.getItem("sd-undo")||"[]").filter(u=>Date.now()-u.at<UNDO_MS)}catch(_){return []}})();

function pushUndo(entry){entry.uid=uid();entry.at=Date.now();S.undo.unshift(entry);S.undo=S.undo.slice(0,20);saveUndo();undoBarHidden=false;tickUndo();render()}
const undoLabel=u=>u.label||(u.kind==="tt"?`Completed “${u.title}”`:"");
function tickUndo(){
  const before=S.undo.length;S.undo=S.undo.filter(u=>Date.now()-u.at<UNDO_MS);

  const bar=$("#undobar"),u=S.undo[0];

  $("#undo-label").textContent=undoLabel(u);
  $("#undo-time").textContent=Math.floor(left/60000)+":"+pad(Math.floor(left/1000)%60);
  bar.hidden=false;document.body.classList.add("has-undo");
  document.querySelectorAll("[data-undo-left]").forEach(el=>{const x=S.undo.find(v=>v.uid===el.dataset.undoLeft);if(x){const l=Math.max(0,UNDO_MS-(Date.now()-x.at));el.textContent=Math.floor(l/60000)+":"+pad(Math.floor(l/1000)%60)}});
}

async function runUndo(uidv){

    else if(u.kind==="docall"){editDoc(u.doc,d=>{d.items=u.items});toast("Restored the earlier version")}
    else if(u.kind==="doc"){
      editDoc(u.doc,d=>{const i=d.items.findIndex(x=>x.id===u.item.id);if(i>=0)d.items[i]=u.item;else d.items.splice(Math.min(u.index??0,d.items.length),0,u.item)});

      if((getDay(today()).top3||[]).some(x=>x.id===u.tid))editDay(today(),d=>{d.top3=d.top3.map(x=>x.id===u.tid?{...x,done:false}:x)},{silent:true});
      if((getDay(today()).maybe||[]).some(x=>x.id===u.tid))editDay(today(),d=>{d.maybe=d.maybe.map(x=>x.id===u.tid?{...x,done:false}:x)},{silent:true});

      const restore={meal:d=>d.meals.unshift(u.item),purchase:d=>d.purchases.unshift(u.item),progress:d=>{d.progress=d.progress||[];d.progress.push(u.item)},ate:d=>{d.ate=d.ate||[];d.ate.push(u.item)}}[u.what];

/* rollover: unfinished to-dos from earlier days move to today, once a day */
S.rolled=(()=>{try{const r=JSON.parse(localStorage.getItem("sd-rolled2")||"{}");return r.date===today()?r:{date:today(),ids:[],done:false}}catch(_){return {date:today(),ids:[],done:false}}})();
function saveRolled(){if(S.demo)return;try{localStorage.setItem("sd-rolled2",JSON.stringify(S.rolled))}catch(_){}}
async function rollover(){
  if(S.rolled.date!==today())S.rolled={date:today(),ids:[],done:false};
  if(S.rolled.done){carryPicks();return}
  const seen=new Set(),over=[];
  if(STANDALONE){
    /* Steady Days' own store: every unfinished task due before today, in any list */
    let all;try{all=arr(await call("list_undone_tasks_by_date",{search:{startDate:"2000-01-01T00:00:00Z",endDate:dueISO(addDays(today(),-1)).replace("T00:00:00","T23:59:59").replace(/([+-]\d\d)(\d\d)$/,"$1:$2")},client_timezone:TZ},true)).map(nt)}catch(e){return}
    const parents=new Set(all.map(t=>t.parentId).filter(Boolean));
    all.forEach(t=>{if(t.due&&key(new Date(t.due))<today()&&!t.repeat&&t.kind!=="NOTE"&&!parents.has(t.id))over.push(t)})}
  else for(const id of (ttMap().todo||[])){const L=S.tt.lists[id];if(!L)return;if(L.err)continue;
    L.tasks.forEach(t=>{if(seen.has(t.id))return;seen.add(t.id);
      if(t.due&&key(new Date(t.due))<today()&&!t.repeat&&t.kind!=="NOTE"&&!L.tasks.some(x=>x.parentId===t.id))over.push(t)})}
  if(over.length){
    const due=dueTodayISO();
    try{await call("batch_update_tasks",{tasks:over.map(t=>({id:t.id,projectId:t.pid,dueDate:due,startDate:due,isAllDay:true,timeZone:TZ}))})}
    catch(e){return}
    S.rolled.ids=[...new Set([...S.rolled.ids,...over.map(t=>t.id)])];
    toast(over.length===1?"1 unfinished task moved to today":over.length+" unfinished tasks moved to today");
  }
  S.rolled.done=true;saveRolled();
  if(over.length){await ttLoadToday();ttLoadLists()}
  carryPicks();
}
/* yesterday's unfinished Top 3–5 and Maybe picks come along to today, once (saved on the day so other devices don't repeat it) */
function carryPicks(){
  const T=today();if(!MCP||S.tt.state!=="ok"||S.tt.todayErr||!S.rolled.done||S.rolled.date!==T||!dayReady(T)||S.dayQ[T])return;
  const D=getDay(T);if(D.carried)return;
  let prev=null;for(let i=1;i<=7;i++){const k=addDays(T,-i);const d=S.days[k];if(d&&((d.top3||[]).length||(d.maybe||[]).length)){prev=d;break}}
  const open=new Set((S.tt.today||[]).map(t=>t.id));
  const have=new Set([...(D.top3||[]),...(D.maybe||[])].map(x=>x.id));
  const take=L=>(L||[]).filter(x=>!x.done&&open.has(x.id)&&!have.has(x.id)).map(x=>({id:x.id,title:x.title,pid:x.pid,carried:true}));
  const tops=prev?take(prev.top3):[],maybes=prev?take(prev.maybe):[];
  editDay(T,d=>{d.carried=true;if(!tops.length&&!maybes.length)return;
    const room=Math.max(0,(d.topMax===5?5:3)-(d.top3||[]).length);
    d.top3=[...(d.top3||[]),...tops.slice(0,room)];
    d.maybe=[...(d.maybe||[]),...tops.slice(room),...maybes]},{silent:!(tops.length||maybes.length)});
  if(tops.length||maybes.length)toast(`Carried over from yesterday: ${tops.length?`${tops.length} from your Top ${prev.topMax===5?5:3}`:""}${tops.length&&maybes.length?" and ":""}${maybes.length?`${maybes.length} maybe`:""}`)
}
async function discardTask(tid,pid){
  const t0=findTask(tid);const title=t0?t0.title:"task";const realPid=(t0&&t0.pid)||pid;
  const snap=JSON.stringify({l:S.tt.lists,t:S.tt.today});
  for(const k in S.tt.lists)S.tt.lists[k].tasks=S.tt.lists[k].tasks.filter(t=>t.id!==tid);
  S.tt.today=S.tt.today.filter(t=>t.id!==tid);render(true);

/* bonus tasks: once the Top N is done, add one more at a time, with a gentle reminder */
function doneLine(nBonusDone){
  const h=new Date().getHours();const late=h>=20||h<DAY_START_HOUR;
  if(late&&nBonusDone>0)return "It's getting late. Maybe the best next task is winding down. 🌙";
  if(nBonusDone===0)return `${topLabel(today())} done. That was the day's real work. Anything more is a bonus, not a must.`;
  if(nBonusDone===1)return "Nice. Remember rest is part of the work too.";
  if(nBonusDone===2)return "You're on a roll, and it's also fine to stop here. 🌿";
  return "Plenty done today. Be kind to your evening self.";
}

/* ---------- projects model ---------- */
function projBoard(){
  const id=ttMap().projects;const L=id&&S.tt.lists[id];
  if(!L)return null;
  const tasks=L.tasks;const byParent={};tasks.forEach(t=>{if(t.parentId)(byParent[t.parentId]=byParent[t.parentId]||[]).push(t)});
  const heads=tasks.filter(t=>byParent[t.id]&&byParent[t.id].length);
  const headIds=new Set(heads.map(t=>t.id));
  const items=tasks.filter(t=>!headIds.has(t.id));
  const groups=heads.map(h=>({id:h.id,name:h.title,items:items.filter(t=>t.parentId===h.id)}));
  const loose=items.filter(t=>!t.parentId||!tasks.some(x=>x.id===t.parentId));
  if(loose.length)groups.push({id:"_other",name:"Other",items:loose});
  const cols=L.columns;const doneCol=cols.find(c=>/done|fini|termin/i.test(c.name||""));
  const ongoingCol=cols.find(c=>/ongoing|progress|cours/i.test(c.name||""));
  return {L,listId:id,groups,items,cols,doneCol,ongoingCol};
}

function trackable(){

}

    <text x="${L}" y="${H-5}" class="wlab">${fmtDay(pts[0].date,{day:"numeric",month:"short"})}</text><text x="${W-R}" y="${H-5}" text-anchor="end" class="wlab">${fmtDay(pts[pts.length-1].date,{day:"numeric",month:"short"})}</text>
  </svg>`;
}

/* Today's blocks, in your order (Settings → Arrange Today). New blocks appear in their default place. */
const TODAY_BLOCKS=[["pointer","Today's pointer"],["vision","Vision tile"],["trip","Trip countdown"],["g-do","“Do” heading"],["tasks","Top 3 and today's tasks"],["workout","Steady 10 workout"],["g-feel","“Feel” heading"],["dream","Morning dream note (until noon)"],["mood","Mood"],["g-notice","“Notice” heading"],["checkin","Check-in (exercise, water, fruit)"],["weigh","Weekly weigh-in"],["ate","What I ate"],["groc","Groceries"],["media","Monthly photo check"],["wishcheck","Wishlist “still want it?”"],["study","Japanese: WaniKani & Bunpro"],["jpread","Japanese reading"],["g-reflect","“Reflect” heading"],["reflect","Reflection and gratitude"],["extras","Links, project progress, past days"]];
function todayOrder(){
  const def=TODAY_BLOCKS.map(x=>x[0]);const mine=(S.settings.todayOrder||[]).filter(k=>def.includes(k));
  /* older saved orders: the Feel section (dream + mood) takes Notice's old spot, Notice moves below mood */
  if(mine.length&&!mine.includes("g-feel")&&mine.includes("g-notice")&&mine.includes("dream")&&mine.includes("mood")){
    const ni=mine.indexOf("g-notice");if(ni<mine.indexOf("dream")&&ni<mine.indexOf("mood")){mine[ni]="g-feel";const last=Math.max(mine.indexOf("dream"),mine.indexOf("mood"));mine.splice(last+1,0,"g-notice")}}
  def.forEach((k,i)=>{if(mine.includes(k))return;
    if(k.startsWith("g-")){const nxt=def[i+1];if(nxt&&mine.includes(nxt)){mine.splice(mine.indexOf(nxt),0,k);return}}
    const prev=def.slice(0,i).reverse().find(x=>mine.includes(x));mine.splice(prev?mine.indexOf(prev)+1:0,0,k)});
  return mine;
}

async function ttDump(){
  const ps=arr(await call("list_projects",{},true)).filter(p=>!p.closed);
  const projects=[],tasks=[],columns={};
  const keep=["id","projectId","title","content","desc","startDate","dueDate","timeZone","isAllDay","priority","repeatFlag","repeatFrom","status","parentId","columnId","kind","createdTime","modifiedTime","tags","items","sortOrder"];
  for(const p of ps){
    const r=await call("get_project_with_undone_tasks",{project_id:p.id},true);
    if(p.id!=="inbox")projects.push({id:p.id,name:p.name,kind:p.kind||"TASK",viewMode:p.viewMode||"list",sortOrder:p.sortOrder||0,color:p.color||null});
    arr(r&&r.tasks?r.tasks:r).forEach(t=>{const o={};keep.forEach(k=>{if(t[k]!==undefined&&t[k]!==null)o[k]=t[k]});tasks.push(o)});
    if(r&&r.columns&&r.columns.length)columns[p.id]=r.columns.map(c=>({id:c.id,name:c.name,sortOrder:c.sortOrder||0}));
  }
  return {projects,tasks,columns,comments:[]};
}

const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}),ms))]);
async function runImport(){

    return `<section class="card vtoday"><div class="vtt"><span class="eyebrow">Your long-term vision</span><button type="button" class="etext vtitle" data-act="popen" data-id="${p.id}" data-go2="1">${esc(p.title)}</button>${p.why?`<span class="muted small">${esc(p.why)}</span>`:p.looks?`<span class="muted small">${esc(p.looks)}</span>`:""}</div></section>`}
  const all=vItems();if(!all.length||isPastView())return "";
  const n=dayNum(today());const done=all.filter(x=>x.done&&kindOf(x)==="milestone"),intents=all.filter(x=>kindOf(x)==="intention"),open=all.filter(x=>!x.done&&kindOf(x)!=="intention");
  const celebrate=done.length&&(n%7===0||!open.length&&!intents.length);const useInt=!celebrate&&intents.length&&(n%7===2||n%7===5||!open.length);
  const pool=celebrate?done:useInt?intents:open;if(!pool.length)return "";const it=pool[((Math.floor(n/ (useInt?3:1))%pool.length)+pool.length)%pool.length];const pr=vProgress(it);
  return `<section class="card vtoday"><div class="vtt"><span class="eyebrow">${celebrate?"It happened ✓":useInt?"An intention for today":"From your vision"} · ${esc(it.area||"")}</span><button type="button" class="etext vtitle" data-act="vopen" data-id="${it.id}" data-go2="1" title="Open in your vision board">${esc(it.title)}</button>
    ${useInt&&it.prompt?`<span class="small">${esc(it.prompt)}</span>`:pr?`${progBar(pr)}<span class="muted small">${esc(pr.label)}</span>`:celebrate&&it.memory?`<span class="muted small">${esc(it.memory)}</span>`:it.note?`<span class="muted small">${esc(it.note.split("\n")[0])}</span>`:S.vision.motto?`<span class="muted small">${esc(S.vision.motto)}</span>`:""}</div></section>`;
}

/* paste a written vision; Claude turns it into tiles (and lifetime dreams for the Bucket list) for you to review */
function vsortPrompt(text){
  return `You help someone turn their written yearly vision into tiles for a vision board app. Read every point carefully. Some points are very close: merge those into one tile and keep the nuance in the note.
For each tile give:
- "title": short, in the person's own words and language (don't translate)
- "area": one of ${JSON.stringify(V_AREAS)}
- "kind": "milestone" (happens once), "intention" (a way of living, never ticked off), "goal" (a number to reach) or "habit" (something repeated)
- "note": optional nuance or detail from their text
- for intentions, "prompt": a gentle one-line prompt for a daily reminder, e.g. "5 minutes of silence today?"
- for goals: "metric": "weight" if it's body weight in kg, otherwise "manual"; "start" and "target" numbers if given; "unit"
- for habits: "link": "exercise" (exercise/activity days), "bake" (baking), "backlog" (finishing books/games) or "" if none fits; "target": per month (per year for backlog)
- "bucket": true if it's a lifetime dream rather than something for this year
Leave out anything already on the board: ${JSON.stringify(vItems().map(x=>x.title))}.
Return ONLY a JSON array of tiles.

Their vision:
${text}`;
}
async function runVsort(){
  const text=(document.getElementById("vsort-text")||{}).value||S.vsortText||"";if(!text.trim()){toast("Paste your vision first");return}
  S.vsortText=text;S.vsort={state:"loading"};render(true);
  try{const out=await SAMPLE.json(vsortPrompt(text),{modelTier:"default"});
    const rows=(Array.isArray(out)?out:[]).filter(x=>x&&x.title).map(x=>({on:true,t:{id:uid(),title:String(x.title).trim(),area:V_AREAS.includes(x.area)?x.area:V_AREAS[1],kind:["milestone","intention","goal","habit"].includes(x.kind)?x.kind:"milestone",note:String(x.note||""),prompt:x.prompt?String(x.prompt):undefined,
      metric:x.kind==="goal"?(x.metric==="weight"?"weight":"manual"):undefined,start:+x.start>0?+x.start:undefined,target:+x.target>0?+x.target:undefined,unit:x.unit?String(x.unit):undefined,link:x.kind==="habit"&&["exercise","bake","backlog"].includes(x.link)?x.link:undefined,emoji:"✨",done:false,added:today()},bucket:!!x.bucket}));
    S.vsort={state:"ready",rows};}
  catch(e){S.vsort={state:"error",err:PRETTY_ERR[e&&e.code]||"Something went wrong. Try again in a moment."}}
  render(true);
}

/* ---------- Year-end: close this year's vision, carry what matters, archive, start fresh ---------- */
function yeOpenable(){const m=new Date().getMonth(),d=new Date().getDate();return vItems().length&&((m===11&&d>=15)||(m===0&&d<=31&&String(S.vision.year||"")<String(new Date().getFullYear())))}
function startYearEnd(){
  const ch={};vItems().forEach(x=>{if(!x.done)ch[x.id]=kindOf(x)==="milestone"&&/dream/i.test(x.note||"")?"bucket":"carry"});
  S.ye={step:1,choice:ch,pillarNotes:{},note:""};render(true);
}

    :`<li class="grow-row ${x.done?"gdone":""}"><input type="checkbox" class="check" id="g-${x.id}" data-act="gtick" data-id="${x.id}" ${x.done?"checked":""}><label for="g-${x.id}" class="grow">${esc(x.name)}${x.qty?` <span class="muted small">${esc(x.qty)}</span>`:""}</label>${mode?"":`<button type="button" class="linkbtn subtle tiny" data-act="gedit" data-id="${x.id}" aria-label="Edit ${esc(x.name)}">edit</button>`}</li>`;
  const groups=AISLES.map(([k,n,e])=>{const xs=open.filter(x=>(x.aisle||"other")===k);return xs.length?`<div class="gaisle"><span class="eyebrow">${e} ${n}</span><ul class="list glist">${xs.map(row).join("")}</ul></div>`:""}).join("");
  return `<section class="block card groc ${mode?"shopmode":""}"><div class="head"><h2>🛒 Groceries</h2><span class="btnrow"><button type="button" class="btn ${mode?"":"ghost "}sm" data-act="gshop" aria-pressed="${mode}">${mode?"Shopping ✓":"Shopping mode"}</button><button type="button" class="linkbtn" data-act="groc">Close</button></span></div>
    ${mode?"":`<form class="addrow" data-form="gadd"><input type="text" id="gadd" list="g-hist" placeholder="Add an item, e.g. 2 avocados" autocomplete="off"><datalist id="g-hist">${Object.values(S.groceries.history||{}).map(h=>`<option value="${esc(h.name)}"></option>`).join("")}</datalist><button class="btn">Add</button></form>
    ${gUsuals().length?`<div class="chips"><span class="muted small">Usuals</span>${gUsuals().map(h=>`<button type="button" class="chip" data-act="gusual" data-t="${esc(h.name)}">+ ${esc(h.name)}</button>`).join("")}</div>`:""}
    ${plan.length?`<p class="muted small" style="margin:0">Planned meals: ${plan.map(x=>`${esc(x.t)} <span class="muted">(${fmtDay(x.k,{weekday:"short"})})</span>`).join(" · ")}</p>`:""}
    ${src?`<div class="impbox"><p class="small" style="margin:0">Bring over your “${esc(src.p.name)}” list${src.L?` (${src.L.tasks.length})`:""}?</p><div><button type="button" class="btn ghost sm" data-act="${src.L?"gimport":"gload"}">${src.L?"Bring them over":"Look for it"}</button></div></div>`:""}`}
    ${open.length?groups:`<p class="empty">${cart.length?"All in the trolley. 🌿":"Nothing to buy. Add something above, or tap a usual."}</p>`}
    ${cart.length?`<div class="gaisle"><div class="head"><span class="eyebrow">In the trolley · ${cart.length}</span><button type="button" class="btn sm" data-act="gfinish">Done shopping</button></div><ul class="list glist">${cart.map(row).join("")}</ul></div>`:""}
  </section>`;
}

use","から (because)","because / so","寒いから、窓を閉めます。","It's cold, so I'll close the window."],["ga-but","が (but)","but (joining two sentences)","高いですが、おいしいです。","It's expensive, but delicious."],["keredo","けど / けれども","but / although (softer)","行きたいけど、時間がありません。","I want to go, but I don't have time."],["dakara","だから / ですから","so / therefore (starting a sentence)","雨です。だから、家にいます。","It's raining. So I'm staying home."],["soshite","そして","and then / and also","部屋は広いです。そして、明るいです。","The room is big. And it's bright."],["demo","でも","but / however (starting a sentence)","疲れました。でも、楽しかったです。","I'm tired. But it was fun."],["i-adj","い-adjectives","describing words ending in い","この映画はおもしろいです。","This film is interesting."],["i-adj-neg","〜くない","not (adjective)","今日は寒くないです。","It's not cold today."],["i-adj-past","〜かった","was (adjective)","旅行は楽しかったです。","The trip was fun."],["na-adj","な-adjectives","adjectives that take な before a noun","静かな公園が好きです。","I like quiet parks."],["ku-naru","〜くなる / 〜になる","become…","暖かくなりました。","It has become warm."],["sugiru","〜すぎる","too much / too…","このラーメンは辛すぎます。","This ramen is too spicy."],["no-ga-suki","〜のがすきだ","like doing…","料理するのが好きです。","I like cooking."],["ga-suki","〜がすきだ","like (something)","犬が好きです。","I like dogs."],["ga-jouzu","〜がじょうずだ","be good at…","姉は歌が上手です。","My older sister is good at singing."],["ga-wakaru","〜がわかる","understand…","日本語が少しわかります。","I understand a little Japanese."],["ga-aru","〜がある","there is (things)","机の上に本があります。","There is a book on the desk."],["ga-iru","〜がいる","there is (people, animals)","公園に子どもがいます。","There are children in the park."],["no-naka-de","〜のなかで〜がいちばん","the most… among…","果物の中でいちごが一番好きです。","Of all fruits, I like strawberries the most."],["yori","〜より","more than… (comparison)","電車はバスより速いです。","The train is faster than the bus."],["to-dochira","〜と〜とどちらが","which is more…?","夏と冬とどちらが好きですか。","Which do you like more, summer or winter?"],["hou-ga","〜ほうが","…is more (in comparisons)","バスより歩くほうがいいです。","Walking is better than the bus.
