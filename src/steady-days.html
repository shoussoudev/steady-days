<title>Steady Days</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one calm column under a faint tree line (a forest edge), sticky tab strip; Today is the home view */
:root{
  --bg:#EEF1EA; --surface:#F9FBF7; --ink:#1B2A21; --muted:#5B6A5F; --line:#D5DDD3;
  --accent:#2F5A44; --accent-ink:#F3F8F3; --accent-soft:#DCE8DE; --warm:#93652B; --warm-soft:#F1E7D4; --plum:#7B5EA7; --plum-soft:#ECE5F5;
  --danger:#A2453A;
  --m1:#8A6A5A; --m2:#6F8199; --m3:#9AA08E; --m4:#4E8A62; --m5:#C99A3A;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1712; --surface:#16211A; --ink:#E1E9E1; --muted:#93A396; --line:#25332A;
  --accent:#8CC4A0; --accent-ink:#0D1610; --accent-soft:#1F3427; --warm:#D9A65E; --warm-soft:#33291B; --plum:#B9A0E3; --plum-soft:#2C2438;
  --danger:#E08A7E;
  --m1:#B99482; --m2:#9DAFC7; --m3:#AEB4A2; --m4:#8CC4A0; --m5:#E2B866; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1712; --surface:#16211A; --ink:#E1E9E1; --muted:#93A396; --line:#25332A;
  --accent:#8CC4A0; --accent-ink:#0D1610; --accent-soft:#1F3427; --warm:#D9A65E; --warm-soft:#33291B; --plum:#B9A0E3; --plum-soft:#2C2438;
  --danger:#E08A7E;
  --m1:#B99482; --m2:#9DAFC7; --m3:#AEB4A2; --m4:#8CC4A0; --m5:#E2B866; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:700}
h1{font-size:clamp(1.7rem,5vw,2.3rem);letter-spacing:-.01em;line-height:1.1}
h2{font-size:1.15rem;font-weight:700}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.treeline{position:absolute;left:-16px;width:calc(100% + 32px);top:4px;height:80px;pointer-events:none}
.tl-back{fill:var(--accent);opacity:.07}.tl-front{fill:var(--accent);opacity:.11}.tl-ground{fill:var(--accent);opacity:.10}
.forest-top{position:relative;padding-top:78px;margin-top:-12px}
header.top{position:relative;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.status{font-size:.78rem;color:var(--muted);font-family:var(--f-mono)}
.hright{display:flex;align-items:center;gap:10px}
.gear{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px;border-radius:10px;display:grid;place-items:center}
.gear:hover,.gear[aria-expanded="true"]{color:var(--accent);background:var(--accent-soft)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:16px}
.switch{flex:none;width:46px;height:26px;border-radius:999px;border:1px solid var(--line);background:var(--bg);position:relative;cursor:pointer;padding:0}
.switch span{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:left .15s}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"] span{left:22px;background:var(--accent-ink)}
.switch:disabled{opacity:.5;cursor:default}
@media (prefers-reduced-motion:reduce){.switch span{transition:none}}
.banner{background:var(--warm-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:.88rem;margin-bottom:12px}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding:8px 16px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs .row{display:flex;gap:6px;width:max-content}
nav.tabs button{font:500 .9rem var(--f-body);border:1px solid transparent;background:transparent;color:var(--muted);padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
nav.tabs button:hover:not([aria-selected="true"]){border-color:var(--line);color:var(--ink)}

main{display:grid;gap:18px;padding-top:18px}
section.block{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}

button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.1rem;line-height:1;padding:4px 8px;border-radius:6px}
.x:hover{color:var(--danger);background:var(--bg)}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow > input[type=text]{flex:1 1 180px}
.addrow > input[type=number]{flex:0 1 110px}
.addrow > select,.addrow > input[type=date]{flex:0 1 140px}

/* mood */
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mood{display:grid;justify-items:center;gap:6px;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:.8rem;color:var(--muted)}
.mood .dot{width:18px;height:18px;border-radius:50%;background:var(--c);opacity:.55}
.mood[aria-pressed="true"]{border-color:var(--c);color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--c)}
.mood[aria-pressed="true"] .dot{opacity:1;transform:scale(1.15)}

/* gratitude */
.grat{display:grid;gap:8px}
.grat label{display:flex;gap:10px;align-items:center}
.grat .n{font-family:var(--f-mono);color:var(--warm);font-size:.85rem;width:1.2em;flex:none}

/* lists */
ul.list{list-style:none;margin:0;padding:0;display:grid}
ul.list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);min-width:0}
ul.list li:first-child{border-top:0}
ul.list .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.check{appearance:none;width:22px;height:22px;flex:none;border:1.5px solid var(--muted);border-radius:7px;display:grid;place-items:center;cursor:pointer;background:transparent}
.check:checked{background:var(--accent);border-color:var(--accent)}
.check:checked::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
li.done .grow{color:var(--muted);text-decoration:line-through}
.pill{font-family:var(--f-mono);font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--ink);white-space:nowrap}
.pill.want{background:var(--warm-soft)}
.streak{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);white-space:nowrap}
.streak b{color:var(--warm);font-weight:500}

.reminder{background:var(--accent-soft);border-radius:14px;padding:16px 18px;display:grid;gap:8px}
.reminder p{margin:0;font-family:var(--f-display);font-size:1.15rem;font-weight:500;line-height:1.35;text-wrap:balance}

.pointer{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:10px}
.pointer .ptext{margin:0;font-family:var(--f-display);font-size:1.22rem;font-weight:500;line-height:1.35;text-wrap:pretty;max-width:60ch}
.src{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.try{display:grid;gap:2px;background:var(--warm-soft);border-radius:10px;padding:10px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.88rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.pstats{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.week{display:flex;gap:4px}
.week i{width:14px;height:14px;border-radius:4px;background:var(--bg);border:1px solid var(--line)}
.week i.on{background:var(--accent);border-color:var(--accent)}
.proj.paused,.proj.done{opacity:.75}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.small{font-size:.85rem;margin:0}
.pill.soft{background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.pill.late{background:var(--warm-soft);color:var(--warm)}
.prio{width:8px;height:8px;border-radius:50%;flex:none}
.prio.p5{background:var(--danger)}.prio.p3{background:var(--warm)}.prio.p1{background:var(--m2)}
.tt-err{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warm-soft);border-radius:10px;padding:10px 12px;font-size:.9rem}
.hbtn{width:28px;height:28px;flex:none;border-radius:50%;border:1.5px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;font-size:.62rem;color:var(--muted);padding:0}
.hbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hbtn.on:empty::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
table.hg td.part{background:var(--accent-soft)}
table.hg td.sk{background:none;border:0;color:var(--warm);text-align:center;width:auto;padding-left:6px}
ul.list li.prow{display:block;padding:0}
.prow-h{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:10px 0;cursor:pointer;text-align:left;color:inherit;min-width:0}
.prow-h .grow{font-weight:500}
.prow.open .prow-h .grow{color:var(--accent)}
.prow-b{display:grid;gap:10px;padding:0 0 14px}
.pcontent{margin:0;white-space:pre-line;color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
ul.list li.wrow{display:grid;gap:8px}
.wmain{display:flex;align-items:center;gap:10px;min-width:0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.field{display:grid;gap:4px}
.backupnudge{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:8px}
.nsheet textarea{min-height:40dvh}
#n-q{width:100%}
.nlist .tmain{gap:1px}
.grocbtn{position:relative;font-size:1.05rem}
.gcount{position:absolute;top:0;right:-2px;min-width:16px;height:16px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:600 .62rem/16px var(--f-body);text-align:center;padding:0 3px}
.gcount[hidden]{display:none}
.groc{margin:0;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.gaisle{display:grid;gap:2px}
.glist li{align-items:center}
.gdone label{text-decoration:line-through;color:var(--muted)}
.gedit{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.gedit input[type=text]:first-child{flex:1 1 120px}
.shopmode .glist li{padding:12px 0;font-size:1.08rem}
.shopmode .check{width:26px;height:26px}
li.done label{text-decoration:line-through;color:var(--muted)}
.remp{white-space:nowrap}
#nudge-time{width:auto}
.pgrid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.yelist li{flex-wrap:wrap}.seg{display:flex;gap:4px;flex-wrap:wrap}.seg .chip{font-size:.78rem;padding:4px 8px}
.vprog{display:block;height:4px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:2px}
.vprog span{display:block;height:100%;background:var(--accent);border-radius:999px}
.vtile .vprog{margin:0}
.vprogline{display:grid;gap:4px}
.vkindb{position:absolute;top:6px;right:6px;min-width:24px;height:24px;border-radius:999px;background:var(--plum-soft);color:var(--plum);display:grid;place-items:center;font-size:.9rem;font-weight:700}
.kf{flex-wrap:wrap;align-items:end}.kf select{flex:1 1 100%}.kfl{display:grid;gap:2px;flex:1 1 70px}.kfl span{font-size:.75rem;color:var(--muted)}.kfl input{width:100%}
.kindchips .chip{font-size:.82rem}
.brow{padding:0}
.brbtn{display:flex;gap:12px;align-items:center;width:100%;padding:6px 0}
.bem{flex:none;width:44px;height:44px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;font-size:1.4rem;overflow:hidden}
.bem img{width:100%;height:100%;object-fit:cover}
.dform{display:grid;gap:8px}
.dform textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0;resize:vertical;font:inherit;color:inherit}
.tagchip{cursor:pointer}.tagchip input{margin:0 4px 0 0}
.dlist li{align-items:flex-start}
.dtext{display:block;white-space:pre-wrap;margin-top:2px}
#dream-q{width:100%;margin-bottom:6px}
.modal{position:fixed;inset:0;z-index:40;display:grid;align-items:start;justify-items:center;padding:calc(env(safe-area-inset-top,0px) + 56px) 12px 16px;overflow:auto}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,14,.45);border:0;padding:0;margin:0;cursor:default}
.vsheet-in{position:relative}
.modal-in{position:relative;width:min(560px,100%)}
.modal-in .settings{margin:0;box-shadow:0 12px 40px rgba(0,0,0,.25)}
body.modal-open{overflow:hidden}
.arrange{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.arrlist{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.arrlist li{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid var(--line)}
.arrlist li.isgrp span{font-family:var(--f-mono);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.arrlist li.off span{opacity:.45;text-decoration:line-through}
.arrlist .btn.sm{min-width:34px}
.arrlist li .grow{flex:1;min-width:0}
@media (max-width:420px){nav.tabs button{padding:7px 7px;font-size:.84rem}nav.tabs{gap:0}}
.vtoday{display:flex;gap:12px;align-items:center;padding:10px 12px}
.vtile-open{background:none;border:0;padding:0;cursor:pointer;flex:none}
.vtt{display:grid;gap:2px;min-width:0}
.vtitle{font-weight:600}
.vimg{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--accent-soft)}
.vemoji{display:grid;place-items:center;width:100%;aspect-ratio:1;border-radius:12px;background:var(--accent-soft);font-size:2.2rem}
.vsm{width:64px;height:64px;font-size:1.6rem}
.vboardimg{background:none;border:0;padding:0;cursor:zoom-in;display:block;width:100%}
.vboardimg img{width:100%;border-radius:12px;display:block}
.vvalues{margin:0;font-family:var(--f-mono);font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:center}
.vmotto{margin:0;font-family:var(--f-display);font-size:1.15rem;text-align:center}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.vtile{position:relative;background:none;border:0;padding:0;cursor:pointer;display:grid;gap:4px;text-align:left;font:inherit;color:inherit}
.vtile .vlab{font-size:.82rem;line-height:1.25}
.vtile.isdone .vimg,.vtile.isdone .vemoji{opacity:.55}
.vcheck{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.vcheck.big{width:40px;height:40px;font-size:1.2rem;top:10px;right:10px}
.vadd .vemoji{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.vaddform{flex-wrap:wrap}
.vsheet{position:fixed;inset:0;z-index:30;display:grid;align-items:end;justify-items:center;padding:16px}
.vsheet-in{background:var(--surface);border-radius:18px;padding:16px;width:min(520px,100%);max-height:calc(100dvh - 32px);overflow:auto;display:grid;gap:10px}
.vhero{position:relative}
.vbig{max-height:46dvh;object-fit:cover}
.vtitle-in{font:600 1.1rem var(--f-body)}
.vsheet textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0;resize:vertical;font:inherit;color:inherit}
.vzoom{position:fixed;inset:0;z-index:31;border:0;margin:0;background:rgba(10,20,14,.85);overflow:auto;cursor:zoom-out;display:grid;place-items:center;padding:12px}
.vzoom img{max-width:none;width:min(1400px,240vw);border-radius:8px}
@media (min-width:700px){.vzoom img{width:min(1400px,96vw)}}
.banner.demo{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.expick{gap:8px}
.addchip{min-width:36px;justify-content:center}
.exnote{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:10px}
.exnote span{min-width:64px}
.weigh .addrow input[type=number]{max-width:120px}
.wchart{width:100%;height:auto;display:block;overflow:visible}
.wline{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.wdot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.whit{fill:transparent;cursor:default}
.wpt:hover .wdot{r:5}
.wgrid{stroke:var(--line);stroke-width:1}
.wlab{fill:var(--muted);font-size:10px;font-family:var(--f-mono)}
.filebtn{cursor:pointer}
.impbox{display:grid;gap:8px;background:var(--accent-soft);border-radius:12px;padding:10px 12px}
.impbox.error{background:var(--warm-soft)}
.warn{color:var(--warm)}
.etext{background:none;border:0;padding:0;margin:0;text-align:left;font:inherit;color:inherit;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.etext:hover{color:var(--accent)}
.etext:focus-visible{outline:2px solid var(--accent);border-radius:4px}
li.editing{display:block}
.eform{display:grid;gap:8px;width:100%}

.pretty{border:1px solid var(--accent)}
.prows li{display:grid;gap:6px}
.prow{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.pdiff{display:grid;gap:2px;min-width:0}
.pbefore{color:var(--muted);text-decoration:line-through;font-size:.88rem;overflow-wrap:anywhere}
.pafter{font-weight:600;overflow-wrap:anywhere}
.psplit{padding-left:28px}
.pflag{flex:none;background:none;border:0;padding:8px;margin:-8px -4px -8px -8px;cursor:pointer;display:grid;place-items:center;border-radius:8px}
.pflag i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--muted);opacity:.55}
.pflag.p1 i{background:var(--m2);border-color:var(--m2);opacity:1}.pflag.p2 i{background:var(--warm);border-color:var(--warm);opacity:1}.pflag.p3 i{background:var(--danger);border-color:var(--danger);opacity:1}
.pflag:hover{background:var(--accent-soft)}
.linkbtn.tiny{font-size:inherit;padding:0}
form[data-form="wishadd"] select,form[data-form="bladd"] select{flex:0 0 auto;width:auto}
.bltype{font-size:1.1rem;flex:none}
.stars{color:var(--warm);letter-spacing:1px}.stars .dim{opacity:.25}
.rate{display:flex;gap:2px}
.rate label{cursor:pointer;font-size:1.5rem;line-height:1;color:var(--line)}
.rate input{position:absolute;opacity:0;width:1px;height:1px}
.rate label:has(input:checked) span[aria-hidden],.rate label:has(~ label input:checked) span[aria-hidden]{color:var(--warm)}
.rate input:focus-visible+span{outline:2px solid var(--accent);border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wtitle{background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer;display:grid;gap:1px;min-width:0}
.wtitle>span:first-child{overflow-wrap:anywhere}

function seeded(n){let x=(n*2654435761)>>>0;return ()=>{x^=x<<13;x>>>=0;x^=x>>17;x^=x<<5;x>>>=0;return x/4294967296}}
function workoutFor(k,shift=0){
  const n=dayNum(k);const f=FOCI[(((n+shift)%4)+4)%4];const rnd=seeded(n*7+shift);
  const pool=f.pool.slice();for(let i=pool.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  const ex=[];
  if(f.skill){const sk=SKILLS[f.skill];const lv=Math.min(sk.levels.length,Math.max(1,(S.settings.skills||{})[f.skill]||1));const L=sk.levels[lv-1];ex.push({name:L[0],how:L[1],dose:L[2],skill:f.skill,level:lv,goal:L[3]})}
  f.fixed.forEach(x=>ex.push({name:x[0],how:x[1],dose:x[2]}));
  (f.picks||[]).forEach(g=>{const x=g[Math.floor(rnd()*g.length)];if(!ex.some(e=>e.name===x[0]))ex.push({name:x[0],how:x[1],dose:x[2]})});
  const used=new Set(ex.map(e=>e.name));for(let i=pool.length-1;i>=0;i--)if(used.has(pool[i][0]))pool.splice(i,1);
  while(ex.length<4&&pool.length){const x=pool.shift();ex.push({name:x[0],how:x[1],dose:x[2]})}
  return {focus:f,ex};
}

const pending={},inflight={},debounced={};
function queueWrite(id,body){if(!S.live)return;pending[id]=JSON.parse(JSON.stringify(body));if(!inflight[id])flush(id)}
async function flush(id){
  inflight[id]=true;
  while(pending[id]){
    const body=pending[id];delete pending[id];
    try{await S.db.collection("data/users/"+S.uid).doc(id).set(body)}
    catch(e){
      if(e&&e.code==="unavailable"){await sleep(800+Math.random()*800);if(!pending[id])pending[id]=body;continue}
      toast(e&&e.code==="quota_exceeded"?"Storage is full. Delete some old entries to keep saving.":"Couldn't save that change. Check your connection and try again.");
    }
  }
  inflight[id]=false;
}
function saveLater(id,fn,ms=600){clearTimeout(debounced[id]);debounced[id]=setTimeout(()=>{delete debounced[id];fn()},ms)}

/* ---------- undo (5 minutes) ---------- */
const UNDO_MS=5*60*1000;
S.undo=S.demo?[]:(()=>{try{return JSON.parse(localStorage.getItem("sd-undo")||"[]").filter(u=>Date.now()-u.at<UNDO_MS)}catch(_){return []}})();
let undoBarHidden=false;
function saveUndo(){if(S.demo)return;try{localStorage.setItem("sd-undo",JSON.stringify(S.undo))}catch(_){}}
function pushUndo(entry){entry.uid=uid();entry.at=Date.now();S.undo.unshift(entry);S.undo=S.undo.slice(0,20);saveUndo();undoBarHidden=false;tickUndo();render()}
const undoLabel=u=>u.label||(u.kind==="tt"?`Completed “${u.title}”`:"");
function tickUndo(){
  const before=S.undo.length;S.undo=S.undo.filter(u=>Date.now()-u.at<UNDO_MS);
  if(S.undo.length!==before){saveUndo();render()}
  const bar=$("#undobar"),u=S.undo[0];
  if(!u||undoBarHidden){bar.hidden=true;document.body.classList.remove("has-undo");return}
  const left=Math.max(0,UNDO_MS-(Date.now()-u.at));
  $("#undo-label").textContent=undoLabel(u);
  $("#undo-time").textContent=Math.floor(left/60000)+":"+pad(Math.floor(left/1000)%60);
  bar.hidden=false;document.body.classList.add("has-undo");
  document.querySelectorAll("[data-undo-left]").forEach(el=>{const x=S.undo.find(v=>v.uid===el.dataset.undoLeft);if(x){const l=Math.max(0,UNDO_MS-(Date.now()-x.at));el.textContent=Math.floor(l/60000)+":"+pad(Math.floor(l/1000)%60)}});
}
setInterval(tickUndo,1000);
async function runUndo(uidv){
  const u=S.undo.find(x=>x.uid===uidv);if(!u)return;
  S.undo=S.undo.filter(x=>x.uid!==uidv);saveUndo();tickUndo();
  try{
    if(u.kind==="vreset"){editDoc("vision",d=>{Object.assign(d,u.snap.vision)});editDoc("visionimg",d=>{d.img=u.snap.img});toast("Your board is back")}
    else if(u.kind==="docall"){editDoc(u.doc,d=>{d.items=u.items});toast("Restored the earlier version")}
    else if(u.kind==="doc"){
      editDoc(u.doc,d=>{const i=d.items.findIndex(x=>x.id===u.item.id);if(i>=0)d.items[i]=u.item;else d.items.splice(Math.min(u.index??0,d.items.length),0,u.item)});
      if(u.buy)editDay(u.buy.date,d=>{d.purchases=d.purchases.filter(p=>p.id!==u.buy.id)});
      toast("Restored");
    }else if(u.kind==="tt"){
      await call("update_task",{task_id:u.tid,task:{id:u.tid,projectId:u.pid,status:0},client_timezone:TZ});
      if((getDay(today()).top3||[]).some(x=>x.id===u.tid))editDay(today(),d=>{d.top3=d.top3.map(x=>x.id===u.tid?{...x,done:false}:x)},{silent:true});
      if((getDay(today()).maybe||[]).some(x=>x.id===u.tid))editDay(today(),d=>{d.maybe=d.maybe.map(x=>x.id===u.tid?{...x,done:false}:x)},{silent:true});
      if(u.buy)editDay(u.buy.date,d=>{d.purchases=d.purchases.filter(p=>p.id!==u.buy.id)});
      toast(`Restored “${u.title}” in TickTick`);
      ttLoadLists();ttLoadToday();
    }else{
      const restore={meal:d=>d.meals.unshift(u.item),purchase:d=>d.purchases.unshift(u.item),progress:d=>{d.progress=d.progress||[];d.progress.push(u.item)},ate:d=>{d.ate=d.ate||[];d.ate.push(u.item)}}[u.what];
      if(restore)editDay(u.date,restore);
      else editSettings(st=>{const key={todo:"todos",habit:"habits",rem:"reminders",project:"projects"}[u.what];if(key)st[key].splice(Math.min(u.index??0,st[key].length),0,u.item)});
      toast("Restored");
    }
  }catch(e){S.undo.unshift(u);saveUndo();tickUndo();toast(ttErrToast(e))}
  render(true);
}
function recentBox(filter){
  const items=S.undo.filter(filter||(()=>true));if(!items.length)return "";
  return `<section class="block card recent"><div class="head"><h2>Recently closed</h2><span class="eyebrow">Undo within 5 minutes</span></div>
    <ul class="list">${items.map(u=>`<li><span class="ul">${esc(undoLabel(u))}</span><span class="mono muted small" data-undo-left="${u.uid}"></span><button class="btn ghost sm" data-act="undo" data-id="${u.uid}">Undo</button></li>`).join("")}</ul></section>`;
}
function findTask(tid){for(const k in S.tt.lists){const t=S.tt.lists[k].tasks.find(x=>x.id===tid);if(t)return t}return S.tt.today.find(x=>x.id===tid)||null}
function delLocal(kind,date,id,label){
  // remove one item and remember it for undo
  if(["meal","purchase","progress","ate"].includes(kind)){
    const d=getDay(date);const arrName={meal:"meals",purchase:"purchases",progress:"progress",ate:"ate"}[kind];const item=(d[arrName]||[]).find(x=>x.id===id);if(!item)return;
    editDay(date,dd=>{dd[arrName]=(dd[arrName]||[]).filter(x=>x.id!==id)});
    pushUndo({kind:"local",what:kind,date,item,label:label(item)});
  }else{
    const key={todo:"todos",habit:"habits",rem:"reminders",project:"projects"}[kind];const idx=S.settings[key].findIndex(x=>x.id===id);if(idx<0)return;const item=S.settings[key][idx];
    editSettings(st=>{st[key]=st[key].filter(x=>x.id!==id)});
    pushUndo({kind:"local",what:kind,item,index:idx,label:label(item)});
  }
}

/* rollover: unfinished to-dos from earlier days move to today, once a day */
S.rolled=(()=>{try{const r=JSON.parse(localStorage.getItem("sd-rolled")||"{}");return r.date===today()?r:{date:today(),ids:[],done:false}}catch(_){return {date:today(),ids:[],done:false}}})();
function saveRolled(){if(S.demo)return;try{localStorage.setItem("sd-rolled",JSON.stringify(S.rolled))}catch(_){}}
async function rollover(){
  if(S.rolled.date!==today())S.rolled={date:today(),ids:[],done:false};
  if(S.rolled.done)return;
  const seen=new Set(),over=[];
  for(const id of (ttMap().todo||[])){const L=S.tt.lists[id];if(!L||L.err)return;
    L.tasks.forEach(t=>{if(seen.has(t.id))return;seen.add(t.id);
      if(t.due&&key(new Date(t.due))<today()&&!t.repeat&&t.kind!=="NOTE"&&!L.tasks.some(x=>x.parentId===t.id))over.push(t)})}
  if(over.length){
    const due=dueTodayISO();
    try{await call("batch_update_tasks",{tasks:over.map(t=>({id:t.id,projectId:t.pid,dueDate:due,startDate:due,isAllDay:true,timeZone:TZ}))})}
    catch(e){return}
    S.rolled.ids=[...new Set([...S.rolled.ids,...over.map(t=>t.id)])];
    toast(over.length===1?"1 unfinished task moved to today":over.length+" unfinished tasks moved to today");
  }
  S.rolled.done=true;saveRolled();
  if(over.length){ttLoadToday();ttLoadLists()}
}
async function discardTask(tid,pid){
  const t0=findTask(tid);const title=t0?t0.title:"task";const realPid=(t0&&t0.pid)||pid;
  const snap=JSON.stringify({l:S.tt.lists,t:S.tt.today});
  for(const k in S.tt.lists)S.tt.lists[k].tasks=S.tt.lists[k].tasks.filter(t=>t.id!==tid);
  S.tt.today=S.tt.today.filter(t=>t.id!==tid);render(true);
  try{await call("update_task",{task_id:tid,task:{id:tid,projectId:realPid,status:-1},client_timezone:TZ});
    pushUndo({kind:"tt",tid,pid:realPid,title,label:`Discarded “${title}”`})}
  catch(e){const o=JSON.parse(snap);S.tt.lists=o.l;S.tt.today=o.t;render(true);toast(ttErrToast(e))}
}

/* ---------- Top 3 per day, expandable to 5 with "+2" ---------- */
const topMax=k=>getDay(k).topMax===5?5:3;
const topLabel=k=>"Top "+topMax(k);
const sizeBtn=k=>{const n=(getDay(k).top3||[]).length;return topMax(k)===3?`<button type="button" class="linkbtn" data-act="topsize" data-d="${k}" data-n="5" title="Allow up to 5">+2</button>`:n<=3?`<button type="button" class="linkbtn subtle" data-act="topsize" data-d="${k}" data-n="3" title="Back to 3">Back to 3</button>`:""};

/* bonus tasks: once the Top N is done, add one more at a time, with a gentle reminder */
function doneLine(nBonusDone){
  const h=new Date().getHours();const late=h>=20||h<DAY_START_HOUR;
  if(late&&nBonusDone>0)return "It's getting late. Maybe the best next task is winding down. 🌙";
  if(nBonusDone===0)return `${topLabel(today())} done. That was the day's real work. Anything more is a bonus, not a must.`;
  if(nBonusDone===1)return "Nice. Remember rest is part of the work too.";
  if(nBonusDone===2)return "You're on a roll, and it's also fine to stop here. 🌿";
  return "Plenty done today. Be kind to your evening self.";
}

/* ---------- morning reminder: the next few days' pointer + Top 3, read by the 7:30 scheduled nudge ---------- */
let lastReminder="";
function pointerFor(k){const n=dayNum(k);const [tid,tname]=THEMES[((n%4)+4)%4];const list=POINTERS[tid];const p=list[((Math.floor(n/4)%list.length)+list.length)%list.length];return {theme:tname,text:p[0],source:p[1],tryToday:p[2]}}
function saveReminderNote(){
  if(!S.live||!S.db)return;
  const days={};[0,1,2].forEach(i=>{const k=addDays(today(),i);days[k]={dayCount:dayNum(k)-dayNum(S.settings.startDay||START_DAY)+1,pointer:pointerFor(k),top3:(getDay(k).top3||[]).filter(x=>!x.done).map(x=>x.title),meals:(getDay(k).mealPlan||[]).map(x=>((SLOTS.find(y=>y[0]===x.slot)||["",""])[1]+": "+x.text).trim())}});
  const body={days};const sig=JSON.stringify(body);if(sig===lastReminder)return;lastReminder=sig;
  saveLater("reminder",()=>{S.db.doc("reminder/next").set({...body,updated:new Date().toISOString()}).catch(()=>{lastReminder=""})},1500);
}

/* TickTick actions */
function dueTodayISO(){return dueISO(today())}
function dueISO(k){const [yy,mm,dd]=k.split("-").map(Number);const d=new Date(yy,mm-1,dd);const o=-d.getTimezoneOffset();const s=o>=0?"+":"-";const a=Math.abs(o);return k+"T00:00:00"+s+pad(Math.floor(a/60))+pad(a%60)}
async function addTask(listId,title,{dueToday=false}={}){

}

function hVal(h,k){const c=(S.tt.checks[h.id]||{})[stamp(k)];return c?c.value||0:0}
function hDone(h,k){const c=(S.tt.checks[h.id]||{})[stamp(k)];return !!c&&c.status===2}
function hStreak(h){let k=today(),n=0;if(!hDone(h,k))k=addDays(k,-1);while(hDone(h,k)&&n<400){n++;k=addDays(k,-1)}return n}
async function habitTap(id){
  const h=S.tt.habits.find(x=>x.id===id);if(!h)return;
  const st=stamp(today());const m=S.tt.checks[id]=S.tt.checks[id]||{};const prev=m[st]?{...m[st]}:null;
  const goal=h.goal||1;let value,status;
  if(h.type==="Real"&&goal>1){const v=(prev?prev.value||0:0)+1;value=v>goal?0:v;status=value>=goal?2:0}
  else{const on=prev&&prev.status===2;value=on?0:goal;status=on?0:2}
  m[st]={...(prev||{}),value,status};render(true);
  const data={stamp:st,status,value,goal};if(prev&&prev.id)data.id=prev.id;
  try{await call("upsert_habit_checkins",{habit_id:id,checkin_data:data,client_timezone:TZ})}
  catch(e){if(prev)m[st]=prev;else delete m[st];render(true);toast(ttErrToast(e))}
}

/* ---------- projects model ---------- */
function projBoard(){
  const id=ttMap().projects;const L=id&&S.tt.lists[id];
  if(!L)return null;
  const tasks=L.tasks;const byParent={};tasks.forEach(t=>{if(t.parentId)(byParent[t.parentId]=byParent[t.parentId]||[]).push(t)});
  const heads=tasks.filter(t=>byParent[t.id]&&byParent[t.id].length);
  const headIds=new Set(heads.map(t=>t.id));
  const items=tasks.filter(t=>!headIds.has(t.id));
  const groups=heads.map(h=>({id:h.id,name:h.title,items:items.filter(t=>t.parentId===h.id)}));
  const loose=items.filter(t=>!t.parentId||!tasks.some(x=>x.id===t.parentId));
  if(loose.length)groups.push({id:"_other",name:"Other",items:loose});
  const cols=L.columns;const doneCol=cols.find(c=>/done|fini|termin/i.test(c.name||""));
  const ongoingCol=cols.find(c=>/ongoing|progress|cours/i.test(c.name||""));
  return {L,listId:id,groups,items,cols,doneCol,ongoingCol};
}
const colName=(b,cid)=>{const c=b.cols.find(c=>c.id===cid);return c?c.name:""};
function trackable(){
  const out=[];const b=ttOn()&&projBoard();
  if(b){const rank=t=>t.columnId===(b.ongoingCol||{}).id?0:1;
    b.items.filter(t=>!b.doneCol||t.columnId!==b.doneCol.id).sort((x,y)=>rank(x)-rank(y)).forEach(t=>out.push({id:t.id,name:t.title,tt:t,ongoing:rank(t)===0}))}
  S.settings.projects.filter(p=>p.status==="active").forEach(p=>out.push({id:p.id,name:p.name,local:true}));
  return out;
}
const projEntries=pid=>sortedDays().flatMap(d=>(d.progress||[]).filter(p=>p.pid===pid).map(p=>({...p,date:d.date})));
const ago=k=>{const n=dayNum(today())-dayNum(k);return n===0?"today":n===1?"yesterday":n+" days ago"};

/* ---------- local helpers ---------- */
function streak(hid){let k=today(),n=0;if(!getDay(k).habits[hid])k=addDays(k,-1);while(getDay(k).habits[hid]){n++;k=addDays(k,-1)}return n}
function reminderOfDay(){
  const r=S.settings.reminders;if(!r.length)return null;
  const idx=dayNum(today())+S.remShift;return r[((idx%r.length)+r.length)%r.length];
}
function sortedDays(){return Object.values(S.days).sort((a,b)=>a.date<b.date?1:-1)}
function dueLabel(t){
  if(!t.due)return "";let k=key(new Date(t.due));if(k===key())k=today();const n=dayNum(k)-dayNum(today());
  if(n<0)return `<span class="pill late">${-n===1?"yesterday":-n+"d late"}</span>`;
  if(n===0)return `<span class="pill">today</span>`;
  if(n===1)return `<span class="pill soft">tomorrow</span>`;
  return `<span class="pill soft">${fmtDay(k,{day:"numeric",month:"short"})}</span>`;
}
const prioDot=t=>t.priority>=5?`<i class="prio p5" title="High priority"></i>`:t.priority>=3?`<i class="prio p3" title="Medium priority"></i>`:t.priority>=1?`<i class="prio p1" title="Low priority"></i>`:"";

  const remBtn=STANDALONE?`<button type="button" class="linkbtn subtle tiny" data-act="remopen" data-id="${t.id}" data-pid="${esc(t.pid)}" aria-label="Set a reminder for ${esc(plainTitle(t.title))}">⏰</button>`:"";

    return `<li class="trow editing"><form class="eform" data-form="remind" data-id="${t.id}" data-pid="${esc(t.pid)}"><span class="small"><b>${esc(plainTitle(t.title))}</b> · remind me at</span><div class="addrow"><input type="datetime-local" id="rem-at" value="${v}" aria-label="Reminder time"><button class="btn sm">Save</button></div>

/* ---------- weekly weigh-in: Monday morning is the suggested moment; the card waits until Wednesday ---------- */
const weighIns=()=>Object.values(S.days).filter(d=>d.weight&&+d.weight.kg>0).map(d=>({date:d.date,kg:+d.weight.kg})).sort((a,b)=>a.date<b.date?-1:1);
const kgTxt=x=>(Math.round(x*10)/10).toFixed(1);
const deltaTxt=(cur,prev)=>{if(prev==null)return "";const d=Math.round((cur-prev)*10)/10;return d===0?"same as last time":(d>0?"+":"−")+Math.abs(d).toFixed(1)+" kg since last time"};
function weighCard(){
  if(isPastView()||S.settings.weighOff)return "";
  const all=weighIns(),ws=weekStart(today()),dow=dowOf(today());const mine=all.filter(w=>w.date>=ws).pop();
  const prev=all.filter(w=>w.date<(mine?mine.date:today())).pop();
  if(mine&&!isOpen("weigh"))return [1,2,3].includes(dow)||mine.date===today()?foldRow("weigh","Weigh-in",`${kgTxt(mine.kg)} kg`,esc(deltaTxt(mine.kg,prev&&prev.kg))):"";
  if(!mine&&![1,2,3].includes(dow))return "";
  return `<section class="block card weigh"><div class="head"><h2>Weekly weigh-in</h2>${mine?`<button type="button" class="linkbtn" data-act="fold" data-k="weigh">Done</button>`:""}</div>

    <p class="muted small" style="margin:0">${dow===1?"Monday morning, after waking and before breakfast, gives the most consistent number.":"Best on Monday mornings; any day this week is fine."} One number a week is plenty: the trend matters more than any single day.</p>
  </section>`;
}
function weightChart(pts){
  if(pts.length<2)return "";
  const W=320,H=130,L=34,R=10,T=12,B=22;const ys=pts.map(p=>p.kg);let lo=Math.min(...ys),hi=Math.max(...ys);if(hi-lo<1){const m=(hi+lo)/2;lo=m-0.5;hi=m+0.5}
  const pad=(hi-lo)*0.15;lo-=pad;hi+=pad;const x=i=>L+(W-L-R)*(pts.length===1?0.5:i/(pts.length-1)),y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const path=pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p.kg).toFixed(1)).join(" ");
  const gl=[hi-pad,lo+pad];
  return `<svg class="wchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight over the last ${pts.length} weigh-ins, from ${kgTxt(pts[0].kg)} to ${kgTxt(pts[pts.length-1].kg)} kg">
    ${gl.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" class="wgrid"/><text x="${L-6}" y="${(y(v)+3.5).toFixed(1)}" text-anchor="end" class="wlab">${kgTxt(v)}</text>`).join("")}
    <path d="${path}" class="wline"/>
    ${pts.map((p,i)=>`<g class="wpt"><circle cx="${x(i).toFixed(1)}" cy="${y(p.kg).toFixed(1)}" r="12" class="whit"><title>${fmtDay(p.date,{day:"numeric",month:"short"})}: ${kgTxt(p.kg)} kg</title></circle><circle cx="${x(i).toFixed(1)}" cy="${y(p.kg).toFixed(1)}" r="4" class="wdot"/></g>`).join("")}
    <text x="${L}" y="${H-5}" class="wlab">${fmtDay(pts[0].date,{day:"numeric",month:"short"})}</text><text x="${W-R}" y="${H-5}" text-anchor="end" class="wlab">${fmtDay(pts[pts.length-1].date,{day:"numeric",month:"short"})}</text>
  </svg>`;
}
function weightSection(){

/* ---------- Wishlist: lives in Steady Days. Needs are ready; wants cool off first (30 or 60 days) ---------- */
const ageDays=t=>t&&t.created?dayNum(today())-dayNum(key(new Date(t.created))):null;
const norm=x=>String(x||"").replace(/\[([^\]]*)\]\([^)]*\)/g,"$1").trim().toLowerCase();
const plainTitle=t=>String(t||"").replace(/\[([^\]]*)\]\([^)]*\)/g,"$1").trim();
S.wish={items:[],imported:false};S.backlog={items:[]};S.vision={items:[]};S.visionimg={items:[]};S.bucket={items:[]};S.dreams={items:[]};S.longterm={items:[]};S.groceries={items:[]};S.trips={items:[]};S.notes={items:[]};
function editDoc(id,fn,{silent=false}={}){const d=JSON.parse(JSON.stringify(S[id]));fn(d);S[id]=d;
  if(silent)saveLater(id,()=>queueWrite(id,{...S[id],kind:id}));else{queueWrite(id,{...d,kind:id});render(true)}}
const daysTo=k=>dayNum(k)-dayNum(today());
const waitedOf=it=>Math.max(0,dayNum(it.closed||today())-dayNum(it.added||today()));
const safeUrl=u=>/^https?:\/\/\S+$/i.test(String(u||"").trim())?String(u).trim():"";
const shortDay=k=>fmtDay(k,{day:"numeric",month:"short"});
function wState(it){
  if(it.status!=="open")return it.status;
  if(it.kind==="want"&&it.until){if(it.until>today())return "cooling";if(!it.checked)return "check"}
  return "ready";
}
const openWish=()=>S.wish.items.filter(x=>x.status==="open");
function wishTasks(){return openWish().map(x=>({id:x.id,title:x.title}))}
const findWish=id=>S.wish.items.find(x=>x.id===id);
function addWish(title,kind="want",hold=30){
  const it={id:uid(),title,kind,hold:kind==="want"?hold:0,added:today(),until:kind==="want"&&hold?addDays(today(),hold):null,checked:false,status:"open",prio:0,note:"",link:""};
  editDoc("wish",d=>{d.items.unshift(it)});
  toast(it.until?`Added. It's cooling off until ${shortDay(it.until)}.`:"Added to your wishlist");
}
function letGo(id){const i=S.wish.items.findIndex(x=>x.id===id);if(i<0)return;const it=S.wish.items[i];
  editDoc("wish",d=>{Object.assign(d.items[i],{status:"letgo",closed:today()})});
  pushUndo({kind:"doc",doc:"wish",item:it,label:`Let go of “${it.title}”`});toast("Let go. That's money kept. 🌿")}
function buyWish(id,price,kind,why){
  const i=S.wish.items.findIndex(x=>x.id===id);if(i<0)return;const it=S.wish.items[i];const pidBuy=uid();const waited=waitedOf(it);const early=wState(it)==="cooling";
  editDoc("wish",d=>{Object.assign(d.items[i],{status:"bought",closed:today(),price,...(early?{why:why||""}:{})})});
  editDay(today(),d=>{d.purchases.unshift({id:pidBuy,item:it.title,price:Math.round(price*100)/100,kind:kind||(it.kind==="need"?"need":"want"),wl:{wid:id,waited,...(early?{early:true,why:why||""}:{})}})});
  pushUndo({kind:"doc",doc:"wish",item:it,buy:{date:today(),id:pidBuy},label:`Bought “${it.title}”`});
  toast(early?"Logged. Thanks for pausing to name why.":"Logged in Purchases. Enjoy it!");
}
/* one-time move of the TickTick wishlist into Steady Days; TickTick itself is left untouched */
function ttWishSource(){const id=ttOn()&&ttMap().wishlist;const L=id&&S.tt.lists[id];if(!L||L.err||L.loading&&!L.tasks.length||S.wish.imported)return null;return L}
function ttWishItems(L){
  const parents=new Set(L.tasks.filter(t=>L.tasks.some(x=>x.parentId===t.id)).map(t=>t.id));
  const have=new Set(S.wish.items.map(x=>x.ttId).filter(Boolean));
  return L.tasks.filter(t=>t.kind!=="NOTE"&&!parents.has(t.id)&&!have.has(t.id)).map(t=>{
    const m=/\[([^\]]*)\]\((https?:[^)]+)\)/.exec(t.title||"");
    const body=String(t.content||"").replace(/!\[[^\]]*\]\([^)]*\)/g,"").replace(/\\([()\[\]])/g,"$1").replace(/\n{3,}/g,"\n\n").trim();
    const url=m?m[2]:((/https?:\/\/\S+/.exec(body)||[])[0]||"");
    const added=t.created?key(new Date(t.created)):today();const age=dayNum(today())-dayNum(added);
    return {id:uid(),ttId:t.id,title:plainTitle(t.title)||"(untitled)",note:body,link:url,prio:({5:3,3:2,1:1})[t.priority]||0,kind:"want",hold:30,
      added,until:age<30?addDays(added,30):null,checked:false,status:"open",from:"tt"};
  });
}
function importWish(){const L=ttWishSource();if(!L)return;const items=ttWishItems(L);
  editDoc("wish",d=>{d.items=[...d.items,...items];d.imported=true});toast(`Brought over ${items.length} item${items.length===1?"":"s"}`)}

const wishBuyForm=(it,early)=>`<form class="wbuy" data-form="buy" data-id="${it.id}">
  ${early?`<label class="field"><span class="small">It's still cooling off (${daysTo(it.until)} days left). What makes now the right time?</span><input type="text" id="wb-why" placeholder="One line is enough" autocomplete="off" required></label>`:""}
  <div class="addrow"><input type="number" id="wb-price" placeholder="£ price" step="0.01" min="0" inputmode="decimal" aria-label="Price"><select id="wb-kind" aria-label="Need or want"><option value="want" ${it.kind!=="need"?"selected":""}>Want</option><option value="need" ${it.kind==="need"?"selected":""}>Need</option></select><button class="btn">Log purchase</button></div></form>`;
function wishRow(it){

/* ---------- Prettify: Claude suggests tidier titles (and author/year for media); nothing changes until you accept ---------- */
S.pretty=null;
const PRETTY_ERR={server_missing:"Claude isn't set up on your server yet. Add the Claude key (see the setup steps), then try again.",not_granted:"Prettify needs permission to ask Claude. You can allow it from this page's permissions.",rate_limited:"Claude is busy right now. Try again in a little while.",session_expired:"Sign in to Claude again, then retry.",invalid_json:"The suggestions came back in a muddle. Try again.",refused:"Claude couldn't help with these items.",empty_completion:"No suggestions came back. Try again."};
const prettyPool=doc=>doc==="wish"?openWish():S.backlog.items.filter(x=>x.status!=="dropped");
const prettyNew=doc=>prettyPool(doc).filter(x=>!x.pretty);
function prettyPrompt(doc,items){
  if(doc==="backlog")return `You tidy a personal media backlog. For each item, give the work's title as it is commonly known (correct spelling and capitalisation; keep French or romanised Japanese titles if that is how the item is written, unless the English title is clearly what is meant), the creator, and the year of first release.
Creator: book = author; manga = mangaka/author; game = developer studio; film = director; series or anime = creator or studio.
If you are not confident which work is meant, leave "by" and "year" empty and only fix spelling and capitalisation. Never invent details.
Return ONLY a JSON array, one object per item that should change: {"id": string, "title": string, "by": string, "year": number|null}. Leave out items that are already correct and complete.
Items:
${JSON.stringify(items.map(x=>({id:x.id,kind:blT(x.type)[3],title:x.title,by:x.by||"",year:x.year||null})))}`;
  return `You tidy a personal shopping wishlist written in a mix of French and English.
For each item, suggest a clean title: fix spelling, capitalisation and spacing, keep brand and product names, keep the language it is written in (do not translate), keep it short. Example: "Sac randonnée Oakley " -> "Sac de randonnée Oakley".
If the item's note is clearly a list of several separate products the person wants (for example a list of albums or books), also suggest splitting it: "split" = a list of clean item titles, one per product, skipping lines marked done with ✅ and lines that are not products.
Return ONLY a JSON array, one object per item that should change: {"id": string, "title": string, "split": string[] (optional)}. Leave out items that are already fine.
Items:
${JSON.stringify(items.map(x=>({id:x.id,title:x.title,note:(x.note||"").slice(0,1200)})))}`;
}
async function runPretty(doc,all){
  if(!SAMPLE)return;
  const items=(all?prettyPool(doc):prettyNew(doc));if(!items.length){toast("Nothing new to tidy");return}
  S.pretty={doc,state:"loading",rows:[],sent:items.map(x=>x.id),n:items.length};render(true);window.scrollTo({top:0});
  try{
    const rows=[];
    for(let i=0;i<items.length;i+=40){
      const chunk=items.slice(i,i+40);
      const out=await SAMPLE.json(prettyPrompt(doc,chunk),{modelTier:"quick"});
      (Array.isArray(out)?out:[]).forEach(o=>{const it=chunk.find(x=>x.id===o.id);if(!it||!o||typeof o.title!=="string")return;
        const title=o.title.trim()||it.title;const by=doc==="backlog"?String(o.by||"").trim():"";const year=doc==="backlog"&&+o.year>0?Math.round(+o.year):null;
        const split=doc==="wish"&&Array.isArray(o.split)?o.split.map(t=>String(t).trim()).filter(Boolean).slice(0,60):[];
        const changed=!(title===it.title&&(doc!=="backlog"||(by===(it.by||"")&&year===(it.year||null))));
        if(changed||split.length)rows.push({id:it.id,before:it.title,beforeMeta:[it.by,it.year].filter(Boolean).join(" · "),title,by,year,split,changed,on:changed,splitOn:false});});
      if(S.pretty&&S.pretty.state==="loading")S.pretty.progress=Math.min(items.length,i+40);
    }
    if(!S.pretty||S.pretty.doc!==doc)return;
    S.pretty={...S.pretty,state:"ready",rows};
  }catch(e){if(S.pretty)S.pretty={...S.pretty,state:"error",err:PRETTY_ERR[e&&e.code]||"Something went wrong. Try again in a moment."}}
  render(true);
}
function applyPretty(){
  const P=S.pretty;if(!P||P.state!=="ready")return;const doc=P.doc;const before=JSON.parse(JSON.stringify(S[doc].items));
  const pick=P.rows.filter(r=>r.on||r.splitOn);let n=0;
  editDoc(doc,d=>{
    d.items.forEach(x=>{if(P.sent.includes(x.id))x.pretty=true});
    pick.forEach(r=>{const i=d.items.findIndex(x=>x.id===r.id);if(i<0)return;const x=d.items[i];n++;
      if(r.on){x.title=r.title;if(doc==="backlog"){if(r.by)x.by=r.by;else delete x.by;if(r.year)x.year=r.year;else delete x.year}}
      if(r.splitOn&&r.split.length){const parts=r.split.map(t=>({...x,id:uid(),title:t,note:"",link:"",pretty:true,ttId:undefined}));d.items.splice(i,1,...parts)}
    });
  });
  pushUndo({kind:"docall",doc,items:before,label:`Prettified ${n} item${n===1?"":"s"}`});
  S.pretty=null;toast(n?`Tidied ${n} item${n===1?"":"s"}`:"Nothing changed");render(true);
}
function prettyBtn(doc){
  if(!SAMPLE||S.pretty&&S.pretty.doc===doc)return "";const n=prettyNew(doc).length,all=prettyPool(doc).length;if(!all)return "";
  return `<button type="button" class="linkbtn" data-act="pretty" data-doc="${doc}" data-all="${n?"":"1"}" title="Suggest tidier titles${doc==="backlog"?", with author and year":""}. You review before anything changes.">✨ Prettify${n&&n<all?` ${n} new`:n?"":" again"}</button>`;
}
function prettyPanel(doc){
  const P=S.pretty;if(!P||P.doc!==doc)return "";
  if(P.state==="loading")return `<section class="block card pretty"><div class="head"><h2>✨ Prettify</h2><button type="button" class="linkbtn subtle" data-act="prettycancel">Cancel</button></div><p class="muted small" style="margin:0">Asking Claude to tidy ${P.n} item${P.n===1?"":"s"}${P.progress?` (${P.progress} done)`:""}… this can take up to a minute.</p></section>`;
  if(P.state==="error")return `<section class="block card pretty"><div class="head"><h2>✨ Prettify</h2><button type="button" class="linkbtn subtle" data-act="prettycancel">Close</button></div><p class="small" style="margin:0">${esc(P.err)}</p></section>`;
  const on=P.rows.filter(r=>r.on||r.splitOn).length;
  return `<section class="block card pretty"><div class="head"><h2>✨ Suggested changes</h2><span class="mono muted">${P.rows.length}</span></div>

/* paste a written vision; Claude turns it into tiles (and lifetime dreams for the Bucket list) for you to review */
function vsortPrompt(text){
  return `You help someone turn their written yearly vision into tiles for a vision board app. Read every point carefully. Some points are very close: merge those into one tile and keep the nuance in the note.
For each tile give:
- "title": short, in the person's own words and language (don't translate)
- "area": one of ${JSON.stringify(V_AREAS)}
- "kind": "milestone" (happens once), "intention" (a way of living, never ticked off), "goal" (a number to reach) or "habit" (something repeated)
- "note": optional nuance or detail from their text
- for intentions, "prompt": a gentle one-line prompt for a daily reminder, e.g. "5 minutes of silence today?"
- for goals: "metric": "weight" if it's body weight in kg, otherwise "manual"; "start" and "target" numbers if given; "unit"
- for habits: "link": "exercise" (exercise/activity days), "bake" (baking), "backlog" (finishing books/games) or "" if none fits; "target": per month (per year for backlog)
- "bucket": true if it's a lifetime dream rather than something for this year
Leave out anything already on the board: ${JSON.stringify(vItems().map(x=>x.title))}.
Return ONLY a JSON array of tiles.

Their vision:
${text}`;
}
async function runVsort(){
  const text=(document.getElementById("vsort-text")||{}).value||S.vsortText||"";if(!text.trim()){toast("Paste your vision first");return}
  S.vsortText=text;S.vsort={state:"loading"};render(true);
  try{const out=await SAMPLE.json(vsortPrompt(text),{modelTier:"default"});
    const rows=(Array.isArray(out)?out:[]).filter(x=>x&&x.title).map(x=>({on:true,t:{id:uid(),title:String(x.title).trim(),area:V_AREAS.includes(x.area)?x.area:V_AREAS[1],kind:["milestone","intention","goal","habit"].includes(x.kind)?x.kind:"milestone",note:String(x.note||""),prompt:x.prompt?String(x.prompt):undefined,
      metric:x.kind==="goal"?(x.metric==="weight"?"weight":"manual"):undefined,start:+x.start>0?+x.start:undefined,target:+x.target>0?+x.target:undefined,unit:x.unit?String(x.unit):undefined,link:x.kind==="habit"&&["exercise","bake","backlog"].includes(x.link)?x.link:undefined,emoji:"✨",done:false,added:today()},bucket:!!x.bucket}));
    S.vsort={state:"ready",rows};}
  catch(e){S.vsort={state:"error",err:PRETTY_ERR[e&&e.code]||"Something went wrong. Try again in a moment."}}
  render(true);
}

async function finishYearEnd(){

/* ---------- Weekly recap ---------- */
const weekStart=k=>{const [y,m,d]=k.split("-").map(Number);const dow=new Date(y,m-1,d).getDay();return addDays(k,-((dow+6)%7))};
const dowOf=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d).getDay()};
function weekMoments(days){
  const out=[];
  days.forEach(k=>{const d=getDay(k);
    (d.gratitude||[]).forEach((g,i)=>{if(g&&g.trim())out.push({k,kind:"Grateful",text:g.trim()})});
    if(d.proud&&d.proud.trim())out.push({k,kind:"Proud",text:d.proud.trim()});
    if(d.note&&d.note.trim())out.push({k,kind:"Note",text:d.note.trim()});
  });
  return out;
}

const NUDGE_TASK="trig_01WNVxsADqavGjR9DpeSyvho";const CCR="Claude Code Remote";
S.nudge={state:"idle",enabled:null,err:null};
async function loadNudge(){
  if(!MCP){S.nudge={state:"error",enabled:null,err:{code:"capability_disabled"}};render(true);return}
  S.nudge={...S.nudge,state:"loading"};render(true);
  try{
    let cursor=null,found=null;
    for(let i=0;i<5&&!found;i++){
      const r=(await MCP.callTool(CCR,"list_triggers",cursor?{recurring:true,limit:100,cursor}:{recurring:true,limit:100},{cache:false})).payload||{};
      found=(r.data||[]).find(t=>t.id===NUDGE_TASK)||null;cursor=r.next_cursor;if(!cursor)break;
    }
    S.nudge=found?{state:"ok",enabled:!!found.enabled,next:found.next_run_at||null,err:null}:{state:"missing",enabled:null,err:null};
  }catch(e){S.nudge={state:"error",enabled:null,err:e}}
  render(true);
}

function demoMcp(st){
  const open=t=>t.status===0,dk=t=>t.dueDate?key(new Date(t.dueDate)):null,find=id=>st.tasks.find(x=>x.id===id);
  const tools={
    list_projects:()=>({result:[{id:"inbox",name:"Inbox",kind:"TASK"},...st.projects]}),
    get_project_with_undone_tasks:({project_id})=>({project:st.projects.find(p=>p.id===project_id)||{id:"inbox",name:"Inbox"},tasks:st.tasks.filter(t=>open(t)&&t.projectId===project_id),columns:st.columns[project_id]||[]}),
    list_undone_tasks_by_date:({search})=>{const a=key(new Date(search.startDate)),b=key(new Date(search.endDate||search.startDate));return {result:st.tasks.filter(t=>open(t)&&dk(t)&&dk(t)>=a&&dk(t)<=b)}},
    list_undone_tasks_by_time_query:({query_command})=>{const k=query_command==="tomorrow"?addDays(today(),1):today();return {result:st.tasks.filter(t=>open(t)&&dk(t)===k)}},
    create_task:({task})=>{const t={priority:0,kind:"TEXT",content:"",...task,id:"dm"+uid(),projectId:task.projectId||"inbox",status:0,createdTime:new Date().toISOString()};st.tasks.push(t);return t},
    complete_task:({task_id})=>{const t=find(task_id);if(t)t.status=2;return t||{}},
    update_task:({task_id,task})=>{const t=find(task_id||task.id);if(t)Object.assign(t,task);return t||{}},
    batch_update_tasks:({tasks})=>{(tasks||[]).forEach(p=>{const t=find(p.id);if(t)Object.assign(t,p)});return {ok:true}},
    add_comment:()=>({ok:true}),
    create_project:({name})=>{const p={id:"dm"+uid(),name,kind:"TASK",viewMode:"list"};st.projects.push(p);return p},
    list_habits:()=>({result:[]}),get_habit_checkins:()=>({result:[]}),upsert_habit_checkins:()=>({ok:true})
  };
  return {callTool:async(server,name,input)=>{const f=tools[name];if(!f){const e=new Error("Not available in demo mode");e.code="tool_error";throw e}return {payload:JSON.parse(JSON.stringify(f(input||{})))}}};
}

    col.doc("settings").onSnapshot(snap=>{
      if(!pending.settings&&!inflight.settings){const d=snap.exists?snap.data():null;
        S.settings={habits:d?.habits||[],reminders:d?.reminders||[],todos:d?.todos||[],projects:d?.projects||[],ttMap:d?.ttMap||null,favs:d?.favs||[],pnotes:d?.pnotes||{},lastBackup:d?.lastBackup||null,claudeCredit:d?.claudeCredit??null,nudgeOn:d?.nudgeOn,nudgeTime:d?.nudgeTime||"07:22",timeZone:d?.timeZone||TZ,todayOrder:d?.todayOrder||[],todayHidden:d?.todayHidden||[],exKinds:d?.exKinds||[],weighOff:!!d?.weighOff,skills:d?.skills||{},highlights:d?.highlights||{}};
        if(ttOn())ttLoadListsMissing();}
      S.settingsReady=true;render();
    },()=>{S.settingsReady=true;render()});
    ["wish","backlog","vision","visionimg","bucket","dreams","longterm","groceries","trips","notes"].forEach(id=>col.doc(id).onSnapshot(snap=>{
      if(!pending[id]&&!inflight[id]&&!debounced[id]){const d=snap.exists?snap.data():null;S[id]={...S[id],...(d||{}),items:(d&&d.items)||[]}}
      render();
    },()=>{}));
    col.where("kind","==","day").orderBy("date","desc").limit(180).onSnapshot(snap=>{
      snap.docs.forEach(doc=>{const d=doc.data();const k="d-"+d.date;if(pending[k]||inflight[k]||debounced[k])return;S.days[d.date]={...blankDay(d.date),...d,gratitude:[0,1,2].map(i=>(d.gratitude||[])[i]||"")}});
      render();
    },()=>toast("Lost connection to your saved entries. Reload to reconnect."));
  }catch(e){offlineDb()}
}
function ttLoadListsMissing(){neededLists().filter(id=>!S.tt.lists[id]).forEach(ttLoadList)}
function offlineDb(){
  S.live=false;S.settingsReady=true;setStatus();
  const b=$("#banner");b.hidden=false;b.textContent="Saving isn't available in this view, so your journal entries will disappear when you leave. Open the page signed in to Claude to keep them.";
  render();
}
async function connectTT(){
  claude.use("sample").then(x=>{SAMPLE=x;render()}).catch(()=>{});
  claude.use("downloads").then(x=>{DL=x;render()}).catch(()=>{});
  try{MCP=await claude.use("mcp")}catch(_){MCP=null}
  if(!MCP){S.tt.state="off";setStatus();render();return}
  ttLoadAll();
}
$("#undo-btn").addEventListener("click",()=>{const u=S.undo[0];if(u)runUndo(u.uid)});
$("#undo-close").addEventListener("click",()=>{undoBarHidden=true;tickUndo()});
tickUndo();
if(S.demo)startDemo();
else if(!window.claude||!claude.use){S.tt.state="off";offlineDb()}
else{connectDb();connectTT()}
})();
</script>
