<title>Steady Days</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one calm column under a faint tree line (a forest edge), sticky tab strip; Today is the home view */
:root{
  --bg:#EEF1EA; --surface:#F9FBF7; --ink:#1B2A21; --muted:#5B6A5F; --line:#D5DDD3;
  --accent:#2F5A44; --accent-ink:#F3F8F3; --accent-soft:#DCE8DE; --warm:#93652B; --warm-soft:#F1E7D4;
  --danger:#A2453A;
  --m1:#8A6A5A; --m2:#6F8199; --m3:#9AA08E; --m4:#4E8A62; --m5:#C99A3A;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1712; --surface:#16211A; --ink:#E1E9E1; --muted:#93A396; --line:#25332A;
  --accent:#8CC4A0; --accent-ink:#0D1610; --accent-soft:#1F3427; --warm:#D9A65E; --warm-soft:#33291B;
  --danger:#E08A7E;
  --m1:#B99482; --m2:#9DAFC7; --m3:#AEB4A2; --m4:#8CC4A0; --m5:#E2B866; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1712; --surface:#16211A; --ink:#E1E9E1; --muted:#93A396; --line:#25332A;
  --accent:#8CC4A0; --accent-ink:#0D1610; --accent-soft:#1F3427; --warm:#D9A65E; --warm-soft:#33291B;
  --danger:#E08A7E;
  --m1:#B99482; --m2:#9DAFC7; --m3:#AEB4A2; --m4:#8CC4A0; --m5:#E2B866; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:700}
h1{font-size:clamp(1.7rem,5vw,2.3rem);letter-spacing:-.01em;line-height:1.1}
h2{font-size:1.15rem;font-weight:700}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.treeline{position:absolute;left:-16px;width:calc(100% + 32px);top:4px;height:80px;pointer-events:none}
.tl-back{fill:var(--accent);opacity:.07}.tl-front{fill:var(--accent);opacity:.11}.tl-ground{fill:var(--accent);opacity:.10}
.forest-top{position:relative;padding-top:78px;margin-top:-12px}
header.top{position:relative;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.status{font-size:.78rem;color:var(--muted);font-family:var(--f-mono)}
.hright{display:flex;align-items:center;gap:10px}
.gear{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px;border-radius:10px;display:grid;place-items:center}
.gear:hover,.gear[aria-expanded="true"]{color:var(--accent);background:var(--accent-soft)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:16px}
.switch{flex:none;width:46px;height:26px;border-radius:999px;border:1px solid var(--line);background:var(--bg);position:relative;cursor:pointer;padding:0}
.switch span{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:left .15s}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"] span{left:22px;background:var(--accent-ink)}
.switch:disabled{opacity:.5;cursor:default}
@media (prefers-reduced-motion:reduce){.switch span{transition:none}}
.banner{background:var(--warm-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:.88rem;margin-bottom:12px}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding:8px 16px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs .row{display:flex;gap:6px;width:max-content}
nav.tabs button{font:500 .9rem var(--f-body);border:1px solid transparent;background:transparent;color:var(--muted);padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
nav.tabs button:hover:not([aria-selected="true"]){border-color:var(--line);color:var(--ink)}

main{display:grid;gap:18px;padding-top:18px}
section.block{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}

button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.1rem;line-height:1;padding:4px 8px;border-radius:6px}
.x:hover{color:var(--danger);background:var(--bg)}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow > input[type=text]{flex:1 1 180px}
.addrow > input[type=number]{flex:0 1 110px}
.addrow > select,.addrow > input[type=date]{flex:0 1 140px}

/* mood */
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mood{display:grid;justify-items:center;gap:6px;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:.8rem;color:var(--muted)}
.mood .dot{width:18px;height:18px;border-radius:50%;background:var(--c);opacity:.55}
.mood[aria-pressed="true"]{border-color:var(--c);color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--c)}
.mood[aria-pressed="true"] .dot{opacity:1;transform:scale(1.15)}

/* gratitude */
.grat{display:grid;gap:8px}
.grat label{display:flex;gap:10px;align-items:center}
.grat .n{font-family:var(--f-mono);color:var(--warm);font-size:.85rem;width:1.2em;flex:none}

/* lists */
ul.list{list-style:none;margin:0;padding:0;display:grid}
ul.list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);min-width:0}
ul.list li:first-child{border-top:0}
ul.list .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.check{appearance:none;width:22px;height:22px;flex:none;border:1.5px solid var(--muted);border-radius:7px;display:grid;place-items:center;cursor:pointer;background:transparent}
.check:checked{background:var(--accent);border-color:var(--accent)}
.check:checked::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
li.done .grow{color:var(--muted);text-decoration:line-through}
.pill{font-family:var(--f-mono);font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--ink);white-space:nowrap}
.pill.want{background:var(--warm-soft)}
.streak{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);white-space:nowrap}
.streak b{color:var(--warm);font-weight:500}

.reminder{background:var(--accent-soft);border-radius:14px;padding:16px 18px;display:grid;gap:8px}
.reminder p{margin:0;font-family:var(--f-display);font-size:1.15rem;font-weight:500;line-height:1.35;text-wrap:balance}

.pointer{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:10px}
.pointer .ptext{margin:0;font-family:var(--f-display);font-size:1.22rem;font-weight:500;line-height:1.35;text-wrap:pretty;max-width:60ch}
.src{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.try{display:grid;gap:2px;background:var(--warm-soft);border-radius:10px;padding:10px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.88rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.pstats{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.week{display:flex;gap:4px}
.week i{width:14px;height:14px;border-radius:4px;background:var(--bg);border:1px solid var(--line)}
.week i.on{background:var(--accent);border-color:var(--accent)}
.proj.paused,.proj.done{opacity:.75}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.small{font-size:.85rem;margin:0}
.pill.soft{background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.pill.late{background:var(--warm-soft);color:var(--warm)}
.prio{width:8px;height:8px;border-radius:50%;flex:none}
.prio.p5{background:var(--danger)}.prio.p3{background:var(--warm)}.prio.p1{background:var(--m2)}
.tt-err{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warm-soft);border-radius:10px;padding:10px 12px;font-size:.9rem}
.hbtn{width:28px;height:28px;flex:none;border-radius:50%;border:1.5px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;font-size:.62rem;color:var(--muted);padding:0}
.hbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hbtn.on:empty::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
table.hg td.part{background:var(--accent-soft)}
table.hg td.sk{background:none;border:0;color:var(--warm);text-align:center;width:auto;padding-left:6px}
ul.list li.prow{display:block;padding:0}
.prow-h{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:10px 0;cursor:pointer;text-align:left;color:inherit;min-width:0}
.prow-h .grow{font-weight:500}
.prow.open .prow-h .grow{color:var(--accent)}
.prow-b{display:grid;gap:10px;padding:0 0 14px}
.pcontent{margin:0;white-space:pre-line;color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
ul.list li.wrow{display:grid;gap:8px}
.wmain{display:flex;align-items:center;gap:10px;min-width:0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.field{display:grid;gap:4px}
.filebtn{cursor:pointer}
.etext{background:none;border:0;padding:0;margin:0;text-align:left;font:inherit;color:inherit;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.etext:hover{color:var(--accent)}
.etext:focus-visible{outline:2px solid var(--accent);border-radius:4px}
li.editing{display:block}
.eform{display:grid;gap:8px;width:100%}

.pretty{border:1px solid var(--accent)}
.prows li{display:grid;gap:6px}
.prow{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.pdiff{display:grid;gap:2px;min-width:0}
.pbefore{color:var(--muted);text-decoration:line-through;font-size:.88rem;overflow-wrap:anywhere}
.pafter{font-weight:600;overflow-wrap:anywhere}
.psplit{padding-left:28px}
.pflag{flex:none;background:none;border:0;padding:8px;margin:-8px -4px -8px -8px;cursor:pointer;display:grid;place-items:center;border-radius:8px}
.pflag i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--muted);opacity:.55}
.pflag.p1 i{background:var(--m2);border-color:var(--m2);opacity:1}.pflag.p2 i{background:var(--warm);border-color:var(--warm);opacity:1}.pflag.p3 i{background:var(--danger);border-color:var(--danger);opacity:1}
.pflag:hover{background:var(--accent-soft)}
.linkbtn.tiny{font-size:inherit;padding:0}
form[data-form="wishadd"] select,form[data-form="bladd"] select{flex:0 0 auto;width:auto}
.bltype{font-size:1.1rem;flex:none}
.stars{color:var(--warm);letter-spacing:1px}.stars .dim{opacity:.25}
.rate{display:flex;gap:2px}
.rate label{cursor:pointer;font-size:1.5rem;line-height:1;color:var(--line)}
.rate input{position:absolute;opacity:0;width:1px;height:1px}
.rate label:has(input:checked) span[aria-hidden],.rate label:has(~ label input:checked) span[aria-hidden]{color:var(--warm)}
.rate input:focus-visible+span{outline:2px solid var(--accent);border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wtitle{background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer;display:grid;gap:1px;min-width:0}
.wtitle>span:first-child{overflow-wrap:anywhere}
.wnote1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wedit{display:grid;gap:8px;padding:4px 0 2px}
.wedit textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0;resize:vertical;font:inherit;color:inherit}
.wfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.wbuy{display:grid;gap:8px}
.wcheck{display:grid}
.import{border:1px dashed var(--accent)}
.pnote{display:grid;gap:6px;margin-top:8px}
.pnote textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0;resize:vertical;font:inherit;color:inherit}
.pnote.shown{text-align:left;background:var(--accent-soft);border:0;border-radius:10px;padding:8px 11px;gap:2px;font:inherit;color:inherit;cursor:pointer;width:100%}
.pnote.shown span:last-child{white-space:pre-wrap}
.gentle{display:grid;gap:6px;background:var(--accent-soft);border-radius:12px;padding:10px 12px}
.topmeta{display:inline-flex;align-items:center;gap:10px}
.planned{display:grid;gap:2px;border-top:1px solid var(--line);padding-top:8px}
.mealplan form[data-form="mealplan"]{flex-wrap:nowrap}
.mealplan #mp-slot{flex:0 0 auto;width:auto}
.mealplan #mp-text{flex:1 1 60px}
.daycount{color:var(--muted);opacity:.8}
.therapy{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.therapy textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0;resize:vertical;font:inherit;color:inherit}
.linkbtn.subtle{color:var(--muted);font-weight:500}
.wtimer{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.wtimer .mono{font-size:1.6rem;font-variant-numeric:tabular-nums;color:var(--ink)}
.grp{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:6px 2px -8px}
.foldrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit;padding:12px 16px;flex-wrap:wrap}
.foldrow .fl{font-weight:600}
.foldrow .fv{display:inline-flex;align-items:center;gap:6px;min-width:0;overflow-wrap:anywhere}
.foldrow .fx{color:var(--muted);font-size:.88rem;min-width:0;overflow-wrap:anywhere}
.foldrow .fe{margin-left:auto;color:var(--accent);font-size:.85rem;font-weight:600}
.foldrow:hover{border-color:var(--accent)}
.mdot{width:10px;height:10px;border-radius:50%;display:inline-block}
.linkbtn{background:none;border:0;padding:4px 2px;color:var(--accent);font:600 .88rem var(--f-body);cursor:pointer}
.linkbtn:hover{text-decoration:underline}
.reflect{gap:8px}
.rrow{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center}
.rrow > span{font-size:.85rem;color:var(--muted)}
@media (max-width:420px){.rrow{grid-template-columns:1fr;gap:2px}.rrow > span:empty{display:none}}
ul.atelist{list-style:none;margin:0;padding:0;display:grid}
ul.atelist li{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line)}
ul.atelist li:first-child{border-top:0}
ul.atelist li > .muted{width:70px;flex:none}
.atelist .x{align-self:center}
#ate-slot{flex:0 0 auto;width:auto}
form[data-form="ate"]{flex-wrap:nowrap}
form[data-form="ate"] > input[type=text]{flex:1 1 60px}
.rrow .linkbtn{justify-self:start}
.extras{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:4px 2px}
.extras a{font-weight:600;text-decoration:none;font-size:.88rem}
.proglist{padding:0 2px}
.dayline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:0 2px 8px}
.subnav{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.subnav button{background:none;border:0;padding:6px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font:500 .9rem var(--f-body)}
.subnav button[aria-selected="true"]{color:var(--ink);background:var(--accent-soft)}
.wknav{display:flex;align-items:center;gap:6px}
.weekmood{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wm{display:grid;justify-items:center;gap:4px;font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.wm i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line)}
.rgroup{display:grid;gap:6px}
.plainlist{margin:0;padding-left:18px;display:grid;gap:4px}
li.mrow{align-items:flex-start}
.mrow .tmain{gap:2px}
.hlstar{color:var(--warm);font-size:1.1rem;line-height:1.3;width:30px;text-align:center;flex:none}
.recapcta{border-color:var(--warm)}
.wlist{margin:0;padding-left:20px;display:grid;gap:12px}
.wlist li{padding-left:4px}
.whead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.whead .mono{color:var(--accent);font-size:.85rem;white-space:nowrap}
.wlevel{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.lvbtns{display:flex;gap:6px;margin-left:auto}
.howto{white-space:nowrap;font-weight:600;text-decoration:none}
.howto:hover{text-decoration:underline}
.plansum{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.plansum .small{min-width:0;overflow-wrap:anywhere}
.plan{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.plan h3{font-family:var(--f-display);font-size:1rem;margin:0}
.planpicks{margin:0;padding-left:20px;display:grid;gap:4px}
.pickbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.starbtn{background:none;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:1rem;line-height:1;color:var(--muted);padding:5px 8px}
.starbtn[aria-pressed="true"]{color:var(--warm);border-color:var(--warm);background:var(--warm-soft)}
.donerow .tmain span{color:var(--muted);text-decoration:line-through}
.donechk{display:grid;place-items:center;background:var(--accent);border-color:var(--accent)!important}
.donechk::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.daypick{display:flex;gap:6px;flex-wrap:wrap}
.pastnote{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warm-soft);border-radius:12px;padding:12px 14px;font-size:.92rem}
.homemade{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted);cursor:pointer}
.homemade input{width:16px;height:16px;accent-color:var(--accent)}
.ateg{display:grid;gap:2px}
ul.list li.trow{align-items:flex-start}
ul.list li.trow .check{margin-top:1px}
.tmain{flex:1;min-width:0;display:grid;gap:6px}
.tmain label{overflow-wrap:anywhere;cursor:pointer;line-height:1.4}
.tmain label .prio{display:inline-block;margin-right:6px;vertical-align:middle}
.tmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tmeta .tdiscard{margin-left:auto}
.favbtn{background:none;border:0;cursor:pointer;font-size:1.25rem;line-height:1;color:var(--muted);padding:2px 6px;border-radius:6px}
.favbtn[aria-pressed="true"]{color:var(--warm)}
.remline{display:grid;gap:2px;border-top:1px solid var(--line);padding-top:10px}
.yn{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:var(--bg);border:0;padding:7px 14px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button[data-v="no"][aria-pressed="true"]{background:var(--warm-soft);color:var(--ink)}
table.hg td.no{background:var(--bg);border-color:var(--warm)}
a{color:var(--accent)}
.empty{color:var(--muted);font-size:.9rem;padding:4px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{display:grid;gap:2px}
.stat .v{font-family:var(--f-mono);font-size:1.35rem;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:999px;background:var(--warm-soft);overflow:hidden;display:flex}
.bar span{background:var(--accent);height:100%}

/* habit grid */
.gridwrap{overflow-x:auto}
table.hg{border-collapse:separate;border-spacing:3px;font-size:.78rem}
table.hg th{font-weight:500;color:var(--muted);font-family:var(--f-mono);text-align:center}
table.hg th.name{text-align:left;font-family:var(--f-body);color:var(--ink);padding-right:8px;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
table.hg td{width:20px;height:20px;border-radius:5px;background:var(--bg);border:1px solid var(--line)}
table.hg td.on{background:var(--accent);border-color:var(--accent)}

.moodstrip{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:72px}
.moodstrip div{border-radius:4px 4px 2px 2px;background:var(--line);min-height:4px}
.moodstrip-l{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;font-family:var(--f-mono);font-size:.62rem;color:var(--muted);text-align:center}

.day{display:grid;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day .d{display:flex;gap:8px;align-items:center;font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.day .d i{width:10px;height:10px;border-radius:50%;display:inline-block}
.day ul{margin:0;padding-left:18px}

.undobar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:21;width:min(520px,calc(100% - 32px));background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px;font-size:.9rem;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.undobar .ul{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.undobar .ut{font-family:var(--f-mono);font-size:.78rem;opacity:.7}
.undobar button{background:var(--bg);color:var(--ink);border:0;border-radius:8px;padding:7px 12px;font-weight:600;cursor:pointer}
.undobar .ux{background:transparent;color:var(--bg);padding:6px 8px;font-weight:400}
body.has-undo .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.recent li .ul{flex:1;min-width:0;color:var(--muted);text-decoration:line-through;overflow-wrap:anywhere}
.jp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.jp a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);background:var(--bg);font-weight:600}
.jp a span{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);font-weight:400}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:.88rem;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.mood .dot{transition:transform .15s,opacity .15s}}

function seeded(n){let x=(n*2654435761)>>>0;return ()=>{x^=x<<13;x>>>=0;x^=x>>17;x^=x<<5;x>>>=0;return x/4294967296}}
function workoutFor(k,shift=0){
  const n=dayNum(k);const f=FOCI[(((n+shift)%4)+4)%4];const rnd=seeded(n*7+shift);
  const pool=f.pool.slice();for(let i=pool.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  const ex=[];
  if(f.skill){const sk=SKILLS[f.skill];const lv=Math.min(sk.levels.length,Math.max(1,(S.settings.skills||{})[f.skill]||1));const L=sk.levels[lv-1];ex.push({name:L[0],how:L[1],dose:L[2],skill:f.skill,level:lv,goal:L[3]})}
  f.fixed.forEach(x=>ex.push({name:x[0],how:x[1],dose:x[2]}));
  (f.picks||[]).forEach(g=>{const x=g[Math.floor(rnd()*g.length)];if(!ex.some(e=>e.name===x[0]))ex.push({name:x[0],how:x[1],dose:x[2]})});
  const used=new Set(ex.map(e=>e.name));for(let i=pool.length-1;i>=0;i--)if(used.has(pool[i][0]))pool.splice(i,1);
  while(ex.length<4&&pool.length){const x=pool.shift();ex.push({name:x[0],how:x[1],dose:x[2]})}
  return {focus:f,ex};
}

const pending={},inflight={},debounced={};
function queueWrite(id,body){if(!S.live)return;pending[id]=JSON.parse(JSON.stringify(body));if(!inflight[id])flush(id)}
async function flush(id){
  inflight[id]=true;
  while(pending[id]){
    const body=pending[id];delete pending[id];
    try{await S.db.collection("data/users/"+S.uid).doc(id).set(body)}
    catch(e){
      if(e&&e.code==="unavailable"){await sleep(800+Math.random()*800);if(!pending[id])pending[id]=body;continue}
      toast(e&&e.code==="quota_exceeded"?"Storage is full. Delete some old entries to keep saving.":"Couldn't save that change. Check your connection and try again.");
    }
  }
  inflight[id]=false;
}
function saveLater(id,fn,ms=600){clearTimeout(debounced[id]);debounced[id]=setTimeout(()=>{delete debounced[id];fn()},ms)}

const arr=p=>Array.isArray(p)?p:(p&&Array.isArray(p.result)?p.result:[]);
const nt=t=>({id:t.id,pid:t.projectId||t.project_id||"",title:t.title||"(untitled)",content:t.content||t.desc||"",
  due:t.dueDate||t.due_date||null,priority:t.priority||0,parentId:t.parentId||t.parent_id||null,
  columnId:t.columnId||t.column_id||"",created:t.createdTime||t.created_time||null,kind:t.kind||"TEXT",repeat:t.repeatFlag||t.repeat_flag||""});
const byDue=(a,b)=>(a.due?Date.parse(a.due):Infinity)-(b.due?Date.parse(b.due):Infinity);
async function call(tool,input,read){
  try{return (await MCP.callTool(TT,tool,input,read?{cache:false}:undefined)).payload}
  catch(e){
    if(read&&e&&e.retryable){await sleep((e.retryAfterMs||800)+Math.random()*600);return (await MCP.callTool(TT,tool,input,{cache:false})).payload}
    throw e;
  }
}
function ttErrToast(e){
  const c=e&&e.code;
  if(c==="needs_reauth")return "TickTick needs reconnecting in claude.ai Settings → Connectors.";
  if(c==="server_unavailable"||c==="upstream_error")return "TickTick didn't confirm that change. Refresh to check whether it went through.";
  if(c==="approval_required")return "TickTick needs your approval for that. Try again and choose Allow.";
  if(c==="not_in_manifest"||c==="blocked_by_policy")return "TickTick is turned off for this page.";
  if(c==="tool_error")return "TickTick refused that change: "+(e.message||"unknown reason");
  return "Couldn't reach TickTick. Try again in a moment.";
}
function ttErrBox(e){
  const c=e&&e.code;let msg;
  if(c==="needs_reauth")msg="TickTick needs reconnecting. Open claude.ai Settings → Connectors and reconnect TickTick.";
  else if(c==="server_not_connected"||c==="server_not_found")msg="TickTick isn't connected for you. Add it in claude.ai Settings → Connectors.";
  else if(c==="selection_required")msg="You have more than one TickTick connection. Choose one when Claude asks, then try again.";
  else if(c==="not_in_manifest"||c==="blocked_by_policy"||c==="consent_required")msg="TickTick is turned off for this page. You can allow it from the page's Permissions menu.";
  else if(c==="approval_required")msg="TickTick needs your approval before the page can read it.";
  else if(c==="tool_error")msg="TickTick returned an error: "+esc(e.message||"unknown");
  else msg="Couldn't reach TickTick just now.";
  return `<div class="tt-err"><span>${msg}</span><button class="btn ghost" data-act="ttreload">${c==="approval_required"?"Allow and load":"Try again"}</button></div>`;
}

function autoMap(){
  const ps=S.tt.projects;const find=re=>ps.find(p=>re.test(p.name||""));
  const m={todo:ps.filter(p=>p.id==="inbox"||(/personal|perso|weekend|to.?do/i.test(p.name||"")&&!PROJ_RE.test(p.name||""))).map(p=>p.id),
    projects:(ps.find(p=>PROJ_RE.test(p.name||""))||{}).id||""};
  ROLES.forEach(([k,,re])=>{m[k]=(find(re)||{}).id||""});
  return m;
}
function ttMap(){const a=autoMap(),s=S.settings.ttMap||{};const out={...a};for(const k in s)if(s[k]!==undefined&&s[k]!==null)out[k]=s[k];if(out.bucket&&/dream|r[eê]ve/i.test(projName(out.bucket))&&a.bucket)out.bucket=a.bucket;return out}
const projName=id=>{const p=S.tt.projects.find(p=>p.id===id);return p?p.name:"List"};
function neededLists(){const m=ttMap();return [...new Set([...(m.todo||[]),m.projects,...ROLES.map(r=>m[r[0]])].filter(Boolean))]}

async function ttLoadAll(){
  if(!MCP)return;
  S.tt.state="loading";setStatus();render();
  try{S.tt.projects=arr(await call("list_projects",{},true)).filter(p=>!p.closed);S.tt.state="ok";S.tt.err=null}
  catch(e){S.tt.state="error";S.tt.err=e;setStatus();render(true);return}
  S.tt.loadedAt=Date.now();setStatus();render();
  await Promise.all([ttLoadLists(),ttLoadToday()]);
  rollover();
}
async function ttLoadList(id){
  const L=S.tt.lists[id]||(S.tt.lists[id]={tasks:[],columns:[],err:null,loading:true});L.loading=true;
  try{const p=await call("get_project_with_undone_tasks",{project_id:id},true);L.tasks=arr(p&&p.tasks?p.tasks:p).map(nt);L.columns=((p&&p.columns)||[]).slice().sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0));L.err=null}
  catch(e){L.err=e}
  L.loading=false;render();
}
const ttLoadLists=()=>Promise.all(neededLists().map(ttLoadList));
/* Ask TickTick for tasks due on Steady Days' own day (which turns over at 4am),
   not TickTick's calendar "today", so late nights still show the right tasks. */
async function tasksForDay(k,fallback){
  const start=dueISO(k).replace(/([+-]\d\d)(\d\d)$/,"$1:$2");const end=start.replace("T00:00:00","T23:59:59");
  try{return arr(await call("list_undone_tasks_by_date",{search:{startDate:start,endDate:end},client_timezone:TZ},true))}
  catch(e){
    if(k!==key(new Date(Date.now()+(fallback==="tomorrow"?864e5:0))))throw e;
    return arr(await call("list_undone_tasks_by_time_query",{query_command:fallback,client_timezone:TZ},true));
  }
}
async function ttLoadToday(){
  try{S.tt.today=(await tasksForDay(today(),"today")).map(nt).filter(t=>t.kind!=="NOTE").sort(byDue);S.tt.todayErr=null}
  catch(e){S.tt.todayErr=e}
  render();
}
async function ttLoadHabits(){
  try{S.tt.habits=arr(await call("list_habits",{},true)).filter(h=>h.status===0||h.status==null).sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0));S.tt.hErr=null}
  catch(e){S.tt.hErr=e;render();return}
  const ids=S.tt.habits.map(h=>h.id);
  if(ids.length){
    try{
      const r=arr(await call("get_habit_checkins",{habit_ids:ids,from_stamp:stamp(addDays(today(),-30)),to_stamp:stamp(today()),client_timezone:TZ},true));
      const c={};r.forEach(x=>{const m=c[x.habitId]=c[x.habitId]||{};(x.checkins||[]).forEach(k=>{m[k.stamp]={value:k.value||0,status:k.status,id:k.id}})});
      S.tt.checks=c;
    }catch(e){S.tt.hErr=e}
  }
  render();
}

/* ---------- undo (5 minutes) ---------- */
const UNDO_MS=5*60*1000;
S.undo=(()=>{try{return JSON.parse(localStorage.getItem("sd-undo")||"[]").filter(u=>Date.now()-u.at<UNDO_MS)}catch(_){return []}})();
let undoBarHidden=false;
function saveUndo(){try{localStorage.setItem("sd-undo",JSON.stringify(S.undo))}catch(_){}}
function pushUndo(entry){entry.uid=uid();entry.at=Date.now();S.undo.unshift(entry);S.undo=S.undo.slice(0,20);saveUndo();undoBarHidden=false;tickUndo();render()}
const undoLabel=u=>u.label||(u.kind==="tt"?`Completed “${u.title}”`:"");
function tickUndo(){
  const before=S.undo.length;S.undo=S.undo.filter(u=>Date.now()-u.at<UNDO_MS);
  if(S.undo.length!==before){saveUndo();render()}
  const bar=$("#undobar"),u=S.undo[0];
  if(!u||undoBarHidden){bar.hidden=true;document.body.classList.remove("has-undo");return}
  const left=Math.max(0,UNDO_MS-(Date.now()-u.at));
  $("#undo-label").textContent=undoLabel(u);
  $("#undo-time").textContent=Math.floor(left/60000)+":"+pad(Math.floor(left/1000)%60);
  bar.hidden=false;document.body.classList.add("has-undo");
  document.querySelectorAll("[data-undo-left]").forEach(el=>{const x=S.undo.find(v=>v.uid===el.dataset.undoLeft);if(x){const l=Math.max(0,UNDO_MS-(Date.now()-x.at));el.textContent=Math.floor(l/60000)+":"+pad(Math.floor(l/1000)%60)}});
}
setInterval(tickUndo,1000);
async function runUndo(uidv){
  const u=S.undo.find(x=>x.uid===uidv);if(!u)return;
  S.undo=S.undo.filter(x=>x.uid!==uidv);saveUndo();tickUndo();
  try{
    if(u.kind==="docall"){editDoc(u.doc,d=>{d.items=u.items});toast("Restored the earlier version")}
    else if(u.kind==="doc"){
      editDoc(u.doc,d=>{const i=d.items.findIndex(x=>x.id===u.item.id);if(i>=0)d.items[i]=u.item;else d.items.splice(Math.min(u.index??0,d.items.length),0,u.item)});
      if(u.buy)editDay(u.buy.date,d=>{d.purchases=d.purchases.filter(p=>p.id!==u.buy.id)});
      toast("Restored");
    }else if(u.kind==="tt"){
      await call("update_task",{task_id:u.tid,task:{id:u.tid,projectId:u.pid,status:0},client_timezone:TZ});
      if((getDay(today()).top3||[]).some(x=>x.id===u.tid))editDay(today(),d=>{d.top3=d.top3.map(x=>x.id===u.tid?{...x,done:false}:x)},{silent:true});
      if(u.buy)editDay(u.buy.date,d=>{d.purchases=d.purchases.filter(p=>p.id!==u.buy.id)});
      toast(`Restored “${u.title}” in TickTick`);
      ttLoadLists();ttLoadToday();
    }else{
      const restore={meal:d=>d.meals.unshift(u.item),purchase:d=>d.purchases.unshift(u.item),progress:d=>{d.progress=d.progress||[];d.progress.push(u.item)},ate:d=>{d.ate=d.ate||[];d.ate.push(u.item)}}[u.what];
      if(restore)editDay(u.date,restore);
      else editSettings(st=>{const key={todo:"todos",habit:"habits",rem:"reminders",project:"projects"}[u.what];if(key)st[key].splice(Math.min(u.index??0,st[key].length),0,u.item)});
      toast("Restored");
    }
  }catch(e){S.undo.unshift(u);saveUndo();tickUndo();toast(ttErrToast(e))}
  render(true);
}
function recentBox(filter){
  const items=S.undo.filter(filter||(()=>true));if(!items.length)return "";
  return `<section class="block card recent"><div class="head"><h2>Recently closed</h2><span class="eyebrow">Undo within 5 minutes</span></div>
    <ul class="list">${items.map(u=>`<li><span class="ul">${esc(undoLabel(u))}</span><span class="mono muted small" data-undo-left="${u.uid}"></span><button class="btn ghost sm" data-act="undo" data-id="${u.uid}">Undo</button></li>`).join("")}</ul></section>`;
}
function findTask(tid){for(const k in S.tt.lists){const t=S.tt.lists[k].tasks.find(x=>x.id===tid);if(t)return t}return S.tt.today.find(x=>x.id===tid)||null}
function delLocal(kind,date,id,label){
  // remove one item and remember it for undo
  if(["meal","purchase","progress","ate"].includes(kind)){
    const d=getDay(date);const arrName={meal:"meals",purchase:"purchases",progress:"progress",ate:"ate"}[kind];const item=(d[arrName]||[]).find(x=>x.id===id);if(!item)return;
    editDay(date,dd=>{dd[arrName]=(dd[arrName]||[]).filter(x=>x.id!==id)});
    pushUndo({kind:"local",what:kind,date,item,label:label(item)});
  }else{
    const key={todo:"todos",habit:"habits",rem:"reminders",project:"projects"}[kind];const idx=S.settings[key].findIndex(x=>x.id===id);if(idx<0)return;const item=S.settings[key][idx];
    editSettings(st=>{st[key]=st[key].filter(x=>x.id!==id)});
    pushUndo({kind:"local",what:kind,item,index:idx,label:label(item)});
  }
}

/* rollover: unfinished to-dos from earlier days move to today, once a day */
S.rolled=(()=>{try{const r=JSON.parse(localStorage.getItem("sd-rolled")||"{}");return r.date===today()?r:{date:today(),ids:[],done:false}}catch(_){return {date:today(),ids:[],done:false}}})();
function saveRolled(){try{localStorage.setItem("sd-rolled",JSON.stringify(S.rolled))}catch(_){}}
async function rollover(){
  if(S.rolled.date!==today())S.rolled={date:today(),ids:[],done:false};
  if(S.rolled.done)return;
  const seen=new Set(),over=[];
  for(const id of (ttMap().todo||[])){const L=S.tt.lists[id];if(!L||L.err)return;
    L.tasks.forEach(t=>{if(seen.has(t.id))return;seen.add(t.id);
      if(t.due&&key(new Date(t.due))<today()&&!t.repeat&&t.kind!=="NOTE"&&!L.tasks.some(x=>x.parentId===t.id))over.push(t)})}
  if(over.length){
    const due=dueTodayISO();
    try{await call("batch_update_tasks",{tasks:over.map(t=>({id:t.id,projectId:t.pid,dueDate:due,startDate:due,isAllDay:true,timeZone:TZ}))})}
    catch(e){return}
    S.rolled.ids=[...new Set([...S.rolled.ids,...over.map(t=>t.id)])];
    toast(over.length===1?"1 unfinished task moved to today":over.length+" unfinished tasks moved to today");
  }
  S.rolled.done=true;saveRolled();
  if(over.length){ttLoadToday();ttLoadLists()}
}
async function discardTask(tid,pid){
  const t0=findTask(tid);const title=t0?t0.title:"task";const realPid=(t0&&t0.pid)||pid;
  const snap=JSON.stringify({l:S.tt.lists,t:S.tt.today});
  for(const k in S.tt.lists)S.tt.lists[k].tasks=S.tt.lists[k].tasks.filter(t=>t.id!==tid);
  S.tt.today=S.tt.today.filter(t=>t.id!==tid);render(true);
  try{await call("update_task",{task_id:tid,task:{id:tid,projectId:realPid,status:-1},client_timezone:TZ});
    pushUndo({kind:"tt",tid,pid:realPid,title,label:`Discarded “${title}”`})}
  catch(e){const o=JSON.parse(snap);S.tt.lists=o.l;S.tt.today=o.t;render(true);toast(ttErrToast(e))}
}

/* ---------- Top 3 per day, expandable to 5 with "+2" ---------- */
const topMax=k=>getDay(k).topMax===5?5:3;
const topLabel=k=>"Top "+topMax(k);
const sizeBtn=k=>{const n=(getDay(k).top3||[]).length;return topMax(k)===3?`<button type="button" class="linkbtn" data-act="topsize" data-d="${k}" data-n="5" title="Allow up to 5">+2</button>`:n<=3?`<button type="button" class="linkbtn subtle" data-act="topsize" data-d="${k}" data-n="3" title="Back to 3">Back to 3</button>`:""};

/* bonus tasks: once the Top N is done, add one more at a time, with a gentle reminder */
function doneLine(nBonusDone){
  const h=new Date().getHours();const late=h>=20||h<DAY_START_HOUR;
  if(late&&nBonusDone>0)return "It's getting late. Maybe the best next task is winding down. 🌙";
  if(nBonusDone===0)return `${topLabel(today())} done. That was the day's real work. Anything more is a bonus, not a must.`;
  if(nBonusDone===1)return "Nice. Remember rest is part of the work too.";
  if(nBonusDone===2)return "You're on a roll, and it's also fine to stop here. 🌿";
  return "Plenty done today. Be kind to your evening self.";
}

/* ---------- plan tomorrow's Top 3 ---------- */
async function ttLoadTomorrow(){
  try{S.tt.tomorrow=(await tasksForDay(tmKey(),"tomorrow")).map(nt).filter(t=>t.kind!=="NOTE").sort(byDue);S.tt.tmErr=null}
  catch(e){S.tt.tmErr=e}
  render();
}
const tmKey=()=>addDays(today(),1);
async function setDue(t,k){await call("update_task",{task_id:t.id,task:{id:t.id,projectId:t.pid,dueDate:dueISO(k),startDate:dueISO(k),isAllDay:true,timeZone:TZ},client_timezone:TZ})}
async function toggleTomorrowTop(id){
  const tk=tmKey();const cur=getDay(tk).top3||[];const entry=cur.find(x=>x.id===id);
  if(entry){
    editDay(tk,d=>{d.top3=(d.top3||[]).filter(x=>x.id!==id);if(!d.top3.length)d.topDone=false});
    if(entry.moved){try{await setDue({id,pid:entry.pid},today());toast(`Moved “${entry.title}” back to today`)}catch(e){toast(ttErrToast(e))}ttLoadToday();ttLoadTomorrow()}
    return;
  }
  if(cur.length>=topMax(tk)){toast(topMax(tk)===3?"Tomorrow's Top 3 is full. Unstar one, or tap +2 for room for 5.":"Tomorrow's Top 5 is full. Unstar one first.");return}
  const fromTm=(S.tt.tomorrow||[]).find(x=>x.id===id),fromToday=S.tt.today.find(x=>x.id===id);const t=fromTm||fromToday;if(!t)return;
  if(!fromTm){
    try{await setDue(t,tk)}catch(e){toast(ttErrToast(e));return}
    editDay(today(),d=>{if(d.top3)d.top3=d.top3.filter(x=>x.id!==id)});
    toast(`Moved “${plainTitle(t.title)}” to tomorrow`);
  }
  editDay(tk,d=>{d.top3=[...(d.top3||[]),{id:t.id,title:plainTitle(t.title),pid:t.pid,moved:!fromTm}]});
  if(!fromTm){ttLoadToday();ttLoadTomorrow()}
}
async function addTomorrowTask(title){
  const tk=tmKey();
  try{
    const r=await call("create_task",{task:{title,isAllDay:true,dueDate:dueISO(tk),startDate:dueISO(tk),timeZone:TZ},client_timezone:TZ});
    const t=r&&(r.id?r:r.result);const cur=getDay(tk).top3||[];
    if(t&&t.id&&cur.length<topMax(tk)){editDay(tk,d=>{d.top3=[...(d.top3||[]),{id:t.id,title,pid:t.projectId||"",moved:false}]});toast("Added for tomorrow and starred")}
    else toast("Added for tomorrow");
  }catch(e){toast(ttErrToast(e));return}
  ttLoadTomorrow();
}
function planPanel(){
  const tk=tmKey();const top=getDay(tk).top3||[];const ids=top.map(x=>x.id);
  const tm=S.tt.tomorrow||[];const td=S.tt.today.filter(t=>!tm.some(x=>x.id===t.id));
  const row=(t,from)=>{const on=ids.includes(t.id);return `<li class="trow"><button class="starbtn" data-act="top3tm" data-id="${t.id}" aria-pressed="${on}" aria-label="${on?"Remove from tomorrow's Top 3":"Add to tomorrow's Top 3"}">${on?"★":"☆"}</button><div class="tmain"><span>${esc(plainTitle(t.title))}</span>${from==="today"?`<div class="tmeta"><span class="pill soft">still open today</span></div>`:""}</div></li>`};
  return `<div class="plan">
    <div class="head"><h3>Tomorrow's ${topLabel(tk)}</h3><span class="topmeta"><span class="mono muted">${top.length}/${topMax(tk)} · ${fmtDay(tk,{weekday:"long"})}</span>${sizeBtn(tk)}</span></div>
    ${top.length?`<ol class="planpicks">${top.map(x=>`<li>${esc(x.title)}${x.moved?` <span class="muted small">(from today)</span>`:""}</li>`).join("")}</ol>`:`<p class="muted small">Star up to ${topMax(tk)} tasks for tomorrow. Picking one of today's open tasks moves it to tomorrow in TickTick.</p>`}
    ${S.tt.tmErr?ttErrBox(S.tt.tmErr):S.tt.tomorrow==null?`<p class="empty">Loading tomorrow…</p>`:`
    ${tm.length?`<span class="eyebrow">Due tomorrow</span><ul class="list">${tm.map(t=>row(t,"tomorrow")).join("")}</ul>`:""}
    ${td.length?`<span class="eyebrow">Still open today</span><ul class="list">${td.map(t=>row(t,"today")).join("")}</ul>`:""}
    ${!tm.length&&!td.length?`<p class="empty">Nothing lined up for tomorrow yet. Add something below.</p>`:""}`}
    <form class="addrow" data-form="tmadd"><input type="text" id="tmadd-new" placeholder="Add a task for tomorrow" autocomplete="off"><button class="btn">Add</button></form>
    <div><button class="btn ghost sm" data-act="planopen">Done planning</button></div>
  </div>`;
}

/* ---------- morning reminder: the next few days' pointer + Top 3, read by the 7:30 scheduled nudge ---------- */
let lastReminder="";
function pointerFor(k){const n=dayNum(k);const [tid,tname]=THEMES[((n%4)+4)%4];const list=POINTERS[tid];const p=list[((Math.floor(n/4)%list.length)+list.length)%list.length];return {theme:tname,text:p[0],source:p[1],tryToday:p[2]}}
function saveReminderNote(){
  if(!S.live||!S.db)return;
  const days={};[0,1,2].forEach(i=>{const k=addDays(today(),i);days[k]={dayCount:dayNum(k)-dayNum(S.settings.startDay||START_DAY)+1,pointer:pointerFor(k),top3:(getDay(k).top3||[]).filter(x=>!x.done).map(x=>x.title),meals:(getDay(k).mealPlan||[]).map(x=>((SLOTS.find(y=>y[0]===x.slot)||["",""])[1]+": "+x.text).trim())}});
  const body={days};const sig=JSON.stringify(body);if(sig===lastReminder)return;lastReminder=sig;
  saveLater("reminder",()=>{S.db.doc("reminder/next").set({...body,updated:new Date().toISOString()}).catch(()=>{lastReminder=""})},1500);
}

/* TickTick actions */
function dueTodayISO(){return dueISO(today())}
function dueISO(k){const [yy,mm,dd]=k.split("-").map(Number);const d=new Date(yy,mm-1,dd);const o=-d.getTimezoneOffset();const s=o>=0?"+":"-";const a=Math.abs(o);return k+"T00:00:00"+s+pad(Math.floor(a/60))+pad(a%60)}
async function addTask(listId,title,{dueToday=false}={}){
  const task={title};
  if(listId&&listId!=="inbox")task.projectId=listId;
  if(dueToday){task.isAllDay=true;task.dueDate=dueTodayISO();task.startDate=task.dueDate;task.timeZone=TZ}
  try{await call("create_task",{task,client_timezone:TZ});toast("Added to TickTick")}
  catch(e){toast(ttErrToast(e));return}
  if(listId&&S.tt.lists[listId])ttLoadList(listId);
  if(dueToday)ttLoadToday();
}
async function completeTask(tid,pid,msg,extra){
  const t0=findTask(tid);const title=t0?t0.title:"task";const realPid=(t0&&t0.pid)||pid;
  const snap=JSON.stringify({l:S.tt.lists,t:S.tt.today});
  for(const k in S.tt.lists)S.tt.lists[k].tasks=S.tt.lists[k].tasks.filter(t=>t.id!==tid);
  S.tt.today=S.tt.today.filter(t=>t.id!==tid);render(true);
  try{await call("complete_task",{project_id:realPid,task_id:tid});if((getDay(today()).top3||[]).some(x=>x.id===tid))editDay(today(),d=>{d.top3=d.top3.map(x=>x.id===tid?{...x,done:true}:x)},{silent:true});if(msg)toast(msg);pushUndo({kind:"tt",tid,pid:realPid,title,...(extra||{})})}
  catch(e){const o=JSON.parse(snap);S.tt.lists=o.l;S.tt.today=o.t;render(true);toast(ttErrToast(e))}
}
async function moveTask(tid,colId){
  let t=null;for(const k in S.tt.lists){t=S.tt.lists[k].tasks.find(x=>x.id===tid)||t}
  if(!t)return;const prev=t.columnId;t.columnId=colId;render(true);
  try{await call("update_task",{task_id:t.id,task:{id:t.id,projectId:t.pid,columnId:colId},client_timezone:TZ});toast("Moved in TickTick")}
  catch(e){t.columnId=prev;render(true);toast(ttErrToast(e))}
}

/* ---------- Wishlist: lives in Steady Days. Needs are ready; wants cool off first (30 or 60 days) ---------- */
const ageDays=t=>t&&t.created?dayNum(today())-dayNum(key(new Date(t.created))):null;
const norm=x=>String(x||"").replace(/\[([^\]]*)\]\([^)]*\)/g,"$1").trim().toLowerCase();
const plainTitle=t=>String(t||"").replace(/\[([^\]]*)\]\([^)]*\)/g,"$1").trim();
S.wish={items:[],imported:false};S.backlog={items:[]};
function editDoc(id,fn,{silent=false}={}){const d=JSON.parse(JSON.stringify(S[id]));fn(d);S[id]=d;
  if(silent)saveLater(id,()=>queueWrite(id,{...S[id],kind:id}));else{queueWrite(id,{...d,kind:id});render(true)}}
const daysTo=k=>dayNum(k)-dayNum(today());
const waitedOf=it=>Math.max(0,dayNum(it.closed||today())-dayNum(it.added||today()));
const safeUrl=u=>/^https?:\/\/\S+$/i.test(String(u||"").trim())?String(u).trim():"";
const shortDay=k=>fmtDay(k,{day:"numeric",month:"short"});
function wState(it){
  if(it.status!=="open")return it.status;
  if(it.kind==="want"&&it.until){if(it.until>today())return "cooling";if(!it.checked)return "check"}
  return "ready";
}
const openWish=()=>S.wish.items.filter(x=>x.status==="open");
function wishTasks(){return openWish().map(x=>({id:x.id,title:x.title}))}
const findWish=id=>S.wish.items.find(x=>x.id===id);
function addWish(title,kind="want",hold=30){
  const it={id:uid(),title,kind,hold:kind==="want"?hold:0,added:today(),until:kind==="want"&&hold?addDays(today(),hold):null,checked:false,status:"open",prio:0,note:"",link:""};
  editDoc("wish",d=>{d.items.unshift(it)});
  toast(it.until?`Added. It's cooling off until ${shortDay(it.until)}.`:"Added to your wishlist");
}
function letGo(id){const i=S.wish.items.findIndex(x=>x.id===id);if(i<0)return;const it=S.wish.items[i];
  editDoc("wish",d=>{Object.assign(d.items[i],{status:"letgo",closed:today()})});
  pushUndo({kind:"doc",doc:"wish",item:it,label:`Let go of “${it.title}”`});toast("Let go. That's money kept. 🌿")}
function buyWish(id,price,kind,why){
  const i=S.wish.items.findIndex(x=>x.id===id);if(i<0)return;const it=S.wish.items[i];const pidBuy=uid();const waited=waitedOf(it);const early=wState(it)==="cooling";
  editDoc("wish",d=>{Object.assign(d.items[i],{status:"bought",closed:today(),price,...(early?{why:why||""}:{})})});
  editDay(today(),d=>{d.purchases.unshift({id:pidBuy,item:it.title,price:Math.round(price*100)/100,kind:kind||(it.kind==="need"?"need":"want"),wl:{wid:id,waited,...(early?{early:true,why:why||""}:{})}})});
  pushUndo({kind:"doc",doc:"wish",item:it,buy:{date:today(),id:pidBuy},label:`Bought “${it.title}”`});
  toast(early?"Logged. Thanks for pausing to name why.":"Logged in Purchases. Enjoy it!");
}
/* one-time move of the TickTick wishlist into Steady Days; TickTick itself is left untouched */
function ttWishSource(){const id=ttOn()&&ttMap().wishlist;const L=id&&S.tt.lists[id];if(!L||L.err||L.loading&&!L.tasks.length||S.wish.imported)return null;return L}
function ttWishItems(L){
  const parents=new Set(L.tasks.filter(t=>L.tasks.some(x=>x.parentId===t.id)).map(t=>t.id));
  const have=new Set(S.wish.items.map(x=>x.ttId).filter(Boolean));
  return L.tasks.filter(t=>t.kind!=="NOTE"&&!parents.has(t.id)&&!have.has(t.id)).map(t=>{
    const m=/\[([^\]]*)\]\((https?:[^)]+)\)/.exec(t.title||"");
    const body=String(t.content||"").replace(/!\[[^\]]*\]\([^)]*\)/g,"").replace(/\\([()\[\]])/g,"$1").replace(/\n{3,}/g,"\n\n").trim();
    const url=m?m[2]:((/https?:\/\/\S+/.exec(body)||[])[0]||"");
    const added=t.created?key(new Date(t.created)):today();const age=dayNum(today())-dayNum(added);
    return {id:uid(),ttId:t.id,title:plainTitle(t.title)||"(untitled)",note:body,link:url,prio:({5:3,3:2,1:1})[t.priority]||0,kind:"want",hold:30,
      added,until:age<30?addDays(added,30):null,checked:false,status:"open",from:"tt"};
  });
}
function importWish(){const L=ttWishSource();if(!L)return;const items=ttWishItems(L);
  editDoc("wish",d=>{d.items=[...d.items,...items];d.imported=true});toast(`Brought over ${items.length} item${items.length===1?"":"s"}`)}

const wishBuyForm=(it,early)=>`<form class="wbuy" data-form="buy" data-id="${it.id}">

    ${st==="check"?wishCheckBtns(it):""}${buy?wishBuyForm(it,st==="cooling"):""}${open?wishEdit(it,link):""}</li>`;

const wishCheckBtns=it=>`<div class="btnrow"><button type="button" class="btn sm" data-act="wkeep" data-id="${it.id}">Yes, it's earned its place</button><button type="button" class="btn ghost sm" data-act="wletgo" data-id="${it.id}">Let it go</button><button type="button" class="btn ghost sm" data-act="wmore" data-id="${it.id}">Another month</button></div>`;

  </div>`;

/* Today: once a cooling-off ends, ask once */
function wishCheckCard(){
  const it=openWish().find(x=>wState(x)==="check");if(!it)return "";

V.wishlist=()=>{
  const items=openWish();const prioSort=(a,b)=>(b.prio||0)-(a.prio||0)||(a.added<b.added?-1:a.added>b.added?1:0);

/* ---------- Backlog: books, games, series. At most 2 "Now" per kind ---------- */
const BL=[["book","📚","Books","Book","reading"],["manga","📖","Manga","Manga","reading"],["game","🎮","Games","Game","playing"],["series","📺","Watch","Series / film / anime","watching"]];

/* ---------- Prettify: Claude suggests tidier titles (and author/year for media); nothing changes until you accept ---------- */
S.pretty=null;
const PRETTY_ERR={not_granted:"Prettify needs permission to ask Claude. You can allow it from this page's permissions.",rate_limited:"Claude is busy right now. Try again in a little while.",session_expired:"Sign in to Claude again, then retry.",invalid_json:"The suggestions came back in a muddle. Try again.",refused:"Claude couldn't help with these items.",empty_completion:"No suggestions came back. Try again."};
const prettyPool=doc=>doc==="wish"?openWish():S.backlog.items.filter(x=>x.status!=="dropped");
const prettyNew=doc=>prettyPool(doc).filter(x=>!x.pretty);
function prettyPrompt(doc,items){
  if(doc==="backlog")return `You tidy a personal media backlog. For each item, give the work's title as it is commonly known (correct spelling and capitalisation; keep French or romanised Japanese titles if that is how the item is written, unless the English title is clearly what is meant), the creator, and the year of first release.
Creator: book = author; manga = mangaka/author; game = developer studio; film = director; series or anime = creator or studio.
If you are not confident which work is meant, leave "by" and "year" empty and only fix spelling and capitalisation. Never invent details.
Return ONLY a JSON array, one object per item that should change: {"id": string, "title": string, "by": string, "year": number|null}. Leave out items that are already correct and complete.
Items:
${JSON.stringify(items.map(x=>({id:x.id,kind:blT(x.type)[3],title:x.title,by:x.by||"",year:x.year||null})))}`;
  return `You tidy a personal shopping wishlist written in a mix of French and English.
For each item, suggest a clean title: fix spelling, capitalisation and spacing, keep brand and product names, keep the language it is written in (do not translate), keep it short. Example: "Sac randonnée Oakley " -> "Sac de randonnée Oakley".
If the item's note is clearly a list of several separate products the person wants (for example a list of albums or books), also suggest splitting it: "split" = a list of clean item titles, one per product, skipping lines marked done with ✅ and lines that are not products.
Return ONLY a JSON array, one object per item that should change: {"id": string, "title": string, "split": string[] (optional)}. Leave out items that are already fine.
Items:
${JSON.stringify(items.map(x=>({id:x.id,title:x.title,note:(x.note||"").slice(0,1200)})))}`;
}
async function runPretty(doc,all){
  if(!SAMPLE)return;
  const items=(all?prettyPool(doc):prettyNew(doc));if(!items.length){toast("Nothing new to tidy");return}
  S.pretty={doc,state:"loading",rows:[],sent:items.map(x=>x.id),n:items.length};render(true);window.scrollTo({top:0});
  try{
    const rows=[];
    for(let i=0;i<items.length;i+=40){
      const chunk=items.slice(i,i+40);
      const out=await SAMPLE.json(prettyPrompt(doc,chunk),{modelTier:"default"});
      (Array.isArray(out)?out:[]).forEach(o=>{const it=chunk.find(x=>x.id===o.id);if(!it||!o||typeof o.title!=="string")return;
        const title=o.title.trim()||it.title;const by=doc==="backlog"?String(o.by||"").trim():"";const year=doc==="backlog"&&+o.year>0?Math.round(+o.year):null;
        const split=doc==="wish"&&Array.isArray(o.split)?o.split.map(t=>String(t).trim()).filter(Boolean).slice(0,60):[];
        const changed=!(title===it.title&&(doc!=="backlog"||(by===(it.by||"")&&year===(it.year||null))));
        if(changed||split.length)rows.push({id:it.id,before:it.title,beforeMeta:[it.by,it.year].filter(Boolean).join(" · "),title,by,year,split,changed,on:changed,splitOn:false});});
      if(S.pretty&&S.pretty.state==="loading")S.pretty.progress=Math.min(items.length,i+40);
    }
    if(!S.pretty||S.pretty.doc!==doc)return;
    S.pretty={...S.pretty,state:"ready",rows};
  }catch(e){if(S.pretty)S.pretty={...S.pretty,state:"error",err:PRETTY_ERR[e&&e.code]||"Something went wrong. Try again in a moment."}}
  render(true);
}
function applyPretty(){
  const P=S.pretty;if(!P||P.state!=="ready")return;const doc=P.doc;const before=JSON.parse(JSON.stringify(S[doc].items));
  const pick=P.rows.filter(r=>r.on||r.splitOn);let n=0;
  editDoc(doc,d=>{
    d.items.forEach(x=>{if(P.sent.includes(x.id))x.pretty=true});
    pick.forEach(r=>{const i=d.items.findIndex(x=>x.id===r.id);if(i<0)return;const x=d.items[i];n++;
      if(r.on){x.title=r.title;if(doc==="backlog"){if(r.by)x.by=r.by;else delete x.by;if(r.year)x.year=r.year;else delete x.year}}
      if(r.splitOn&&r.split.length){const parts=r.split.map(t=>({...x,id:uid(),title:t,note:"",link:"",pretty:true,ttId:undefined}));d.items.splice(i,1,...parts)}
    });
  });
  pushUndo({kind:"docall",doc,items:before,label:`Prettified ${n} item${n===1?"":"s"}`});
  S.pretty=null;toast(n?`Tidied ${n} item${n===1?"":"s"}`:"Nothing changed");render(true);
}
function prettyBtn(doc){
  if(!SAMPLE||S.pretty&&S.pretty.doc===doc)return "";const n=prettyNew(doc).length,all=prettyPool(doc).length;if(!all)return "";
  return `<button type="button" class="linkbtn" data-act="pretty" data-doc="${doc}" data-all="${n?"":"1"}" title="Suggest tidier titles${doc==="backlog"?", with author and year":""}. You review before anything changes.">✨ Prettify${n&&n<all?` ${n} new`:n?"":" again"}</button>`;
}
function prettyPanel(doc){
  const P=S.pretty;if(!P||P.doc!==doc)return "";
  if(P.state==="loading")return `<section class="block card pretty"><div class="head"><h2>✨ Prettify</h2><button type="button" class="linkbtn subtle" data-act="prettycancel">Cancel</button></div><p class="muted small" style="margin:0">Asking Claude to tidy ${P.n} item${P.n===1?"":"s"}${P.progress?` (${P.progress} done)`:""}… this can take up to a minute.</p></section>`;
  if(P.state==="error")return `<section class="block card pretty"><div class="head"><h2>✨ Prettify</h2><button type="button" class="linkbtn subtle" data-act="prettycancel">Close</button></div><p class="small" style="margin:0">${esc(P.err)}</p></section>`;
  const on=P.rows.filter(r=>r.on||r.splitOn).length;
  return `<section class="block card pretty"><div class="head"><h2>✨ Suggested changes</h2><span class="mono muted">${P.rows.length}</span></div>
    ${P.rows.length?`<p class="muted small" style="margin:0">Untick anything you'd rather keep as it is.${doc==="backlog"?" Authors and years come from Claude's general knowledge, so give them a glance.":""}</p>
    <ul class="list prows">${P.rows.map((r,i)=>`<li>${r.changed?`<label class="prow"><input type="checkbox" class="check" data-act="prow" data-i="${i}" ${r.on?"checked":""}><span class="pdiff"><span class="pbefore">${esc(r.before)}${r.beforeMeta?` · ${esc(r.beforeMeta)}`:""}</span><span class="pafter">${esc(r.title)}${r.by||r.year?` <span class="muted small">· ${esc([r.by,r.year].filter(Boolean).join(" · "))}</span>`:""}</span></span></label>`:`<span class="pafter">${esc(r.before)}</span>`}
      ${r.split.length?`<label class="prow${r.changed?" psplit":""}"><input type="checkbox" class="check" data-act="psplit" data-i="${i}" ${r.splitOn?"checked":""}><span class="small">${r.changed?"Also split":"Split"} into ${r.split.length} separate items: <span class="muted">${esc(r.split.slice(0,6).join(", "))}${r.split.length>6?"…":""}</span></span></label>`:""}</li>`).join("")}</ul>
    <div class="btnrow"><button type="button" class="btn" data-act="prettyapply" ${on?"":"disabled"}>Apply ${on} change${on===1?"":"s"}</button><button type="button" class="btn ghost" data-act="prettycancel">Cancel</button></div>`
    :`<p class="small" style="margin:0">Everything already looks tidy. 🌿</p><div><button type="button" class="btn ghost" data-act="prettyapply">Done</button></div>`}
  </section>`;
}

async function ttDump(){
  const ps=arr(await call("list_projects",{},true)).filter(p=>!p.closed);
  const projects=[],tasks=[],columns={};
  const keep=["id","projectId","title","content","desc","startDate","dueDate","timeZone","isAllDay","priority","repeatFlag","repeatFrom","status","parentId","columnId","kind","createdTime","modifiedTime","tags","items","sortOrder"];
  for(const p of ps){
    const r=await call("get_project_with_undone_tasks",{project_id:p.id},true);
    if(p.id!=="inbox")projects.push({id:p.id,name:p.name,kind:p.kind||"TASK",viewMode:p.viewMode||"list",sortOrder:p.sortOrder||0,color:p.color||null});
    arr(r&&r.tasks?r.tasks:r).forEach(t=>{const o={};keep.forEach(k=>{if(t[k]!==undefined&&t[k]!==null)o[k]=t[k]});tasks.push(o)});
    if(r&&r.columns&&r.columns.length)columns[p.id]=r.columns.map(c=>({id:c.id,name:c.name,sortOrder:c.sortOrder||0}));
  }
  return {projects,tasks,columns,comments:[]};
}

/* ---------- Weekly recap ---------- */
const weekStart=k=>{const [y,m,d]=k.split("-").map(Number);const dow=new Date(y,m-1,d).getDay();return addDays(k,-((dow+6)%7))};
const dowOf=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d).getDay()};
function weekMoments(days){
  const out=[];
  days.forEach(k=>{const d=getDay(k);
    (d.gratitude||[]).forEach((g,i)=>{if(g&&g.trim())out.push({k,kind:"Grateful",text:g.trim()})});

const NUDGE_TASK="trig_01WNVxsADqavGjR9DpeSyvho";const CCR="Claude Code Remote";

async function loadNudge(){
  if(!MCP){S.nudge={state:"error",enabled:null,err:{code:"capability_disabled"}};render(true);return}
  S.nudge={...S.nudge,state:"loading"};render(true);
  try{
    let cursor=null,found=null;
    for(let i=0;i<5&&!found;i++){
      const r=(await MCP.callTool(CCR,"list_triggers",cursor?{recurring:true,limit:100,cursor}:{recurring:true,limit:100},{cache:false})).payload||{};
      found=(r.data||[]).find(t=>t.id===NUDGE_TASK)||null;cursor=r.next_cursor;if(!cursor)break;
    }
    S.nudge=found?{state:"ok",enabled:!!found.enabled,next:found.next_run_at||null,err:null}:{state:"missing",enabled:null,err:null};
  }catch(e){S.nudge={state:"error",enabled:null,err:e}}
  render(true);
}

  if(a==="viewday"){const dd=b.dataset.d;S.viewDay=dd===today()?null:dd;S.open={};S.gratShow=1;S.ateSlot=null;S.progOpen=false;render(true);window.scrollTo({top:0})}
  if(a==="ateslot"){S.ateSlot=b.dataset.s;render(true);const el=document.getElementById("ate-new");if(el)el.focus()}
  if(a==="delate")delLocal("ate",vday(),id,x=>`Deleted “${x.text}” from what you ate`);

  if(a==="wmore"){editDoc("wish",d=>{const x=d.items.find(y=>y.id===id);if(x){x.until=addDays(today(),30);x.checked=false;x.extended=(x.extended||0)+1}});toast("Another month to see how you feel")}
  if(a==="wprio"){const pv=+b.dataset.p;editDoc("wish",d=>{const x=d.items.find(y=>y.id===id);if(x)x.prio=pv});toast("Priority: "+["none","low","medium","high"][pv])}
  if(a==="wkind"){const k=b.dataset.k;editDoc("wish",d=>{const x=d.items.find(y=>y.id===id);if(!x)return;x.kind=k;if(k==="need"){x.until=null}else{x.until=addDays(today(),30);x.checked=false;x.hold=30}});toast(k==="need"?"Moved to needs. It's ready.":"Cooling off for 30 days")}
  if(a==="wimport")importWish();

  if(a==="edit"){S.edit={k:b.dataset.k,date:b.dataset.date,id};render(true);const el=document.getElementById("ed-text");if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}}

  if(a==="export")exportData();
  if(a==="bltype"){S.blType=b.dataset.t;S.blFinish=null;render(true)}
  if(a==="blstart"){const it=S.backlog.items.find(x=>x.id===id);if(!it)return;const n=S.backlog.items.filter(x=>x.type===it.type&&x.status==="now").length;const T=blT(it.type);
    if(n>=NOW_MAX){toast(`You already have ${NOW_MAX} ${T[0]==="series"?"things to watch":T[0]==="manga"?"manga":T[2].toLowerCase()} on the go. Finish, pause or drop one first.`);return}
    editDoc("backlog",d=>{const x=d.items.find(y=>y.id===id);Object.assign(x,{status:"now",started:today()})});toast(`Enjoy! Now ${T[4]}: ${it.title}`)}

document.addEventListener("change",e=>{

  if(b.dataset.act==="pnote"){const t=b.dataset.t,val=b.value;editSettings(st=>{st.pnotes=st.pnotes||{};if(val.trim())st.pnotes[t]={t:val,at:today()};else delete st.pnotes[t]},{silent:true})}

  if(b.dataset.act==="proud")editDay(vday(),d=>{d.proud=b.value},{silent:true});
  if(b.dataset.act==="better")editDay(vday(),d=>{d.better=b.value},{silent:true});

});
document.addEventListener("focusout",()=>{setTimeout(()=>{if(deferred)render()},0)});
document.addEventListener("submit",e=>{
  e.preventDefault();const form=e.target;const f=form.dataset.form;const v=id=>{const el=document.getElementById(id);return el?(el.value||"").trim():""};
  const clear=id=>{const el=document.getElementById(id);if(el)el.value=""};
  if(f==="todo"){const t=v("todo-new");if(!t)return;editSettings(s=>{s.todos.unshift({id:uid(),text:t,done:false})})}
  if(f==="habit"){const t=v("habit-new");if(!t)return;editSettings(s=>{s.habits.push({id:uid(),name:t})})}
  if(f==="reminder"){const t=v("rem-new");if(!t)return;editSettings(s=>{s.reminders.push({id:uid(),text:t})})}
  if(f==="meal"){const t=v("meal-new"),dt=v("meal-date")||today();if(!t)return;editDay(dt,d=>{d.meals.unshift({id:uid(),name:t})});toast("Added to your kitchen log")}
  if(f==="purchase"){const t=v("buy-item"),p=parseFloat(v("buy-price"))||0,k=v("buy-kind")||"need",dt=v("buy-date")||today();if(!t)return;
    const match=openWish().find(w=>norm(w.title)===norm(t));
    if(match&&dt===today()){clear("buy-item");buyWish(match.id,p,k,wState(match)==="cooling"?"logged from Purchases":"");return}
    const pidBuy=uid();editDay(dt,d=>{d.purchases.unshift({id:pidBuy,item:t,price:Math.round(p*100)/100,kind:k})});
    if(match)editDoc("wish",d=>{const x=d.items.find(y=>y.id===match.id);if(x)Object.assign(x,{status:"bought",closed:dt})});
    toast(match?"Purchase added and ticked off your wishlist":"Purchase added")}
  if(f==="mealplan"){const t=v("mp-text"),sl=v("mp-slot")||"lunch";if(!t)return;clear("mp-text");editDay(addDays(today(),1),d=>{d.mealPlan=[...(d.mealPlan||[]),{id:uid(),slot:sl,text:t}]})}
  if(f==="ate"){const t=v("ate-new");if(!t)return;const home=document.getElementById("ate-home")?.checked;const slot=v("ate-slot")||(isPastView()?"dinner":slotNow());
    editDay(vday(),d=>{d.ate=d.ate||[];d.ate.push({id:uid(),text:t,slot,home:!!home});if(home)d.meals.unshift({id:uid(),name:t})});
    toast(home?"Logged, and added to your cooking log":"Logged")}
  if(f==="project"){const n=v("proj-name"),g=v("proj-goal");if(!n)return;editSettings(s=>{s.projects.push({id:uid(),name:n,goal:g,status:"active",created:today()})});toast("Project added")}
  if(f==="progress"){
    const pid=form.dataset.pid,idp=pid?"p-"+pid:"tp";
    const p=pid||v(idp+"-pid"),t=v(idp+"-text"),m=parseInt(v(idp+"-mins"))||0,dt=(pid&&v(idp+"-date"))||vday();
    if(!p||!t)return;
    if(!pid)S.progOpen=false;
    const tr=trackable().find(x=>x.id===p);
    editDay(dt,d=>{d.progress=d.progress||[];d.progress.push({id:uid(),pid:p,text:t,mins:m,pname:tr?tr.name:""})});
    if(tr&&tr.tt){
      call("add_comment",{project_id:tr.tt.pid,task_id:tr.tt.id,title:`${fmtDay(dt)} · ${t}${m?` (${m} min)`:""}`})
        .then(()=>toast("Progress logged and added to TickTick"))
        .catch(err=>toast("Progress saved here, but the TickTick note didn't go through. "+(err&&err.code==="needs_reauth"?"Reconnect TickTick.":"")));
    }else toast("Progress logged");
  }
  if(f==="ttadd"){const list=form.dataset.list;const inp=form.querySelector("input[type=text]");const t=(inp.value||"").trim();if(!t)return;inp.value="";addTask(list,t)}
  if(f==="tmadd"){const t=v("tmadd-new");if(!t)return;clear("tmadd-new");addTomorrowTask(t)}
  if(f==="tttoday"){const t=v("tttoday-new");if(!t)return;clear("tttoday-new");addTask("inbox",t,{dueToday:true})}
  if(f==="buy"){
    const it=findWish(form.dataset.id);if(!it)return;const early=wState(it)==="cooling";const why=v("wb-why");
    if(early&&!why){toast("Add a line on why now first");const el=document.getElementById("wb-why");if(el)el.focus();return}
    S.buyOpen=null;buyWish(it.id,parseFloat(v("wb-price"))||0,v("wb-kind")||"want",why);return;
  }
  if(f==="wishadd"){const t=v("wish-new"),k=v("wish-kind")||"want30";if(!t)return;clear("wish-new");addWish(t,k==="need"?"need":"want",k==="want60"?60:30)}
  if(f==="bladd"){const t=v("bl-new"),ty=v("bl-type")||"book";if(!t)return;clear("bl-new");editDoc("backlog",d=>{d.items.unshift({id:uid(),type:ty,title:t,status:"someday",added:today()})});toast("Added to your backlog")}
  if(f==="newlist"){const n=v("newlist-name");if(!n)return;S.newList=false;
    call("create_project",{name:n}).then(()=>{toast("List created");ttLoadAll()}).catch(e=>toast(ttErrToast(e)));return}
  if(f==="edit"){const k=form.dataset.k,dt=form.dataset.date,eid=form.dataset.id,arr=ED_ARR[k];const t=v("ed-text");if(!t){toast("It needs a name");return}
    const home=(document.getElementById("ed-home")||{}).checked;
    S.edit=null;editDay(dt,d=>{const x=(d[arr]||[]).find(y=>y.id===eid);if(!x)return;
      if(k==="ate"){x.text=t;x.slot=v("ed-slot")||x.slot;x.home=!!home}
      if(k==="meal")x.name=t;
      if(k==="buy"){x.item=t;x.price=Math.round((parseFloat(v("ed-price"))||0)*100)/100;x.kind=v("ed-kind")||x.kind}
      if(k==="prog"){x.text=t;const m=parseInt(v("ed-mins"));if(m>0)x.mins=m;else delete x.mins}});
    toast("Saved");return}
  if(f==="bledit"){const bid=form.dataset.id;const t=v("ble-title");if(!t){toast("It needs a title");return}
    const y=parseInt(v("ble-year"));const r=+(form.querySelector('input[name="ble-rate"]:checked')||{}).value||0;
    S.blEdit=null;editDoc("backlog",d=>{const x=d.items.find(z=>z.id===bid);if(!x)return;
      if(x.title!==t)x.pretty=false;x.title=t;x.type=v("ble-type")||x.type;const by=v("ble-by");if(by)x.by=by;else delete x.by;if(y>0)x.year=y;else delete x.year;
      if(x.status==="done"){x.rating=r||null;x.thought=v("ble-thought")}
      if(x.status==="dropped")x.why=v("ble-why")});toast("Saved");return}
  if(f==="bldrop"){const bid=form.dataset.id;const why=v("bl-why");S.blDrop=null;
    editDoc("backlog",d=>{const x=d.items.find(y=>y.id===bid);if(x)Object.assign(x,{status:"dropped",dropped:today(),why})});toast("Dropped. Onwards.");return}
  if(f==="bldone"){const bid=form.dataset.id;const r=+(form.querySelector('input[name="bl-rate"]:checked')||{}).value||0;const th=v("bl-thought");
    S.blFinish=null;editDoc("backlog",d=>{const x=d.items.find(y=>y.id===bid);if(x)Object.assign(x,{status:"done",finished:today(),rating:r||null,thought:th})});toast("Finished! Nice one. 🌿");return}
  const first=form.querySelector("input[type=text]");if(first){setTimeout(()=>{const el=document.getElementById(first.id);if(el)el.focus()},0)}
});
/* new day: switch over by itself, even if the page stayed open */
let lastDay=today();
function checkNewDay(){
  if(today()===lastDay)return false;
  lastDay=today();S.mealPlanOpen=false;S.bonusPick=false;S.open={};S.gratShow=1;S.viewDay=null;S.recapWeek=null;S.showMoreToday=false;S.planOpen=false;S.ptrShift=0;S.remShift=0;S.ateSlot=null;S.progOpen=false;S.buyOpen=null;

  return true;
}

async function connectDb(){
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    const id=user?await user.id():null;
    if(!db||!id){offlineDb();return}
    S.db=db;S.uid=id;S.live=true;setStatus();
    const col=db.collection("data/users/"+id);
    col.doc("settings").onSnapshot(snap=>{
      if(!pending.settings&&!inflight.settings){const d=snap.exists?snap.data():null;
        S.settings={habits:d?.habits||[],reminders:d?.reminders||[],todos:d?.todos||[],projects:d?.projects||[],ttMap:d?.ttMap||null,favs:d?.favs||[],pnotes:d?.pnotes||{},skills:d?.skills||{},highlights:d?.highlights||{}};
        if(ttOn())ttLoadListsMissing();}
      S.settingsReady=true;render();
    },()=>{S.settingsReady=true;render()});
    ["wish","backlog"].forEach(id=>col.doc(id).onSnapshot(snap=>{
      if(!pending[id]&&!inflight[id]&&!debounced[id]){const d=snap.exists?snap.data():null;S[id]={...S[id],...(d||{}),items:(d&&d.items)||[]}}
      render();
    },()=>{}));
    col.where("kind","==","day").orderBy("date","desc").limit(180).onSnapshot(snap=>{
      snap.docs.forEach(doc=>{const d=doc.data();const k="d-"+d.date;if(pending[k]||inflight[k]||debounced[k])return;S.days[d.date]={...blankDay(d.date),...d,gratitude:[0,1,2].map(i=>(d.gratitude||[])[i]||"")}});
      render();
    },()=>toast("Lost connection to your saved entries. Reload to reconnect."));
  }catch(e){offlineDb()}
}
function ttLoadListsMissing(){neededLists().filter(id=>!S.tt.lists[id]).forEach(ttLoadList)}
function offlineDb(){
  S.live=false;S.settingsReady=true;setStatus();
  const b=$("#banner");b.hidden=false;b.textContent="Saving isn't available in this view, so your journal entries will disappear when you leave. Open the page signed in to Claude to keep them.";
  render();
}
async function connectTT(){
  claude.use("sample").then(x=>{SAMPLE=x;render()}).catch(()=>{});
  claude.use("downloads").then(x=>{DL=x;render()}).catch(()=>{});
  try{MCP=await claude.use("mcp")}catch(_){MCP=null}
  if(!MCP){S.tt.state="off";setStatus();render();return}
  ttLoadAll();
}
$("#undo-btn").addEventListener("click",()=>{const u=S.undo[0];if(u)runUndo(u.uid)});
$("#undo-close").addEventListener("click",()=>{undoBarHidden=true;tickUndo()});
tickUndo();
if(!window.claude||!claude.use){S.tt.state="off";offlineDb()}
else{connectDb();connectTT()}
})();
